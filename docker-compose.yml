# 本地 / 单 VPS 的服务栈（spec §99）。
#
# ⚠️ **本文件里不许出现任何真实凭据**（仓库是公开的）。密码一律从 `.env` 取，
# 且用 `${VAR:?...}` 形式：没设就**直接报错停住**，而不是悄悄用空密码起一个
# 谁都能连的数据库。
#
# ⚠️ **这里不用 `env_file: .env`**。宿主机的 `.env` 里 BILLING_DATABASE_URL 指向
# 127.0.0.1（给直接跑 uvicorn 用），整份灌进容器会让容器连回自己。容器要的
# 每一个变量都在下面显式写出来。
#
# 用法见 README「本地起整套栈」。

# 日志上限：没有它，json-file 驱动会一直写到磁盘满。
#
# ⚠️ **json-file 按大小轮转，不按时间。**所以「保留 30 天」这件事**在这里表达
# 不了** —— 下面两个旋钮定的是「本地最多占多少磁盘」，而 T0.9 定的 30 天保留期
# 是**离机那一侧**的属性，要由日志外送的目的地强制（那套设施还不存在）。
# 把两者混为一谈的话，会得到一个「以为留了 30 天、实际按量早就滚掉了」的假象。
#
# 默认 3 × 10m = 每容器最多 30 MB，七个服务合计上限约 210 MB。
# ⚠️ 生产 VPS 只剩 12 GB，而 binlog 也要占（见 docs/deployment.md §3.1）。
x-logging: &logging
  driver: json-file
  options:
    max-size: "${BILLING_LOG_MAX_SIZE:-10m}"
    max-file: "${BILLING_LOG_MAX_FILES:-3}"

# api / celery-worker / celery-beat 跑同一份代码、同一个镜像，只有 command 不同。
x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: acuven-billing-hub:local
  restart: unless-stopped
  logging: *logging
  # ⚠️ 资源限额是 ADR-0002 的收口条件，不是洁癖：单 VPS 上一个失控的 celery
  # worker 能把 MySQL 挤出内存，而表现出来的是「数据库莫名其妙重启」——
  # 一条完全指不回原因的现象。
  #
  # ⚠️ 用 `mem_limit` / `cpus` 短式而不是 `deploy.resources.limits`。两种写法
  # 在 compose v2 下**都真的生效**（实测 `docker inspect` 的 HostConfig.Memory
  # 都被设上了），选短式只是为了不和本文件里 secrets 那条「swarm-only 选项会被
  # 静默忽略」的教训混淆。
  #
  # 数值按生产 VPS 的实测余量定（1 核 / 可用 1.8 GB，见 docs/deployment.md §3.1）。
  # ⚠️ api 留得比另外两个宽：Argon2 每次并发哈希要 64 MiB。
  mem_limit: ${BILLING_BACKEND_MEM_LIMIT:-384m}
  cpus: ${BILLING_BACKEND_CPUS:-0.5}
  environment:
    BILLING_ENVIRONMENT: local
    BILLING_DEBUG: "false"
    BILLING_LOG_LEVEL: ${BILLING_LOG_LEVEL:-INFO}
    # ⚠️ 密码里出现 @ : / # 会把 DSN 解析切错位置，见 .env.example 的说明。
    BILLING_DATABASE_URL: mysql+pymysql://${BILLING_MYSQL_USER:-billing}:${BILLING_MYSQL_PASSWORD:?set BILLING_MYSQL_PASSWORD in .env (copy .env.example)}@mysql:3306/${BILLING_MYSQL_DATABASE:-billing}?charset=utf8mb4
    BILLING_REDIS_URL: redis://redis:6379/0
    # ⚠️ 这里给的是**路径，不是密钥**。密钥本身由下面的 secrets 挂成文件。
    # 走环境变量的话它会进 /proc/<pid>/environ、崩溃转储，并被子进程继承
    # （ADR-0004 第 2 节）。
    BILLING_JWT_SECRET_FILE: /run/secrets/billing_jwt_key
    # 信封加密的主密钥，同样只给路径。轮换时往这个文件里加一行更高版本的
    # 密钥即可 —— 老行仍按它自己的版本解开（见 app/core/crypto.py）。
    BILLING_MASTER_KEY_FILE: /run/secrets/billing_master_key
    # 本地是 http，Secure cookie 发不出去。生产必须是 true（配置项默认就是 true，
    # 这里显式写出来是为了让「本地不安全」是一次有意识的选择）。
    BILLING_SESSION_COOKIE_SECURE: "false"
    # ⚠️ **不配这个，按来源限流会退化成全局限流。**
    # 经 nginx 时每个请求的直连对端都是 nginx 的容器地址，所有用户共用一个桶 ——
    # 任何人发到第 21 个认证请求，**所有人**都拿 429。审计里的 ip_address 也会
    # 全都一样，取证时没用。
    #
    # 这里写的是 Docker 会用的私有网段。只有直连对端落在其中时才采信
    # `X-Forwarded-For`（那个头客户端可以随便写），逻辑见 app/core/clientip.py。
    BILLING_TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
    # 密码重置链接的基址。本地就是这个栈自己（nginx 发布的那个端口）。
    # ⚠️ 刻意不从请求的 Host 头推：那个头客户端可以随便写，而这里拼出来的是一封
    # **发给用户、带着一把钥匙**的链接 —— 改一个 Host 就能让受害者收到指向攻击者
    # 服务器的信（host header poisoning，密码重置是它最经典的落点）。
    BILLING_FRONTEND_BASE_URL: ${BILLING_FRONTEND_BASE_URL:-http://localhost:${BILLING_HTTP_PORT:-8080}}
    # ⚠️ **本地栈刻意不配 SMTP**（空 host = 未配置，ADR-0009）。开发不需要真实
    # 邮箱凭据：重置令牌与 outbox 行照常落库，投递会重试并留下 warning，
    # 从日志里就能把链接捞出来。配的话密码同样走文件注入，不走环境变量。
    BILLING_SMTP_HOST: ${BILLING_SMTP_HOST:-}
    BILLING_SMTP_PORT: ${BILLING_SMTP_PORT:-587}
    BILLING_SMTP_USERNAME: ${BILLING_SMTP_USERNAME:-}
    BILLING_SMTP_FROM: ${BILLING_SMTP_FROM:-}
    # ⚠️ 这里给的是**路径，不是密码** —— 与 JWT 签名密钥、加密主密钥同一条规矩。
    # 少了这一行，用常规「用户名 + 密码」认证的 SMTP 在 compose 部署下拿到的是
    # **空密码**：`login()` 必然失败，outbox 一路重试到死信，而用户那边的现象
    # 只是「没收到信」。
    BILLING_SMTP_PASSWORD_FILE: /run/secrets/billing_smtp_password
  secrets:
    - billing_jwt_key
    - billing_master_key
    - billing_smtp_password
  # ⚠️ 只是启动顺序，**不是** service_healthy。API 被设计成依赖不可用时照样
  # 启动、由 /readyz 如实汇报（见 app/main.py 与 app/api/health.py）——
  # 让它等 MySQL 健康，等于 MySQL 坏了就连 /healthz 都拿不到，排障时手上空空。
  depends_on:
    - mysql
    - redis

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # ⚠️ 显式钉死 UTC。spec §109 要求一律以 UTC 存储、只在展示层转
      # Asia/Kuala_Lumpur；默认的 SYSTEM 时区会让「换一台宿主机」变成一次
      # 静默的数据语义变更。
      - --default-time-zone=+00:00
      # ⚠️ 必须和下面的 mem_limit 一起看。MySQL 默认的 buffer pool 是 128M，
      # 但整个 mysqld 的常驻远不止这个数；不显式钉住的话，换一台内存更大的机器
      # 时它会自己长大，然后在限额上被 OOM kill —— 而现象是「数据库随机重启」。
      - --innodb-buffer-pool-size=128M
    # 生产 VPS 只有 1 核，MySQL 是最该留出余量的那个。
    mem_limit: ${BILLING_MYSQL_MEM_LIMIT:-512m}
    cpus: ${BILLING_MYSQL_CPUS:-0.6}
    environment:
      MYSQL_ROOT_PASSWORD: ${BILLING_MYSQL_ROOT_PASSWORD:?set BILLING_MYSQL_ROOT_PASSWORD in .env (copy .env.example)}
      MYSQL_DATABASE: ${BILLING_MYSQL_DATABASE:-billing}
      # 应用**不用 root 连**。这个用户只对上面那个库有权限。
      MYSQL_USER: ${BILLING_MYSQL_USER:-billing}
      MYSQL_PASSWORD: ${BILLING_MYSQL_PASSWORD:?set BILLING_MYSQL_PASSWORD in .env (copy .env.example)}
    volumes:
      - mysql-data:/var/lib/mysql
    # ⚠️ 端口**不发布到宿主机**。公开仓库 + 单 VPS，发布 3306 等于把数据库
    # 摆到公网。要连就 `docker compose exec mysql mysql ...`。
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # ⚠️ **两个上限都要设。**只设容器 mem_limit 的话，Redis 自己不知道天花板在
    # 哪，会一直收数据直到被 OOM kill —— 而 Redis 被杀掉的表现是「投递触发丢了」
    # （INV-14 说过那不致命，周期恢复会补，但每次都要等最多一分钟）。
    # 设了 maxmemory，它会在自己那一侧按策略淘汰，而不是整个进程消失。
    #
    # `allkeys-lru`：Redis 在本平台只承载**投递触发与限流兜底**，两者都是
    # 可重建的瞬时数据（spec §74.6、§98.1）。没有任何不可重建的东西在这里。
    command:
      - redis-server
      - --maxmemory
      - ${BILLING_REDIS_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - allkeys-lru
    mem_limit: ${BILLING_REDIS_MEM_LIMIT:-96m}
    cpus: ${BILLING_REDIS_CPUS:-0.2}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *backend
    healthcheck:
      # ⚠️ 探的必须是 /healthz，**绝不能是 /readyz**。/readyz 在数据库不可用时
      # 返回 503，用它做容器健康检查会让一次可恢复的数据库故障变成 API 的
      # 滚动重启 —— 正是 app/api/health.py 里那段注释要防的事。
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  celery-worker:
    <<: *backend
    command:
      - celery
      - -A
      - app.worker
      - worker
      - --loglevel=${BILLING_LOG_LEVEL:-INFO}
      # ⚠️ **必须显式钉住，不能用默认值。**celery 的默认并发 = 宿主机 CPU 核数，
      # 而每个 prefork 子进程都会把整个应用 import 一遍。于是内存占用跟着**跑在
      # 哪台机器**变 —— 配合上面的 mem_limit，换一台核多的机器就会撞限额。
      #
      # 这不是推演：本地（20 核）第一次加上限额起栈，worker 就起了 20 个子进程、
      # 崩溃重启了 4 次，而 `docker inspect` 的 OOMKilled 还是 false
      # （被杀的是子进程，主进程自己退了 0）—— 一条完全指不回原因的现象。
      #
      # 生产 VPS 只有 1 核，2 个足够：任务都是 IO 密集（发信、写库），不是 CPU 密集。
      - --concurrency=${BILLING_CELERY_CONCURRENCY:-2}
    # worker 的存活探针可以直接问它自己 —— 这是 beat 没有的待遇（见下）。
    # ⚠️ `inspect ping` 走 broker 往返，所以 Redis 挂了它也会红。那是**对的**：
    # 拿不到任务的 worker 确实不能算健康。但排障时要记得先看 redis 那一格，
    # 别把「broker 挂了」误判成「worker 挂了」。
    healthcheck:
      # ⚠️ `$$HOSTNAME` 的两个 `$` 都是必需的：单个 `$` 会被 **compose 在宿主机上**
      # 插值成空串（实测 compose 会警告 "variable is not set"），而 exec 形式的
      # `CMD` 没有 shell、容器里也不会展开。所以这里必须是 CMD-SHELL + `$$`。
      #
      # 指名问自己（`-d celery@<主机名>`）而不是广播：将来跑多个 worker 时，
      # 广播式的 ping 只要**有人**回应就算通过，一个死掉的 worker 会被它的同伴掩护。
      test:
        - CMD-SHELL
        - celery -A app.worker inspect ping -d "celery@$$HOSTNAME"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-beat:
    # ⚠️ 覆盖 `x-backend` 锚点里那个 384m。beat 只做一件事：按时把任务名丢进
    # 队列，不执行任务本身。给它和 api 一样的额度纯属浪费 —— 而在一台
    # 只有 1.8 GB 可用的机器上，浪费的那部分是别人要用的。
    mem_limit: ${BILLING_BEAT_MEM_LIMIT:-128m}
    cpus: ${BILLING_BEAT_CPUS:-0.2}
    <<: *backend
    command:
      - celery
      - -A
      - app.worker
      - beat
      - --loglevel=${BILLING_LOG_LEVEL:-INFO}
      # beat 要往磁盘写「上次跑到哪」。非 root 进程写不进 /srv/billing，
      # 镜像里 /var/lib/celery 的属主就是容器运行 UID，命名卷继承它。
      - --schedule=/var/lib/celery/beat-schedule
    volumes:
      - celery-beat-state:/var/lib/celery
    # ⚠️ **beat 的存活探针只能这么做。**`celery inspect ping` 问的是 worker，
    # 够不着 beat；而 beat 崩掉是**静默故障** —— 周期任务全停（outbox 不再补投）、
    # API 一切正常、没有任何报错，只有等到有人发现「信都没发出去」才暴露。
    #
    # 判据是 beat 自己的调度状态文件有多久没动：它现在每派发一次就落盘
    # （`beat_sync_every=1`，见 app/core/celery_app.py 那段注释）。
    #
    # 阈值取周期的三倍多一点（60s → 200s）：容得下一次错过，又不至于让故障
    # 拖太久才暴露。⚠️ 改 OUTBOX_RECOVERY_SECONDS 时要一起改这里。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test $(( $(date +%s) - $(stat -c %Y /var/lib/celery/beat-schedule) ))
          -lt ${BILLING_BEAT_STALE_SECONDS:-200}
      interval: 30s
      timeout: 5s
      retries: 3
      # ⚠️ 起步宽限必须大于一个调度周期：beat 刚起来时还没派发过任何任务，
      # 文件是空的 / 时间戳是启动时刻。没有这段宽限，它会在第一个周期内被判不健康。
      start_period: 90s

  frontend:
    # 静态文件而已，给得很紧。
    mem_limit: ${BILLING_FRONTEND_MEM_LIMIT:-64m}
    cpus: ${BILLING_FRONTEND_CPUS:-0.2}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: acuven-billing-hub-frontend:local
    restart: unless-stopped
    logging: *logging
    # ⚠️ 不发布端口：它只经边缘 nginx 对外。产物是静态文件，没有任何依赖 ——
    # 所以这里既没有 depends_on 也不需要数据库或 broker。
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    # ⚠️ 刻意**没有**换成非 root 镜像（T0.9 决策 ④）：生产上本层只收
    # infra_nginx 转进来的内网流量，风险面小。这是一次有意识的选择，不是遗漏。
    mem_limit: ${BILLING_NGINX_MEM_LIMIT:-64m}
    cpus: ${BILLING_NGINX_CPUS:-0.3}
    restart: unless-stopped
    logging: *logging
    ports:
      - "${BILLING_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/billing.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/billing-proxy-headers.inc:/etc/nginx/conf.d/billing-proxy-headers.inc:ro
    depends_on:
      - api
      - frontend
    healthcheck:
      # 只问 nginx 自己活着没有，不经过 api。
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3

# spec §99 的七个服务到齐（T0.7 补上 frontend）。
# tests/backend/test_compose.py 的 EXPECTED_SERVICES 钉住这份清单。

secrets:
  # ⚠️ Compose 的 `file:` 型 secret 走 **bind mount**：`uid` / `gid` / `mode`
  # 三个选项**只在 swarm 模式生效，普通 compose 下被忽略**，宿主机文件的属主与
  # 权限原样带进容器。所以生产上这个文件要 `chown 10001:10001` + `chmod 0400`
  # （10001 就是 Dockerfile 里的 APP_UID）。**不得为了读密钥把容器改回 root。**
  # 见 ADR-0004 第 2 节；宿主机那一半归 T0.9。
  #
  # 文件不存在时 `docker compose up` 直接失败 —— 与密码留空同一种 fail-closed：
  # 宁可起不来，也不要一个「认证看起来能用但密钥来路不明」的栈。
  # 生成：openssl rand -base64 48 > secrets/jwt.key
  billing_jwt_key:
    file: ./secrets/jwt.key
  # ⚠️ **这一把丢了，所有 TOTP 注册全部作废** —— 每个管理员都要重新扫码。
  # 备份要与数据库备份分开存放、两套访问控制（ADR-0004 第 3 节）。
  # 生成：echo "1:$(openssl rand -base64 32)" > secrets/master.key
  billing_master_key:
    file: ./secrets/master.key
  # SMTP 密码（ADR-0009 的 Email 传输）。与上面两把同一种处置：**只有路径进环境
  # 变量，密码本身走文件**（ADR-0004 第 2 节）。
  #
  # ⚠️ 不配 SMTP 也要有这个文件，**创建一个空的就行**：
  #     : > secrets/smtp.password
  # 空内容的语义是「没有密码」，而不是「没配好」—— 有些 relay 只认 IP 白名单，
  # 那时本来就不该有密码（见 app/core/mailer.py：用户名为空时根本不调 login）。
  #
  # ⚠️ **文件不存在时栈照样起得来**（实测）：Docker 会把缺失的 `file:` secret
  # 挂成一个**空目录**，读它抛 OSError，于是密码静默变成空串 —— 只在日志里留一条
  # `Could not read the SMTP password file`。所以「忘了建文件」与「本来就不需要
  # 密码」在行为上几乎一样，差别只在那一行日志。**别指望 compose 替你挡住。**
  billing_smtp_password:
    file: ./secrets/smtp.password

volumes:
  mysql-data:
  redis-data:
  celery-beat-state:
