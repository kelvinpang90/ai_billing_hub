# 计费平台的边缘反向代理。挂进 nginx 容器的 /etc/nginx/conf.d/default.conf。
#
# ⚠️ 这份配置只管**本地 / 单 VPS Compose 栈**：监听 80、不做 TLS。
# TLS、证书与真实域名属于生产拓扑（TODO 的 T0.9），不在这里。

# 关联 ID 的来源（§94）。上游（Integrated Application Backend）带了就沿用，
# 没带就由 nginx 生成 —— 这样 nginx 访问日志与应用日志用的是同一个 id，
# 跨进程排障不用靠时间戳猜。
# $request_id 是 32 位十六进制，落在 app/core/middleware.py 的合法字符集里；
# 应用侧仍会独立校验，不信任这里。
map $http_x_request_id $billing_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# ⚠️ 记 $uri 而**不是** $request：$request 带查询串，而查询串里可能出现密钥
# 或客户标识（§94 禁止把凭据写进日志）。应用侧同样只记 request.url.path。
log_format billing_json escape=json
    '{"ts":"$time_iso8601","request_id":"$billing_request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes_sent":$body_bytes_sent,"duration_s":$request_time,'
    '"upstream_status":"$upstream_status","client":"$remote_addr"}';

# 不回显版本号。
server_tokens off;

# 登录限流（spec §53 的 `Login attempt rate limiting`）。**这是主控**：它在请求
# 到达 Python 之前就挡掉，所以真正保护得了 CPU。应用侧那个进程内令牌桶只是
# 「不经 nginx 直接跑 uvicorn」时的兜底。
#
# ⚠️ 为什么必须有这一层：为了防用户枚举，登录在**邮箱不存在时也会跑一次
# Argon2 校验**。那条控制同时是一条资源放大通道 —— 换着不存在的邮箱发请求，
# 账号锁定永远不会触发，而每个请求都稳定烧掉一次 Argon2。
#
# ⚠️ 和 /readyz 的网段限制同一个前提：键是 $binary_remote_addr。生产上若在
# 它前面再放一层代理，所有请求会共用代理的 IP，**限流就变成全局限流**。
# 届时要配 real_ip_header + set_real_ip_from —— 归 T0.9。
limit_req_zone $binary_remote_addr zone=billing_auth:10m rate=10r/m;
# 超限返回 429 而不是默认的 503：503 是「服务不可用」，会让客户端与监控以为
# 是后端挂了。
limit_req_status 429;

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log billing_json;

    # ⚠️ 用 Docker 内嵌 DNS 而不是 upstream 块，是为了**每次都重新解析**。
    # 写成 `upstream { server api:8000; }` 时 nginx 只在启动时解析一次：
    # api 容器重建换了 IP，nginx 会一直 502，直到有人手工 reload。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $billing_api http://api:8000;
    set $billing_frontend http://frontend:80;

    # nginx 自己的存活探针。**刻意不经过 api** —— 这是问「代理还在不在」，
    # 混进后端依赖就答非所问了。
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # nginx 默认上限就是 1m，这里显式写出来：将来做批量用量摄取要调大，
    # 那必须是一次有意识的决定，而不是撞上一个看不见的默认值。
    client_max_body_size 1m;

    location = /healthz {
        proxy_pass $billing_api$request_uri;
        include /etc/nginx/conf.d/billing-proxy-headers.inc;
    }

    # ⚠️ /readyz **不对公网开放**：它的响应体逐个报出依赖状态
    # （database / redis），等于把内部拓扑和故障窗口告诉任何人。
    # 只放行回环与私有网段（Docker 网桥、同 VPS 的监控）。
    #
    # ⚠️ 这条控制的前提是 **nginx 直接面对客户端**：allow / deny 比的是
    # $remote_addr，不是 X-Forwarded-For。如果生产上在它前面再放一层代理，
    # 所有请求的 $remote_addr 都会变成那层代理的私有地址，这条限制就**形同
    # 虚设**。届时必须改用 real_ip_header + set_real_ip_from，或干脆在前面
    # 那层拦掉 —— 归 T0.9（生产拓扑）。
    location = /readyz {
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass $billing_api$request_uri;
        include /etc/nginx/conf.d/billing-proxy-headers.inc;
    }

    # 认证端点单独限流。⚠️ 必须写在 /api/ 之前：nginx 的前缀 location 取最长
    # 匹配，但把限流挂在 /api/ 上会连带限住所有业务读写，那是另一回事。
    location /api/v1/auth/ {
        limit_req zone=billing_auth burst=20 nodelay;

        proxy_pass $billing_api$request_uri;
        include /etc/nginx/conf.d/billing-proxy-headers.inc;
    }

    # 业务 API。**不改写路径** —— nginx 日志与应用日志里的 uri 必须是同一个
    # 字符串，否则两边对不上。
    location /api/ {
        proxy_pass $billing_api$request_uri;
        include /etc/nginx/conf.d/billing-proxy-headers.inc;
    }

    # 其余全部交给前端。frontend 容器自己做 SPA 兜底（未知路径回 index.html），
    # 所以这里**不需要**也不应该在边缘再写一遍 try_files —— 静态文件不在这一层。
    location / {
        proxy_pass $billing_frontend$request_uri;
        include /etc/nginx/conf.d/billing-proxy-headers.inc;
    }
}
