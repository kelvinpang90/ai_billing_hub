# 计费平台的边缘反向代理。所在目录整个挂进 nginx 容器的 /etc/nginx/conf.d/
# （挂目录不挂文件的理由见 docker-compose.yml 的 billing_nginx.volumes）。
# ⚠️ 这个目录里的每个 *.conf 都会被 nginx 加载 —— 不要往里放别的 .conf。
#
# ⚠️ 这份配置只管**本地 / 单 VPS Compose 栈**：监听 80、不做 TLS。
# TLS、证书与真实域名属于生产拓扑（TODO 的 T0.9），不在这里。

# 关联 ID 的来源（§94）。上游（Integrated Application Backend）带了就沿用，
# 没带就由 nginx 生成 —— 这样 nginx 访问日志与应用日志用的是同一个 id，
# 跨进程排障不用靠时间戳猜。
# $request_id 是 32 位十六进制，落在 app/core/middleware.py 的合法字符集里；
# 应用侧仍会独立校验，不信任这里。
map $http_x_request_id $billing_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# ⚠️ 记 $uri 而**不是** $request：$request 带查询串，而查询串里可能出现密钥
# 或客户标识（§94 禁止把凭据写进日志）。应用侧同样只记 request.url.path。
log_format billing_json escape=json
    '{"ts":"$time_iso8601","request_id":"$billing_request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes_sent":$body_bytes_sent,"duration_s":$request_time,'
    '"upstream_status":"$upstream_status","client":"$remote_addr"}';

# 不回显版本号。
server_tokens off;

# 登录限流（spec §53 的 `Login attempt rate limiting`）。**这是主控**：它在请求
# 到达 Python 之前就挡掉，所以真正保护得了 CPU。应用侧那个进程内令牌桶只是
# 「不经 nginx 直接跑 uvicorn」时的兜底。
#
# ⚠️ 为什么必须有这一层：为了防用户枚举，登录在**邮箱不存在时也会跑一次
# Argon2 校验**。那条控制同时是一条资源放大通道 —— 换着不存在的邮箱发请求，
# 账号锁定永远不会触发，而每个请求都稳定烧掉一次 Argon2。
#
# 键是 $binary_remote_addr —— 而下面 real_ip 那一段会在**更早的阶段**把它换成
# 真实客户端地址，所以这里不用改写法（T0.9）。
limit_req_zone $binary_remote_addr zone=billing_auth:10m rate=10r/m;
# 超限返回 429 而不是默认的 503：503 是「服务不可用」，会让客户端与监控以为
# 是后端挂了。
limit_req_status 429;


# --- 真实客户端地址（T0.9 决策 ①A）------------------------------------------
#
# 生产上本平台的 nginx 接在 vps_infra 的 infra_nginx 后面，所以每个请求的直连
# 对端都是那一层。不配这一段的话，三处一起坏掉，而且**全都是静默的**：
#
#   1. 上面的 limit_req 把所有客户端算成同一个来源 —— 任何人打到第 21 个认证
#      请求，**所有人**一起拿 429
#   2. /readyz 的 allow/deny 形同虚设 —— 代理的地址本来就在私有网段里，
#      等于把逐个报出依赖状态的响应对全网开放
#   3. 审计日志里的 ip_address 全是同一个值，取证时没用
#
# realip 模块在很早的阶段就把 $remote_addr / $binary_remote_addr 换掉，所以
# limit_req、allow/deny 与 X-Real-IP 三处都自动跟着变成真实地址。
#
# ⚠️ **刻意不开 real_ip_recursive**（保持默认 off），这一条反直觉：
# off 时 nginx 取 X-Forwarded-For 里的**最后一个**地址，而最后一个是上游代理
# 亲自追加的、客户端伪造不了的那个。开了 recursive 反而要依赖「可信名单写得够
# 准」才安全 —— 名单一宽，客户端塞进去的伪造地址就可能被当成真的。
#
# **实际拓扑**（2026-09-16 在生产 VPS 上查实，§10 末尾那条待确认的事实到此有答案）：
# infra_nginx 与本平台 nginx 在**同一张 docker 网络 `proxy_net` 上直连容器**，
# 不经宿主机发布端口。所以可信的只有那一张网。
#
# ⚠️ 原来填的是三段 RFC1918 + 回环，那等于把「谁能伪造 X-Forwarded-For」放开到任何私有
# 地址 —— 按来源限流可以被绕过、审计里的 IP 可以被伪造。
#
# ⚠️ **剩下的那点信任是有意保留的**：proxy_net 上还挂着同机另外八个项目的容器，它们仍在
# 这个范围里。要再窄一层，得让 infra_nginx 在 vps_infra 那边拿一个**固定 IP** ——
# 那是另一个仓库的改动，已记进 docs/TODO.md。
#
# ⚠️ **这个网段由 vps_infra 定，不是我们定的。**它一旦变了，这里不跟着改的后果是**静默
# 失效**：所有请求的来源又变回 infra_nginx 自己。换主机 / 重建 proxy_net 时先
# `docker network inspect proxy_net` 看一眼。
set_real_ip_from 172.19.0.0/16;
real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log billing_json;

    # ⚠️ 用 Docker 内嵌 DNS 而不是 upstream 块，是为了**每次都重新解析**。
    # 写成 `upstream { server api:8000; }` 时 nginx 只在启动时解析一次：
    # api 容器重建换了 IP，nginx 会一直 502，直到有人手工 reload。
    resolver 127.0.0.11 valid=10s ipv6=off;
    # ⚠️ 不设的话默认 30 秒。T0.7 实测：api 容器停掉时边缘要 **3.96 秒**才回 502,
    # 绝大部分耗在这里等 DNS。
    resolver_timeout 2s;

    # --- 上游超时（T0.9）-----------------------------------------------------
    # ⚠️ proxy_connect_timeout 的默认值是 **60 秒**。后果很具体：一次后端停机在
    # 用户侧表现成「点了没反应」而不是「报错」，而且每个挂着的请求都占着 nginx
    # 一条连接 —— 停机期间连接数会一路爬，等后端回来时还要先消化这一堆。
    #
    # 连接本机 Docker 网络里的容器，2 秒连不上就是连不上了，等下去没有意义。
    proxy_connect_timeout 2s;
    # 读写超时留宽一些：本平台最慢的端点是忘记密码（反枚举的 120ms 固定地板
    # + 一次 Argon2），远在这之下；留 30 秒是给将来的批量用量摄取的余量。
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    set $billing_api http://api:8000;
    set $billing_frontend http://frontend:80;

    # --- 安全响应头（T0.9 首次部署后外网实测发现一个都没有）-------------------
    #
    # 放在边缘这一层，前端页面与 API 响应一起覆盖；`always` 让 4xx / 5xx 也带上 ——
    # 错误页同样能被嵌进 iframe。
    #
    # ⚠️ **下面任何一个 location 里都不要写 add_header。**nginx 的规则是：一个 location
    # 只要自己写了一条 add_header，就**完全不再继承** server 层的全部 add_header ——
    # 为了加一个 Cache-Control，会静默丢掉这五个头。tests/backend/test_compose.py 钉着。
    #
    # 点击劫持：登录页被嵌进别人的 iframe、诱导用户在上面点击。两种写法都给：
    # 老浏览器认 X-Frame-Options，新浏览器认 CSP 的 frame-ancestors。
    add_header X-Frame-Options "DENY" always;
    # ⚠️ **刻意只写 frame-ancestors，不是完整 CSP。**完整策略要逐条核对前端实际加载的
    # 资源（antd 用内联样式），拍脑袋写一条会把页面弄坏。记在 docs/TODO.md。
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    # 重置密码链接的令牌在路径里（/reset-password?token=…）。跨站跳转时只带源站，
    # 不带完整 URL —— 否则令牌会出现在对方服务器的 Referer 日志里。
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS：浏览器此后对这个域名**只走 https**，连第一跳的 http 请求都不发。
    # 没有它的话，用户手敲 http:// 那一次仍是明文，靠 infra_nginx 的 301 才转过去。
    # ⚠️ 不加 includeSubDomains / preload：那两个会影响 acuventech.com 下的其它站点，
    # 不是本项目能替它们决定的。本地栈是 http，浏览器会忽略 http 响应里的 HSTS。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # nginx 自己的存活探针。**刻意不经过 api** —— 这是问「代理还在不在」，
    # 混进后端依赖就答非所问了。
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # nginx 默认上限就是 1m，这里显式写出来：将来做批量用量摄取要调大，
    # 那必须是一次有意识的决定，而不是撞上一个看不见的默认值。
    client_max_body_size 1m;

    location = /healthz {
        proxy_pass $billing_api$request_uri;
        include /etc/nginx/conf.d/billing-proxy-headers.inc;
    }

    # ⚠️ /readyz **不对公网开放**：它的响应体逐个报出依赖状态
    # （database / redis），等于把内部拓扑和故障窗口告诉任何人。
    # 只放行回环与私有网段（Docker 网桥、同 VPS 的监控）。
    #
    # ⚠️ ~~这条控制的前提是 nginx 直接面对客户端~~ —— **已不成立，且已处理**：生产上
    # 前面确实还有一层（infra_nginx），而 allow / deny 比的是 $remote_addr。
    # 上面的 real_ip 把它换成了 X-Forwarded-For 里的真实客户端地址，所以这条限制现在
    # 拦的是**真正的来源**，不是代理的私有地址。
    # ⚠️ 名单同样按实际拓扑收窄（T0.9 2026-09-16）：回环、本栈自己那张网（宿主机经
    # 发布端口过来时的对端是它的网关，巡检 monitor.sh 走的就是这条）、以及 proxy_net。
    # **经 infra_nginx 进来的请求在这里已经是客户端的真实 IP**（上面 real_ip 换过了），
    # 所以公网访问一律落进 deny —— 这正是想要的效果。
    # ⚠️ 10.201.0.0/24 与 docker-compose.yml 里钉死的本栈网段是**同一个值**，改要一起改。
    # nginx 的 conf 读不到环境变量，所以那边也刻意写成字面量、不给旋钮 ——
    # 只对一半生效的旋钮会让宿主机的巡检被 deny 掉，而那看着像应用出了问题。
    # tests/backend/test_compose.py 钉着这两处一致。
    location = /readyz {
        allow 127.0.0.0/8;
        allow 10.201.0.0/24;
        allow 172.19.0.0/16;
        deny all;

        proxy_pass $billing_api$request_uri;
        include /etc/nginx/conf.d/billing-proxy-headers.inc;
    }

    # 认证端点单独限流。⚠️ 必须写在 /api/ 之前：nginx 的前缀 location 取最长
    # 匹配，但把限流挂在 /api/ 上会连带限住所有业务读写，那是另一回事。
    location /api/v1/auth/ {
        limit_req zone=billing_auth burst=20 nodelay;

        proxy_pass $billing_api$request_uri;
        include /etc/nginx/conf.d/billing-proxy-headers.inc;
    }

    # 业务 API。**不改写路径** —— nginx 日志与应用日志里的 uri 必须是同一个
    # 字符串，否则两边对不上。
    location /api/ {
        proxy_pass $billing_api$request_uri;
        include /etc/nginx/conf.d/billing-proxy-headers.inc;
    }

    # 其余全部交给前端。frontend 容器自己做 SPA 兜底（未知路径回 index.html），
    # 所以这里**不需要**也不应该在边缘再写一遍 try_files —— 静态文件不在这一层。
    location / {
        proxy_pass $billing_frontend$request_uri;
        include /etc/nginx/conf.d/billing-proxy-headers.inc;
    }
}
