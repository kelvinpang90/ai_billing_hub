; ASCII only. Alembic reads this through configparser, which uses the platform
; default encoding -- cp1252 on Windows. Non-ASCII here crashes `alembic` on a
; Windows dev machine while working fine on the Linux CI runner. The rationale
; behind these settings lives in alembic/env.py, which Python reads as UTF-8.

[alembic]
script_location = alembic

; Timestamp-prefixed filenames so `ls` shows execution order. With random
; revision ids alone, the directory gives no hint of ordering and a reviewer
; has to open every file to follow down_revision.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

; No connection string here. The repository is public; alembic/env.py reads
; BILLING_DATABASE_URL through app.core.config instead.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
