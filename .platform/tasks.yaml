    title: outbound webhook signing (issue, activate, retire, signing library)
    purpose: >-
      按 docs/design/AIH-TASK-019-webhook-signing.md（设计闸门 #135 已批准 v1）实现出站状态 webhook 的签名密钥：
      迁移 0008 建 project_webhook_secrets（密文 + 主密钥版本与签名版本分列、PENDING / ACTIVE / RETIRED 三态、
