      - '新文件 app/services/wallet_reconciliation.py：设计列出的常量（STEP_SECONDS、STEP_BUDGET_SECONDS、TENANT_BATCH、START_HOUR_MYT、STALE_AFTER、LEASE_SECONDS、LEASE_RENEW_AFTER_SECONDS）名与值照设计；三个步骤函数都接收会话工厂与调用方传入的同一个 now（取整到秒的 UTC），各自只开自己的短事务：retire_stale_runs(factory, *, now) 普通读出 run_date 不等于 kuala_lumpur_date(now)（早于或晚于）的 RUNNING 行，按主键逐行置 ABANDONED、finished_at=now，同时清空 running_slot、lease_owner 与 lease_until；start_run(factory, *, now) 按开始规则（今天没有 COMPLETED、当前没有 RUNNING，且马来西亚时间不早于 03:00 或表为空）单独一个事务插入新运行（running_slot=1、计数与游标显式给 0），IntegrityError、死锁（1213）或锁等待超时时回滚，再用锁读（with_for_update(read=True) 读 running_slot = 1 的行，会等正在插入的一方提交或回滚）重读，读到 RUNNING 行视为别人已开始、否则把异常原样抛出；claim_run(factory, *, now) 用短只读事务读 run_date 不晚于今天的 RUNNING 行的 id 与 public_id（多行取 run_date 最大，不读游标），再用短事务以新生成的 uuid4 令牌领租约（条件为 status=RUNNING 且 lease_until 为空或早于 now，lease_until 设为 now 加 LEASE_SECONDS），领到之后再用短只读事务读 cursor_tenant_id'
      - '返回值：start_run 返回 started、already_running 或 not_due 之一——只要存在 RUNNING 行（插入前检查发现，或插入失败后重读发现）就返回 already_running，not_due 只用于时间未到或今天已有 COMPLETED；claim_run 返回 idle（没有可推进的运行）、busy（领不到租约）或领到时的 ClaimedRun（NamedTuple，字段依次为 run_id、public_id、token、old_cursor）；新增 release_lease(factory, *, run_id, public_id, token)：用新会话执行设计第 5 步的释放语句，失败时记一条 warning 日志 wallet_reconciliation_lease_release_failed、恰好带 run_id（public_id）与 error_type、不重试、不向外抛。三个步骤函数遇到数据库异常时回滚自己的事务后原样抛出，由 AIH-TASK-132 的 step 统一记 wallet_reconciliation_failed；claim_run 读到运行之后的失败（领租约的 UPDATE 或读游标抛错）：已领到租约时先用手里的令牌调 release_lease，再抛 ClaimError（新异常类，属性 public_id 为这次运行的 public_id，原异常作为 __cause__）；读到运行之前的失败原样抛出'
