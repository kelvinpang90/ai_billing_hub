  - id: AIH-TASK-051
    title: 状态同步第五层：状态 webhook 的领取、签名发送、结算与重试
    purpose: >-
      按 docs/design/PHASE-3-status-sync.md（设计闸门 #241 已批准 v6）实现拆分第 5 项：Beat 每 15 秒的 dispatch 逐行循环（12 秒预算），领取（FOR UPDATE OF 投递行 SKIP LOCKED LIMIT 1、同一事务组装快照与 payload、单行租约令牌）、事务外签名发送（标准库 urllib、禁止重定向、可注入 transport、超时 5 秒）、结算（先对租户行加共享锁读当前版本，再带令牌条件更新投递行；成功、失败退避、有更新版本立即重排）；签名密钥缺失或解不开的判定顺序与结算；配置项。告警维度与运维文档由 AIH-TASK-052 做。
    status: done
    depends_on:
      - AIH-TASK-050
    acceptance_criteria:
      - 实现与 docs/design/PHASE-3-status-sync.md 逐条一致；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计
      - 新增 app/services/status_delivery.py：dispatch 循环（同一次循环可再领取结算后又到期的行）、领取条件（有地址、项目 ENABLED、COALESCE(delivered_version, -1) 小于租户版本、next_attempt_at 不晚于 now、租约空或过期）、单行租约 60 秒、12 秒预算，全部按设计 §2；payload 十一个字段与 event_id 规则按设计；签名用 sign_status_webhook；响应体最多读 1 KiB 后丢弃；只把 2xx 视为送达
      - 结算按设计 §2「事务边界」与 §4「投递行」逐列写：先 SELECT … FOR SHARE 读租户当前版本，再带令牌条件 UPDATE；成功、失败、无 ACTIVE 密钥、主密钥未配置、解密失败五种结算的各列（attempt_count、退避的 n、next_attempt_at、租约与 attempted_version、last_http_status、last_error_code、last_attempt_at、delivered_at）按设计；密钥判定顺序固定为先查 ACTIVE 行、再加载主密钥、再解密；令牌不匹配不写
      - 配置项按设计 §2「配置」（BILLING_ 前缀，带默认值）；Celery Beat 条目 status-webhook-dispatch（15 秒、expires 14），任务模块加进 TASK_MODULES
