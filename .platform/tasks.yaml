  - id: AIH-TASK-165
    title: Billing Client 第二层：SQLite outbox 核心：建表、写入去重、领取与租约、落回执与清理
    purpose: >-
      按 docs/design/AIH-TASK-164-billing-client.md（设计闸门 #571 已批准 v24） §2「存储（SQLite）」「事务边界」「投递」与 §4：新模块 store.py 的 outbox 核心，建 meta、usage_outbox、status_state、reconcile_state、ops_log、incidents 六张表（后四张的读写函数属于 AIH-TASK-166），两种打开方式与版本保护，写事件（BEGIN IMMEDIATE、主键冲突与存储故障分开），领取与租约栅栏，落回执，清理，投递相关的只读计数。不发 HTTP、不做内存暂存与后台线程。
    status: done
    depends_on:
      - AIH-TASK-164
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-164-billing-client.md（设计闸门 #571 已批准 v24） 逐条一致，以 §2「存储（SQLite）」「事务边界」「投递」中领取、租约栅栏、错误码清除与清理的描述、§4 outbox 状态表中投递相关的行与并发、§5 与存储相关的行、§7 标 165 的各行 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - 'Store(path, *, clock)：路径所在目录不存在时抛错；另提供照设计「不建表的打开方式」的 Store.open_existing(path, *, clock)（文件不存在、零字节、不是 SQLite 文件、没有 meta 表、schema_version 比代码新都抛错，不建表、不改日志模式、不写任何东西；先确认 <path> 存在且不是零字节（否则直接抛错，不建任何文件，包括 <path>.lock），再取单进程锁，取不到抛 StoreLockedError；这里与正常打开相同的是加锁、连接登记与文件身份检查，不同的是不建表、不改日志模式；「不写任何东西」只指上面这些报错的路径，成功打开后的读写与关闭时 SQLite 自己做的检查点属于正常行为），供 AIH-TASK-170 的命令行使用；每个线程各用自己的连接，连接设置 journal_mode=WAL、synchronous=FULL、busy_timeout=5000、foreign_keys=ON；照设计 v20「单进程锁」「连接登记与作废」「文件替换检测」：正常打开先在 <path>.lock 取排他文件锁（POSIX fcntl.flock，Windows msvcrt.locking，非阻塞），取不到抛 StoreLockedError；连接以 check_same_thread=False 建立并登记，使用时持登记表的共享锁，invalidate() 取排他锁、关闭全部已登记连接、清空登记表、代号加一，重新打开与新建库只在 invalidate() 完成之后；Store.close() 关闭全部已登记连接并释放单进程锁（可重复调用）；Store.reopen() 在 invalidate() 之后显式重新打开或按设计的前提新建库（失败照常抛错），各线程不会自行新建库；构造失败时已取到的锁要释放；每个连接记下文件身份 (st_dev, st_ino)，每次使用前比对，路径的文件身份变了或路径不存在就抛本模块定义的 StoreReplacedError（由 AIH-TASK-168 的门面转入降级）；正常打开时主库不存在，只有 <path>-wal 与 <path>-shm 也都不存在才新建库，否则抛 StoreResidueError（点名还在的文件，不碰它们）；首次打开在**一个** BEGIN IMMEDIATE 事务里建六张表与索引 (status, next_attempt_at)、写 schema_version = 1，中途失败整体回滚、不留半建的库（正常打开时：文件不存在或是一个没有任何表的空 SQLite 库才建表；是 SQLite 库却没有 meta 表或 meta 里没有 schema_version 而已有别的表，抛 StoreForeignError、不建表、不改文件）；invalidate() 之后、reopen() 成功之前 Store 处于关闭状态，任何读写都抛 StoreUnavailableError，各线程不会自行重连或建文件；Store 在每次 open / reopen 校验通过后记下「当前文件身份」，各线程新建连接时路径上的文件身份必须与它一致，否则抛 StoreReplacedError（不能绕过 open / reopen 的表结构、外来库与残留检查）；异常类型：StoreError 为基类，StoreMissingError（正常打开时目录不存在；不建表的打开方式下文件不存在或零字节）、StoreForeignError（不是 SQLite、没有 meta 而有别的表、只有 meta 而缺表、schema_version 为 1 却缺表；由 sqlite3 错误引起时带属性 sqlite_errorname 保留原错误名，例如 SQLITE_NOTADB）、StoreVersionError（schema_version 不是正整数或比代码新）、StoreLockedError、StoreResidueError、StoreReplacedError、StoreUnavailableError、StoreIntegrityFault 都是它的子类，全部定义在 store.py；库里 schema_version 大于 1 时抛错且不改任何表；六张表的列、类型、可空性、CHECK 与主键照设计 §2 v13（incidents 主键 incident_id；status_state 与 reconcile_state 主键都是 (tenant_id, project_id)；ops_log 的 action 含 RESET_STATUS、只增不改，模块里没有更新或删除它的代码），last_delivery_ok_at 存在 meta'
      - '写事件 insert_event(event_id, payload)：BEGIN IMMEDIATE → 查同 event_id → 不存在则插入 PENDING（next_attempt_at = now、attempts = 0）→ COMMIT；已存在且 payload 字节相同返回已有 id；不同抛 EventConflictError（在本模块定义）且不改原行；INSERT 抛 sqlite3.IntegrityError 时按同一规则比对字节，不当作存储故障；若库里并没有这个 event_id 的行（例如 NOT NULL 或 CHECK 被违反），包装成本模块的 StoreIntegrityFault（不是 IntegrityError 的子类）抛出，由门面按存储故障处理（进暂存、不抛给接入方）；IntegrityError 以外的 sqlite3.Error 原样抛出，由 AIH-TASK-168 的调用方决定进暂存'
      - '领取 claim(*, max_events, max_bytes, lease_seconds)：BEGIN IMMEDIATE，按 (created_at, event_id) 升序选到期的 PENDING 与租约过期的 SENDING，逐条累加到条数上限或下一条会让批量请求体（{"events":[ 加各条 payload 用逗号连接加 ]}）超过 max_bytes 为止（第一条单独超过时仍领这一条），置 SENDING、写租约、attempts 加 1、不改 last_error_code，返回各行的 event_id、payload、加 1 之后的 attempts、上一次的 last_error_code 与所写的 lease_until；renew_lease(event_ids, old_lease, new_lease) 按设计的栅栏条件统一续租并返回影响行数'
      - '落状态：mark_delivered（同时清 last_error_code）、mark_retry（每行各自的 next_attempt_at 与 error_code）、mark_dead(error_code) 都接收一组行（各带领取时的 lease_until 作栅栏：status = SENDING AND lease_until = 该值），在**一个** BEGIN IMMEDIATE 事务里逐行更新，返回实际更新到的 event_id 集合（栅栏失效的行不在其中、不改）；事务中途抛错则这一组都不改、停在 SENDING；purge_delivered(older_than, limit=1000)（older_than 由调用方按 delivered_retention_seconds 算）只删 DELIVERED 且 delivered_at 早于给定时刻的行，DEAD 不删；record_delivery_ok 与 read_last_delivery_ok_at 读写 meta；投递相关的只读计数（各状态条数、未确认死信数、PENDING 与 SENDING 行里最早的 created_at、是否存在 last_error_code 为 INTEGRATION_AUTH_FAILED 的 PENDING 或 SENDING 行）；AIH-TASK-167..170 只经 store 的函数读写库，不直接写 SQL'
      - '测试：新增 integration-client/tests/test_client_store.py，覆盖设计 §7 标 165 的各行（载荷用测试里直接构造的字节，不经 events.py；自带 event_id 须给 occurred_at 那一行的门面部分由 AIH-TASK-164、168 覆盖）：写入持久、本地去重与冲突、并发写同一 event_id 两组、主键冲突不算存储故障（用 monkeypatch 让查重返回不存在，从而让 INSERT 撞主键）、不建表的打开方式、版本保护、领取并发、领取顺序、错误码清除中送达的部分、单进程锁（用 multiprocessing 起子进程用同一路径打开，得到 StoreLockedError；父进程关闭后子进程能取到锁）、invalidate() 后各线程重建连接且新库 -wal 在旧连接关闭后保持存在、integrity_check 为 ok、文件被移走或替换后抛 StoreReplacedError、设计 v23 §7「只移走主库」「三个文件一起移走」两行的存储部分（只移主库时原路径的 -wal 仍在、不新建库、抛 StoreResidueError 点名残留；按配对名字补放后命令行能读出全部已提交行；三个文件一起移走后立即可新建库）、租约过期重领与旧租约回执落不进去、§4 状态机中投递相关的行、清理、落回执中途失败停在 SENDING；并发用例用两个线程各自的连接；在打开状态下移动或替换文件的用例依赖 POSIX 语义（生产与 CI 都是 Linux），可以在 sys.platform 为 win32 时条件跳过，CI 上不会出现 skipped；客户端测试只用标准库与 pytest，SQLite 用 tmp_path 下的文件，HTTP 用注入的假 Transport，时间用注入的时钟，不联网、不 sleep 真实时间、不出现 skipped（CI 的 backend-tests 分片把出现 skipped 判为失败）'
      - '只改 store.py、__init__.py 的导出与 test_client_store.py；不改 AIH-TASK-164 交付的其他模块；不写死信运维、重放、ops_log、incidents 与状态表的读写函数（属于 AIH-TASK-166）；不改 app/、alembic/、frontend/ 与服务端任何代码；不装依赖；不对任何数据库执行迁移；不连生产；不改 .platform/ 与 .github/；复选框只允许 [ ] / [x]；不改 planning-v1 块；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推。PR 正文的「设计闸门」写 #571'
