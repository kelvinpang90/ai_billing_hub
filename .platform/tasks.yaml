      - '只统计 status 为 PROCESSED 的事件。分组键：provider 为已解析的供应商代码，model 为供应商代码加模型代码，customer 与 project 为 public_id 加名称，feature 为标签本身，空值单独成一组、键为 null'
      - '每组返回：事件数；token 形态事件数；input、output、cache_creation_input、cache_read_input 四类 token 合计；平均输入 token 与平均输出 token（分母是 token 形态事件数，QUANTITY 形态的事件不进平均）。按计费模式分两块：PREPAID 给事件数、计费额合计（billable_cost）、估算成本合计（estimated_provider_cost_myr）、毛利与毛利率（计费额合计为 0 时毛利率为 null）；INTERNAL_METERED_ONLY 只给事件数、估算成本合计与参考售价合计（reference_customer_price），不给毛利（内部租户的参考售价不是收入，见 docs/design/INTERNAL-METERED-ONLY-2026-10-08.md）。响应顶层带 cost_basis，固定为 estimated'
      - '金额一律 Decimal，输出沿用 money_text 的 8 位小数字符串；平均值与毛利率输出为十进制字符串，全程不经 float；分母为 0 时为 null'
