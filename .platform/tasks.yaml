  - id: AIH-TASK-153
    title: 通知：结算门户通知时同一事务写一行通知邮件，发往租户联系邮箱
    purpose: >-
      设计闸门 #559 v2 的业务规则层：通知类 outbox 行（tenant.low_balance、tenant.billing_status_changed）结算并插入门户通知的同一个事务里，再插入一行 NOTIFICATION_EMAIL_REQUESTED（AIH-TASK-152 的处理器把它发往租户联系邮箱）。结算 UPDATE、通知插入与邮件行插入原子提交，一条通知最多一行邮件行；不出通知（内部计量租户）与 payload 无效时不写；已经存在的通知不补发（Kelvin 2026-11-04 定）。不改钱包、账本、通知规则与邮件投递。
    status: done
    depends_on:
      - AIH-TASK-152
    acceptance_criteria:
      - 'app/tasks/outbox.py 的 _settle_notification：规则给出草稿时，租户查询从只取 Tenant.id 改为同一条 SELECT 取 Tenant.id、Tenant.email、Tenant.company_name（不加锁，查不到仍按无效回滚）；_insert_notification 之后、提交之前，在同一个会话里加一行 DomainOutbox：event_type 为 EVENT_NOTIFICATION_EMAIL，aggregate_type 为 "notification"，aggregate_id 为刚插入的通知的 public_id，status PENDING，attempt_count 0，created_at 与 next_retry_at 都是这个事务的 now（与通知行的 created_at 相同），payload_json 见下一条；flush 失败按事务内异常处理（整个事务回滚）。不出通知与 payload 无效时不写这一行；不 delay() 它（只靠 recover 触发）；_settle_notification 的返回值、结算 UPDATE 的条件与失败分支不改'
      - 'payload_json = json.dumps(payload, sort_keys=True)，键恰好 to（tenants.email）、company_name（tenants.company_name）、notification_type（草稿类型的值）、balance、threshold、occurred_at：balance 与 threshold 是 format(quantize_money(value), "f")（quantize_money 来自 app/models/base.py，结果恰好 8 位小数），threshold 只有 LOW_BALANCE 非空、其他两类为 null；occurred_at 是草稿 occurred_at 的 isoformat()（不带时区、整秒）。不从 app/repositories/wallet.py 导入私有的 _money_text'
