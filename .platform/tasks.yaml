  - id: AIH-TASK-114
    title: 客户导出第二层：CSV 格式模块、导出租约中间件与代理不缓冲配置
    purpose: >-
      按 docs/design/AIH-TASK-113-customer-export.md（设计闸门 #435 已批准 v10）§2「CSV 格式」「上限与资源边界」与 §8 第 2 步的前一半：新模块 app/core/csv_export.py（RFC 4180、BOM、公式注入防护、行数上限 20 000、进程级导出租约、分段发送的 ExportCsvResponse、三个导出错误、最外层释放租约的纯 ASGI 中间件 ExportLeaseMiddleware），app/main.py 把中间件挂在最外层，deploy/nginx/billing.conf 让导出响应不经代理缓冲，docs/deployment.md 记资源与代理说明。不加接口：用量导出接口属于 AIH-TASK-115，钱包导出属于 AIH-TASK-116，前端属于 AIH-TASK-117 与 118。
    status: done
    depends_on: []
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-113-customer-export.md（设计闸门 #435 已批准 v10）逐条一致，以 §2「CSV 格式」「上限与资源边界」（「所有错误响应都在租约内发出」里处理函数的写法除外，那属于 AIH-TASK-115）、§3 INV-1、§6「留存」为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计；tracemalloc 测得峰值超过 128 MiB 时停下说明，不自行调低上限或行数。本任务与 AIH-TASK-115 合起来是设计 §8 第 2 步：登记前预审估计第 2 步约 2 000 行，按拆分规则拆成两层，本任务只交付模块、中间件、代理配置与它们的单元测试，接口一属于 AIH-TASK-115。契约对设计的勘误（只澄清设计内部的措辞与实现位置，不放松任何检查）：①设计 §2「CSV 格式」末条「模块只有纯函数，不碰数据库、不打日志」指写 CSV 与构造附件响应的函数；同一模块里的导出租约按 §2「上限与资源边界」记 customer_export_lease_held_long 警告日志，两者不冲突；②BOM 只在编码成字节时加（例如 encode 时用 utf-8-sig，或在编码后的字节前拼上 BOM 的三个字节），不写进 StringIO：U+FEFF 是非 Latin-1 字符，写进去会让整段文本按双字节存储，20 000 行的峰值会超过 128 MiB（登记前预审的估算）'
      - 'app/core/csv_export.py：只有纯函数与常量，不碰数据库、不打日志；EXPORT_MAX_ROWS = 20000、EXPORT_MAX_CONCURRENT = 1、EXPORT_LEASE_WARN_SECONDS = 120 与进程级导出租约（threading.Lock 保护的当前 token 与获取时刻；不阻塞获取，被占用就返回 None，没有按时间的过期与接管；被占用超过 120 秒时获取失败记一条 customer_export_lease_held_long 警告日志，只带 request_id、每个持有者只记一次；释放只认当前 token）；纯 ASGI 中间件 ExportLeaseMiddleware 对每个 HTTP 请求在 scope 里放一个租约槽（键 acuven.export_lease），在 try / finally 里等待内层应用，finally 里释放槽里的 token（没有就无操作）；写 CSV 的函数（签名 write_csv(columns, rows, text_columns) -> bytes：columns 是表头列名序列，rows 是可迭代的行、每行是与 columns 等长、按同一顺序排好的单元格，单元格只能是 str 或 None；把时间、整数、金额变成字符串，以及 occurred_at 到 occurred_at_utc、created_at 到 created_at_utc 的改名，都由调用方 AIH-TASK-115、116 用白名单视图按 JSON 序列化后的值完成，本模块不做类型转换，遇到 str 与 None 之外的值抛 TypeError）按给定列顺序输出 BOM、表头与各行（QUOTE_MINIMAL、行尾 CRLF、空值为空字段），只对调用方声明的文本列在值以 =、+、-、@、制表符、回车开头时前加单引号；构造附件响应的函数返回 ExportCsvResponse：覆写 ASGI __call__，先发带 Content-Length 的 http.response.start，再把字节按 EXPORT_SEND_CHUNK_BYTES = 65536 用 memoryview 切片逐条发 body（只有最后一条 more_body 为 False，空文件也走同一路径），响应头为 text/csv; charset=utf-8、Content-Disposition attachment（文件名只含 ASCII 字母、数字、-、_、.）、Cache-Control: no-store 与 X-Accel-Buffering: no；EXPORT_TOO_LARGE（422）、EXPORT_BUSY（503，Retry-After: 5）与 CustomerExportFailed（500，code 为 INTERNAL_ERROR）三个错误按现有 AppError 写法定义，文案固定、不回显值'
      - 'app/main.py：把 ExportLeaseMiddleware 作为最后一个 add_middleware（最外层），既有中间件、异常处理器与路由的注册与顺序不变；本任务不新增任何路由，ExportLeaseMiddleware 对没有放进 token 的请求什么都不做'
      - 'deploy/nginx/billing.conf 的 location /api/ 块加一行 proxy_pass_header X-Accel-Buffering;（让本层与外层共享代理都对导出响应关闭缓冲、不写临时文件），别的不动；tests/backend/test_compose.py 只改 test_every_proxied_location_forwards_the_correlation_id 的计数：只数 proxy_pass 指令本身（不把 proxy_pass_header 算进去），断言含义不变，别的用例不动；docs/deployment.md §3.3 的资源限额说明补一句（API 进程里同一时刻至多一个客户导出、峰值 ≤ 128 MiB，改成多进程时按进程数重算；导出依赖两层 nginx 照 X-Accel-Buffering 关闭缓冲，改外层代理时要核对），别的不动'
      - '测试：新增 tests/backend/test_csv_export.py，覆盖设计 §7 用量导出表里 unit 层的行：CSV 转义、公式注入六种前缀与非前缀、上限常量（EXPORT_MAX_ROWS 为 20 000；查询的 limit 是它 + 1 那一句属于 AIH-TASK-115）、并发上限的单元部分（获取、被占返回 None、释放后可再获取）、中间件顺序（检查 create_app() 的 user_middleware）、不接管、槽只释放自己的 token、分段发送、代理配置、tracemalloc 内存上界（20 000 个最长形态 CustomerUsageRow 经 app/schemas/customer_usage.py 现有的 18 键投影走完 write_csv 与编码；投影函数只调用、不改）；CustomerExportFailed 的「抛出的错误不链回原异常」属于 AIH-TASK-115；示例 uuid 用全零占位值'
      - '不改 app/api/、app/schemas/、app/repositories/、迁移与模型，不加路由，不改前端、不改 AI 模块；不装依赖（只用标准库 csv、io、threading、time、tracemalloc 与已有的 Starlette）；deploy/nginx/billing.conf 与 tests/backend/test_compose.py 只做上一条写明的改动'
      - '不对任何数据库执行迁移；不改 .platform/；复选框只允许 [ ] / [x]；不改 planning-v1 块；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推。PR 正文的「设计闸门」写 #435'
    allowed_change_paths:
      - app/core/csv_export.py
      - app/main.py
      - tests/backend/test_csv_export.py
      - deploy/nginx/billing.conf
      - tests/backend/test_compose.py
      - docs/deployment.md
    allowed_commands:
      - docs.check
      - policy.check
      - tests.process
      - lint.fix
      - format.apply
      - lint.check
      - format.check
    execution: sequential
    stop_on_first_failure: true
    max_attempts: 1

    worker_handoff_state: awaiting_review
    worker_failure_state: failed
    terminal_states:
      - completed
      - failed
      - cancelled

    creates_branch: true
    creates_pull_request: true
    prohibited:
      - production_deploy
      - database_migration
      - dependency_install
      - credential_access
      - direct_push_to_protected_branch
