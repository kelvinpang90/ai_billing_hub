      - '表与约束的名称：唯一 uq_monthly_statements_public_id（public_id）、uq_monthly_statements_statement_number（statement_number）、uq_monthly_statements_tenant_period（tenant_id, period_start）；普通索引 ix_monthly_statements_period（period_start, tenant_id）、ix_monthly_statements_generated_by（generated_by）与 ix_monthly_statements_tax_policy_version_id（tax_policy_version_id），后两个显式声明，免得 MySQL 为外键自动建索引；外键 fk_monthly_statements_tenant_id（tenant_id → tenants.id）、fk_monthly_statements_generated_by（generated_by → users.id）与 fk_monthly_statements_tax_policy_version_id（tax_policy_version_id → tax_policy_versions.id，列 BIGINT NOT NULL），都是 ON DELETE RESTRICT；CHECK ck_monthly_statements_status（status IN (''DRAFT'', ''FINALIZED'', ''VOID'')）、ck_monthly_statements_period（period_start < period_end AND period_end < cutoff_at）、ck_monthly_statements_high_sequence（ledger_high_sequence >= 0）、ck_monthly_statements_finalized_at（status <> ''FINALIZED'' OR finalized_at IS NOT NULL）；列名、类型与宽度、可空性照设计 §2 的表，金额以外没有 DECIMAL 列，snapshot_json 为 JSON NOT NULL'
      - 'MySQL 触发器 trg_monthly_statements_before_update（BEFORE UPDATE）与 trg_monthly_statements_before_delete（BEFORE DELETE），主体都是 IF OLD.status <> ''DRAFT'' THEN SIGNAL SQLSTATE ''45000'' SET MESSAGE_TEXT = ''monthly_statements: a finalized or void statement is immutable''; END IF（BEGIN … END 包住）；SQLite 不建触发器。upgrade 照 0028：表不存在 → 建表（MySQL 一条 CREATE TABLE 字面量）再建两个触发器；表已存在且列、索引、外键与 DELETE_RULE、四条 CHECK 名称逐项一致 → MySQL 上读 information_schema.TRIGGERS 逐个比对两个触发器的 ACTION_TIMING、EVENT_MANIPULATION、EVENT_OBJECT_TABLE 与 ACTION_STATEMENT（去掉首尾空白后与迁移里的主体逐字相等）：都在且一致不发 DDL，缺了的只补缺的那个（补完中断的升级），存在但任一项不一致抛错且不发 DDL；MySQL 上任何 DDL 之前先做与 0022、0030 同一个预检（SELECT @@log_bin, @@log_bin_trust_function_creators：开了 binlog 而没开 trust 时抛错、不发 DDL）；离线 --sql 升级读不了库，按「什么都没做过」输出 CREATE TABLE 与两个 CREATE TRIGGER（照 0030 的 _upgrade_offline），不做预检；形状任何一项不一致 → 抛错且不发任何 DDL，消息点名表并写明处理方法（确认表为空后手工删表再升级；有行则停下按数据事故处理）。downgrade：离线 --sql 模式直接抛错、不输出 DROP；表不存在跳过；表有行抛错且不发 DDL、不删行（消息写明保留表、只回滚应用镜像）；表为空先删两个触发器再删表'
