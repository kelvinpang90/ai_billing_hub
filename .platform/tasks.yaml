      spec §47 要求一切通知走 Notification Adapter 抽象，ADR-0009 第 2 节要求第二类邮件出现之前先抽出模板层；今天 app/core/mailer.py 只有一个按「收件人 + 标题 + 正文」发信的 EmailTransport，密码重置信与门户邀请信的正文硬编码在 app/tasks/outbox.py。本任务新增通道无关的 Adapter 接口（按「收件人 + 模板键 + 参数」发送，结果带一个可为空的供应商消息 ID，留给以后需要投递回执的 WhatsApp）、只用标准库的邮件模板层与基于既有 SMTP 传输的 Email adapter，outbox 改为经 Adapter 发信。两封现有邮件的收件人、标题与正文逐字不变，outbox 的投递语义不变；不加新邮件（低余额、停机、复机的 Email 通道另立任务），不做 WhatsApp，不做回执接收，模板只有英文。
