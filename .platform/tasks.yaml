  # R5 的最后一刀：补齐 AIH-TASK-007 留下的 15 个缺口（覆盖表在 docs/REQUIREMENTS.md 第 1.3 节）。
  #
  # ⚠️ 本任务是**唯一一个会改 spec 正文**的已登记任务。spec 是需求的事实来源，所以契约把它
  #    锁成「只许新增、不许改写」：见验收条件第 2 / 3 / 4 条，其中第 3 条是机械可查的 ——
  #    spec 文件的 git diff 里删除行恰好一行，且必须就是文件头的 Version 行。
  #
  # 分档口径由 Kelvin 于 2026-09-21 拍板（三个选项里选「分档补」）：15 个缺口性质不同，
  # 不能一刀切发编号。
  #   · Invariant 7（成本 / 毛利对客户不可见）、Invariant 13（钱包变更 + 状态跃迁 + 审计 +
  #     domain outbox 同事务提交）是真正的系统不变量 —— 新增 REQ；
  #   · Gate 1（SST 口径）、Gate 4（支付 / Email / WhatsApp 真实账号打通）是上线闸门，
  #     可独立验收 —— 新增 REQ；
  #   · DoD 1–8 与 DoD 13–15 共 11 条（要有迁移 / 校验 / 授权 / 审计 / 测试 / 错误处理 /
