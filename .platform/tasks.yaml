      - 加载中、失败（带 request_id，用 RequestReference）、空列表三种状态都画出来；403 ADMIN_REQUIRED 显示无权限提示；409 / 422 显示后端 error.code 对应的 i18n 文案（未知码回落到后端 message）
      - 写操作（新建、编辑、发布、停用 / 退役、丢弃、撤销、重新入队）都要二次确认；提交中禁用按钮防重复提交；成功后刷新列表
      - 所有面向用户的文案走 i18n，满足 no-hardcoded-jsx-text 与 frontend/src/i18n/keys.test.ts
