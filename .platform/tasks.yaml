    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-164-billing-client.md（设计闸门 #571 已批准 v24） 逐条一致，以 §2「有效状态」「状态 webhook」、§3 INV-1、INV-7、INV-8、§4 有效状态的版本表、§5 对账、webhook 与状态表读失败各行、§7 标 169 的各行 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - 'status.py：reconcile_status_once 签名 GET /api/v1/integration/effective-status（空请求体、超时取配置）；应答校验照设计（200、data 是对象且含服务端 10 个字段、类型对、tenant_id 与 project_id 等于配置、status_version 为非负整数、effective_status 只能是 ALLOW_AI 或 BLOCK_AI；多出的字段忽略不存）；不过则记 WARNING、record_reconcile_error、不应用；通过则 apply_status 后 record_reconcile_ok（不论是否覆盖）；对账过程中读写库抛 sqlite3.Error 也算一次失败（记 WARNING，尽力 record_reconcile_error）；reconcile_status_once 返回是否成功、不抛；status_version 为 bool 时不算整数；节奏照设计（start 后立即查、成功后 240 秒、一段连续失败只在第一次失败后 30 秒补查一次、之后每次失败 240 秒），下一次时刻按注入的时钟计算，手动调用 reconcile_status_once（包括第一次 start() 之前）与后台线程共用同一份节奏状态，并由一把锁串行（手动调用遇到对账线程正在对账时等它完成再做自己的一轮），调用后 next_reconcile_at 按结果更新；门面提供只读属性 next_reconcile_at（下一次对账的 Unix 秒，供测试观察）；对账线程用停止事件的 wait 等待，每次最多等 5 秒，醒来都重新读这份状态，没到时刻就继续等；start() 同时重置「本段连续失败已补查过」的标记；第一次 start() 与第一次手动对账之前 next_reconcile_at 为 None；应答字段类型：tenant_id、project_id、billing_mode、billing_status、account_status、project_integration_status、effective_at 为字符串，reason_code 为字符串或 null，status_version 为非负整数（bool 不算），effective_status 只能是 ALLOW_AI 或 BLOCK_AI；其余字符串字段不校验取值范围（服务端可能新增取值）；should_block_ai() 只看配置那一对有没有状态行与其 effective_status，与对账是否成功过无关'
      - 'should_block_ai() 只在配置那一对已有 status_state 行且 effective_status 为 BLOCK_AI 时返回真（store_available 为假时直接返回假、不访问库；对账线程在 store_available 为假时跳过的那一轮不算失败、不写 reconcile_state，next_reconcile_at 保持为原值（已到期），存储恢复后的下一次唤醒立即对账；status_version 超过 2^63 − 1 时对账与 webhook 都按字段校验不通过处理（对账记失败，webhook 抛 WebhookVerificationError），不让 OverflowError 漏出；门面在本任务加 reset_status(*, reason)，转调 store.reset_status 作用于配置的那一对；current_status() 在降级时返回 None；handle_status_webhook 在降级时验签通过后抛 StatusStoreError（接入方回 503）；状态路径上遇到存储错误或 StoreReplacedError 同样按 AIH-TASK-168 的规则转入降级；对账线程在 store_available 为假时不对账；reconcile_status_once() 在降级时先尝试重新打开，打开成功再对账，仍失败则算一次失败、返回假）；读库失败或没有行返回假、不抛、记 WARNING；current_status() 返回已应用状态（设计的 10 个字段加 applied_at 组成的字典），没有或读库失败返回 None、不抛'
