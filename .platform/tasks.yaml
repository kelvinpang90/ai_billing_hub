    purpose: >-
      合并 docs/TODO.md 后续计划里的两项（用量按功能汇总；Phase 5 管理端内部成本、毛利与供应商模型分析，spec §128 与 §87）：新增只读接口 GET /api/v1/admin/usage-analytics，在新文件 app/api/admin_usage_analytics.py、app/repositories/usage_analytics.py、app/schemas/usage_analytics.py 里实现，路由挂到 app/main.py。只读 usage_events，不写任何表，不加迁移。
