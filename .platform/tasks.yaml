        - check_meter_types

    worker_handoff_state: awaiting_review
    worker_failure_state: failed
    terminal_states:
      - completed
      - failed
      - cancelled

    creates_branch: true
    creates_pull_request: true
    prohibited:
      - production_deploy
      - database_migration
      - dependency_install
      - credential_access
      - direct_push_to_protected_branch
      - merge
      - bypass_ci
      - bypass_review

