# 控制契约 —— 可调度任务 allowlist
#
# 默认 deny。未在 tasks 里列出的 task_id 一律拒绝，不做前缀匹配、不做模糊匹配，
# 也不因为「格式看起来像 AIH-TASK-xxx」就放行 —— 格式合法只是进入校验的门槛，
# 不是授权。

schema_version: 1
project_id: ai_billing_hub
default: deny

unknown_task_id:
  action: reject
  state: failed
  # 拒绝理由只回给请求方，不写进任何外部通知
  reason_code: unknown_task_id

# status：ready = 已登记、可以在 Telegram 发「开启」；done = 已交付（合并并部署）；
#   superseded = 未交付、由 Kelvin 决定不再做（写明原因）。Worker 只接受 ready，其余一律拒绝。
#   控制面只从 ready 里推荐下一个任务（ACVDEV-TASK-019）。run 完成后由 OpenClaw 自动开收尾 PR，
#   只把 ready 改成 done、把这一项移出 docs/TODO.md 的「当前计划」，CI 通过后自动合并、不触发部署
#   （ACVDEV-TASK-066）；Worker 的实现 PR 仍然改不了 .platform/。自动收尾失败时才由人手工开收尾 PR。
tasks:
  - id: AIH-TASK-001
    title: platform control contract
    purpose: 验证 .platform 控制契约本身，并跑仓库里已有的只读 / 测试检查
    # 只能引用 .platform/commands.yaml 里存在的 low risk 命令
    allowed_commands:
      - docs.check
      - policy.check
      - tests.process
      - lint.check
      - format.check
      - tests.backend
      - scripts.verdict_tests
    # 顺序执行；任一条非零退出即整体 failed，不继续往下跑
    execution: sequential
    stop_on_first_failure: true
    max_attempts: 1

    # ⚠️ 交接态 ≠ 终态。这两样必须分开写，否则「Worker 成功后停在 awaiting_review」
    #    会被读成「run 到此为止、不得再迁移」，控制面就永远推不到 awaiting_merge /
    #    completed，同一个 run 在两个组件眼里一个是完了一个是没完。
    #
    # worker_handoff_state 是本任务的「成功状态」：Worker 干完活、交给 reviewer，
    # 自己**不再对这个 run 做任何事**。之后由控制面按人的判定继续推进。
    worker_handoff_state: awaiting_review
    worker_failure_state: failed

    # 真正的终态：进去之后不再有任何合法迁移。
    # awaiting_review / awaiting_merge 都**不在**这里 —— 它们是在等人。
    terminal_states:
      - completed
      - failed
      - cancelled

    # 允许的迁移写在 .platform/README.md 的状态迁移表里，由 Worker 与控制面在
    # 运行时强制。JSON Schema 只看单份文档，保证不了跨文档的迁移合法性。
    # 本任务不产生任何 GitHub 写操作。分支与 PR 字段在状态里保持 null。
    creates_branch: false
    creates_pull_request: false
    prohibited:
      - production_deploy
      - database_migration
      - dependency_install
      - credential_access
      - direct_push_to_protected_branch
      - merge
      - bypass_ci
      - bypass_review

  # 第一次端到端 Pilot（ACVDEV-TASK-004 登记）。刻意选一个只动非生产文档的任务：
  # 验证的是「Worker 里的 Claude 实现 → 开 Draft PR → Codex 只读审查 → Kelvin 合并」
  # 这条链本身，不是业务功能。
  - id: AIH-TASK-002
    title: OpenClaw Windows Worker end-to-end pilot (docs only)
    purpose: >-
      由 Worker 中的 Claude 新增或更新一份 OpenClaw Worker Pilot 说明文档，
      走完建分支、本地检查、开 Draft PR 的完整路径，验证 Worker 端到端链路；
      不触碰任何应用代码、部署、CI、生产配置或凭据。
    # superseded（Kelvin 2026-09-19 决定）：本 Pilot 从未交付，docs/openclaw-worker-pilot.md 不存在；
    # 它要验证的端到端链已由 AIH-TASK-004 / AIH-TASK-005 的真实 run 验证，所以不再做。
    status: superseded
    # 没有前置任务。启用本身的 gate 写在 project.yaml 的 enable_preconditions，
    # 不在这里表达成任务依赖。
    depends_on: []
    acceptance_criteria:
      - 新增或更新 docs/openclaw-worker-pilot.md，全文不含本机路径、主机名、IP / 地址、凭据或 token
      - 文档说明角色：Claude 是 implementer，Codex 是 read-only reviewer，Kelvin 批准 merge 与 deploy
      - 文档明确写出本次 Pilot 不部署、不做数据库迁移、不访问凭据
      - 改动只落在 docs/ 下的非生产文档；不改 .platform/、AGENTS.md、CLAUDE.md、应用代码、部署脚本、CI 或生产配置
      - allowed_commands 里的检查全部零退出
      - 以 Draft PR 交付，按 docs/WORKFLOW.md 使用 PR 模板；不合并、不直推
    # 本 run 允许改动的文件：仓库根相对的 POSIX 路径，**逐个精确匹配**，
    # 不是 glob、也不是目录前缀。rename / copy 的源和目标都必须在列表里。
    # ⚠️ 这是机器可读字段，但强制它的是控制面 Worker 的 parser 与 pipeline：
    #    在跑检查、commit、push、开 Draft PR 之前核对，不在列表里一律 failed。
    #    Worker 预检针对本任务校验不通过时，本任务不得运行。
    # ⚠️ 第一次 Pilot 未通过。Worker 里刻意没有真实 Git，policy.check / tests.process 要改为
    #    消费只读 manifest，重试前须先合并 AIH-TASK-003。本文件不记录重试结果。
    #    （2026-09-19：AIH-TASK-003 已由 #81 合并；本任务改为 superseded，见上面的 status，不再重试。）
    allowed_change_paths:
      - docs/openclaw-worker-pilot.md
    # 纯文档改动，只跑文档 / 策略 / 流程脚本回归三项；后端检查由 CI 覆盖。
    # 只能引用 .platform/commands.yaml 里存在的 low risk 命令
    allowed_commands:
      - docs.check
      - policy.check
      - tests.process
    execution: sequential
    stop_on_first_failure: true
    max_attempts: 1

    worker_handoff_state: awaiting_review
    worker_failure_state: failed
    terminal_states:
      - completed
      - failed
      - cancelled

    # 本任务会建分支、开 Draft PR，所以它的 run 会经过 awaiting_merge。
    # ⚠️ 开 PR 在 approvals.yaml 里是 approval_required：这里写 true 只表示本任务
    #    **可以**申请这个动作，执行前仍需一张绑定到本 run 的一次性批准。
    creates_branch: true
    creates_pull_request: true
    prohibited:
      - production_deploy
      - database_migration
      - dependency_install
      - credential_access
      - direct_push_to_protected_branch
      - merge
      - bypass_ci
      - bypass_review

  # 业务仓库适配，不是生产功能。policy.check 与 tests.process 原本需要真实 Git，而 Worker
  # 刻意不提供；控制面 ACVDEV-TASK-005 改为给出只读的 `git ls-files` manifest（环境变量
  # ACUVEN_GIT_LS_FILES_MANIFEST）。本任务让仓库侧按精确契约消费它，以便之后安全地重试
  # 未通过的 AIH-TASK-002 Pilot。
  # ⚠️ 本条登记（.platform/tasks.yaml、.platform/commands.yaml、.platform/README.md 的相应改动）
  #    是管理员登记前置条件：必须由管理员先单独合并，之后才能调度本任务的 Worker run。
  #    Worker 本任务不改 .platform/ 下任何文件；控制面 Worker 拒绝 allowed_change_paths 里的
  #    任何 .platform 路径。
  # ⚠️ 契约修正（管理员登记，同样须先合并再调度）：一次真实的 Windows MXC run 里，设置了
  #    ACUVEN_GIT_LS_FILES_MANIFEST 后 tests.process 跑到了不依赖 Git 的用例
  #    tests/test_gh_verified_write.py::VerifiedWriteTests::test_file_with_spaces_unicode_and_relative_path：
  #    Unicode 临时文件已创建且确实在工作树里，但 Path.resolve(strict=True) 报 WinError 5 ——
  #    AppContainer 拒绝最终路径解析。本地与 CI 全量运行该用例是通过的。因此把该测试文件加进
  #    allowed_change_paths，且只允许这**一个**用例在设置了该变量时以固定原因 skip。
  #    本登记不声称 AIH-TASK-003 或其重试已通过。
  - id: AIH-TASK-003
    title: consume the read-only Git manifest in Worker mode
    purpose: >-
      让 scripts/check_repo_policy.py 在检查仓库根且设置了 ACUVEN_GIT_LS_FILES_MANIFEST 时
      读取只读 manifest 而不调用 Git，任何读不懂的 manifest 一律 fail closed；
      未设置该变量时本地 / CI 行为不变。只做业务仓库适配，不部署、不迁移、不访问凭据。
    status: done
    depends_on: []
    acceptance_criteria:
      - 未设置 ACUVEN_GIT_LS_FILES_MANIFEST 时 check_local 照旧调用 git ls-files -z --cached --others --exclude-standard，有测试证明
      - 设置该变量且检查仓库根时读取 manifest 字节，不启动 Git；严格 UTF-8、NUL 结尾记录，与 git ls-files -z 输出逐条对应
      - 文件缺失 / 不可读 / 链接或 reparse point / 非绝对或未规范化路径 / 超过 1000000 字节 / 非法 UTF-8 / NUL 分帧错误 / 绝对、穿越、点段、反斜杠或其它歧义记录，一律 PolicyError（退出码 2）；策略违规仍为 1
      - 单测传入的临时仓库根不走 manifest；PR 正文与回应检查仍只走真实 Git
      - 只在设置了该变量时跳过需要真实 Git 的用例，跳过原因固定；manifest 消费用例照常运行；CI 不设变量，全量运行
      - 不依赖 Git 的用例里，只有 tests/test_gh_verified_write.py::VerifiedWriteTests::test_file_with_spaces_unicode_and_relative_path 可以跳过，且只在设置了该变量时；跳过原因固定并明确写出 Windows MXC（AppContainer）拒绝最终路径解析；不得跳过整个模块或整个类，不得跳过其它不依赖 Git 的用例；CI 不设变量，必须运行它
      - docs/TODO.md 记录本任务结果；不声称 AIH-TASK-003 或 AIH-TASK-002 的重试已通过
      - 改动只落在 allowed_change_paths；不改 .platform/ 下任何文件（其说明与登记属于管理员前置条件，须在 Worker run 之前已合并）；不输出本机路径、主机名、凭据
      - allowed_commands 里的检查全部零退出；以 Draft PR 交付，不合并、不直推
    allowed_change_paths:
      - scripts/check_repo_policy.py
      - tests/test_check_repo_policy.py
      # 只为上面那一个 MXC 最终路径解析用例的条件 skip；不得改动该文件里的其它用例
      - tests/test_gh_verified_write.py
      - docs/TODO.md
    allowed_commands:
      - docs.check
      - policy.check
      - tests.process
    execution: sequential
    stop_on_first_failure: true
    max_attempts: 1

    worker_handoff_state: awaiting_review
    worker_failure_state: failed
    terminal_states:
      - completed
      - failed
      - cancelled

    creates_branch: true
    creates_pull_request: true
    prohibited:
      - production_deploy
      - database_migration
      - dependency_install
      - credential_access
      - direct_push_to_protected_branch
      - merge
      - bypass_ci
      - bypass_review

  # Phase 1 的第一刀：只建 tenants / projects 两张「身份 + 归属」表，加迁移、repository 与测试。
  # 刻意收窄（Kelvin 2026-09-19 批准）：spec §75 / §76 里的状态列（account_status / billing_status /
  # status_version / integration_status）属于 §24 状态模型，碰状态机按 docs/WORKFLOW.md §3 必须走
  # 设计闸门，而 Worker 开不了闸门 Issue —— 留给之后过闸门的任务，与状态迁移逻辑一起设计；
  # low_balance_threshold / currency 属于钱包任务；webhook 的 URL 与密钥列等 ADR-0004 第 4a 节的
  # 决定；backend_base_url 归 Phase 3。这些以后都是纯新增列，生产表那时仍是空的。
  # projects 表结构裁决（public_id 即 §57 的 project_id；加可空 description）见 docs/database-schema.md。
  # ⚠️ 本条登记是管理员前置条件：须先合并，之后才能调度本任务的 Worker run。
  #    Worker 本任务不改 .platform/ 下任何文件。
  # ⚠️ 「写迁移文件」是代码改动，在 allowed_change_paths 之内；「执行迁移」仍是 prohibited 里的
  #    database_migration —— Worker 不得对任何数据库跑 alembic。生产上的迁移由合并后的
  #    自动部署（deploy.sh 先迁移、再换镜像）执行，不另设批准。
  - id: AIH-TASK-004
    title: tenant and project identity tables, migration, repository
    purpose: >-
      新增 tenants / projects 两张表（只含身份与归属字段）、Alembic 迁移 0005、同步 Session 的
      repository 与测试。不含状态、金额、认证、webhook，不含 API / 服务层 / 审计写入 / 前端，
      不部署、不对任何数据库执行迁移、不访问凭据。
    status: done
    depends_on: []
    acceptance_criteria:
      - tenants 表：id BIGINT 主键；public_id CHAR(36) 唯一（uuid4）；company_name 非空；email 非空且不唯一；contact_name、phone 可空；created_at、updated_at 非空
      - projects 表：id；public_id 同上；tenant_id 外键指向 tenants.id，ON DELETE RESTRICT，非空；name 非空；description 按 docs/database-schema.md（可空）；created_at、updated_at 非空
      - 迁移 revision 为 0005_tenants_projects、down_revision 为 0004_password_reset_outbox；只含两个 create_table 与逆序 drop，不 ALTER、不删除任何已有表
      - repository 用同步 Session，只 flush 不 commit，时间戳由调用方传入；只提供 create_tenant、get_tenant_by_public_id、create_project、get_project_for_tenant(tenant_id, public_id)、list_projects_for_tenant；取别的租户的项目返回 None；不记录联系人等个人字段
      - SQLite 测试覆盖往返读写、public_id 为互不相同的 uuid4、跨租户返回 None 与列表隔离、未提交可回滚；MySQL 测试（BILLING_TEST_DATABASE_URL，只在 CI 跑）覆盖 upgrade / downgrade、列形状、FK RESTRICT、public_id 唯一
      - 不含状态列、status_version、low_balance_threshold、currency、webhook 的 URL 或密钥列、backend_base_url、credential、API / schema / 服务层、审计写入、users.tenant_id
      - docs/TODO.md 新增 AIH-TASK-004 记录段：做了什么、与 spec §75 / §76 字段的差集、验证到什么程度；不勾选 Phase 1 的 Tenant / Project
      - 改动只落在 allowed_change_paths；app/repositories/__init__.py 只改 docstring 里关于事务的那一句，alembic/env.py 只加 import 新模型模块那一行；不改 .platform/ 下任何文件；不输出本机路径、主机名、凭据
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付（设计闸门：不适用，附 spec §132 第 13 条迁移分析），不合并、不直推
    allowed_change_paths:
      - app/models/tenancy.py
      - app/repositories/__init__.py
      - app/repositories/tenancy.py
      - alembic/env.py
      - alembic/versions/20260919_0005_tenants_projects.py
      - tests/backend/test_migrations.py
      - tests/backend/test_tenancy_repository.py
      - docs/TODO.md
    # 只跑在 Worker 的 MXC 里实测能运行的三项。lint.check / format.check / tests.backend 在 MXC 里
    # 跑不起来（2026-09-19 用 Worker 自己的 build_guarded_argv 实测）：`python -m ruff` 要再拉起
    # ruff.exe，进程初始化失败（0xC0000142）；tests.backend 一 import sqlalchemy 就走到
    # platform.machine() → WMI 查询，AppContainer 里整进程崩溃（0xC06D007E）。前两次 run
    # （150ccdba、b603c5d3）都因此 checks_failed，实现本身在 MXC 外全部通过。
    # 这三项由 CI 覆盖（CI 全量运行、起真 MySQL，并把任何 skipped 判失败），准入以 CI 为准。
    allowed_commands:
      - docs.check
      - policy.check
      - tests.process
    execution: sequential
    stop_on_first_failure: true
    max_attempts: 1

    worker_handoff_state: awaiting_review
    worker_failure_state: failed
    terminal_states:
      - completed
      - failed
      - cancelled

    creates_branch: true
    creates_pull_request: true
    prohibited:
      - production_deploy
      - database_migration
      - dependency_install
      - credential_access
      - direct_push_to_protected_branch
      - merge
      - bypass_ci
      - bypass_review

  # Phase 1 第二刀：钱包与不可变账本的数据层 + 由余额驱动的计费状态。碰钱，已过设计闸门：
  # Issue #88 `APPROVED: design v6`（Claude Code 审查者，Codex 额度不可用期间临时替代）。
  # Worker 读不到 GitHub，所以批准的设计逐字放在 docs/design/AIH-TASK-005-wallet-ledger.md，
  # 实现以它为准。
  # ⚠️ 前置条件：生产 MySQL 的 log_bin_trust_function_creators = 1（#90，已生效）；CI 的 MySQL service
  #    在跑后端测试之前用 root 设同一个全局变量（本登记 PR 加入 ci.yml，test_compose 守住）。
  # ⚠️ 设计的核心控制在 MySQL 触发器里，SQLite 上没有；repository 的记账行为测试必须对着真 MySQL
  #    （BILLING_TEST_DATABASE_URL）跑，只在 CI 里生效。Worker 跑不了 tests.backend，准入以 CI 为准。
  # ⚠️ Worker 生成的 PR 正文里「设计闸门：」是固定的「不适用」；开 PR 后由实现方改为「设计闸门：#88」再审。
  # ⚠️ 本条登记是管理员前置条件：须先合并，之后才能调度本任务的 Worker run。
  - id: AIH-TASK-005
    title: wallets, immutable ledger, and balance-driven billing status
    purpose: >-
      按 docs/design/AIH-TASK-005-wallet-ledger.md（设计闸门 #88 已批准 v6）实现：wallets 与
      wallet_transactions 两张表、tenants 的 billing_status / status_version / low_balance_threshold、
      迁移 0006（含预检与 6 个 MySQL 触发器）、同步 Session 的 wallet repository（只 flush 不 commit），
      以及 outbox 恢复任务只重投有处理器的事件类型。不含 API、服务层、管理端、充值、用量与通知投递。
    status: done
    depends_on: []
    acceptance_criteria:
      - 实现与 docs/design/AIH-TASK-005-wallet-ledger.md 逐条一致；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计
      - 表、列、类型、约束、索引、CHECK 与 6 个触发器（账本 BEFORE INSERT / AFTER INSERT / BEFORE UPDATE / BEFORE DELETE，钱包 BEFORE INSERT / BEFORE UPDATE）按设计 §2 建；迁移 0006 revision 为 0006_wallets_ledger、down_revision 为 0005_tenants_projects，第 0 步预检在任何 DDL 之前
      - repository 提供 create_wallet、get_wallet_for_tenant、post_transaction、list_transactions_for_tenant、verify_wallet；两处加锁读用 with_for_update + populate_existing=True；不直接 UPDATE wallets；记账后使 Wallet 过期；返回余额以账本行 balance_after 为准
      - post_transaction 在同一次 flush 里完成账本插入、调账与系统更正的 audit_logs（WALLET_ADJUSTMENT_POSTED）、计费状态跃迁（tenants 更新、TENANT_BILLING_STATUS_CHANGED 审计、tenant.billing_status_changed 事件）与低余额事件（tenant.low_balance）；只 flush、不 commit
      - app/tasks/outbox.py 的 recover 只重投有渲染器的 event_type；deliver 不变；既有密码重置事件照常重投
      - 测试按设计 §7：纯函数用 SQLite 或纯 Python；凡调用 post_transaction / create_wallet / verify_wallet 的场景一律用 BILLING_TEST_DATABASE_URL 的真 MySQL（未设置时 skip），覆盖 §7 列出的全部场景
