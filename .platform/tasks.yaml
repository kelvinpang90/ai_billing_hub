      - 'app/repositories/usage_events.py：新增汇总函数，在同一个只读事务、同一个连接里发两条 SELECT（按马来西亚日分组的 COUNT 与 SUM(billable_cost)；COUNT(DISTINCT conversation_id)），WHERE tenant_id 与 status = PROCESSED 与月份区间恒在，不加锁、不写、不读任何成本列；马来西亚日期表达式按方言生成（MySQL DATE(DATE_ADD(occurred_at, INTERVAL 8 HOUR))，SQLite date(occurred_at, +8 hours)）；MySQL 上两条都带 MAX_EXECUTION_TIME 提示并复用 AIH-TASK-104 的常量与只给测试用的超时参数，超时转 QueryTooBroad、接口 422 QUERY_TOO_BROAD 并记 customer_usage_query_timeout 日志（不带参数值），SQLite 上不带提示；没有事件的日子在 Python 里补 0；合计 = 各日 Decimal 相加，经现有 money_text 格式化，不经 float'
