    acceptance_criteria:
      - 语义一律以 docs/api.md「管理端手工调账」与 docs/design/AIH-TASK-010-admin-wallet-adjustment.md 为准；与后端代码冲突时停下，在 PR 里说明。不改任何后端文件与设计文件
