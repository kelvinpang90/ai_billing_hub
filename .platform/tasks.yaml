    acceptance_criteria:
      - '用例与 docs/design/AIH-TASK-086-session-revocation.md（设计闸门 #369 已批准 v6）§7 的并发各行逐条对应，场景、屏障位置与预期结果以设计为准：登录与改密码并发、第二因子消耗与改密码并发（①锁前暂停，②持锁时重置等待，两种先后）、第二因子失败与锁、刷新与改密码并发（屏障在锁用户行之前，两种先后）、刷新持锁时改密码（原死锁交错）、刷新与登出并发、认证材料写入与改密码并发（含恢复码重新生成在鉴权之后、进服务之前的屏障）、死锁兜底。另加「真正的重放不受影响」里两个并发刷新抢同一行的那一半（预期与现在一致：一个成功、另一个走 _treat_as_replay）。勘误（优先于设计）：设计里写的 401 INVALID_TOKEN 是现有错误码 TOKEN_INVALID；「第二因子消耗与改密码并发」②（重置在 /login/totp 持有用户行锁期间开始）只可能出现 /login/totp 先提交这一种先后，只跑这一种，另一种先后由 ① 覆盖'
      - '只在 BILLING_TEST_DATABASE_URL 设置时运行，未设置时 skip 并写明原因，CI 必跑。暂停点不改产品代码：用 SQLAlchemy 的 before_cursor_execute / after_cursor_execute 或 Session 的 before_commit 事件，在匹配到目标语句（例如对 users 的 SELECT … FOR UPDATE、对 refresh_tokens 的条件 UPDATE、写 2FA 行的 INSERT）时等待 threading.Event。确认对方事务确实在等行锁：轮询 performance_schema.data_lock_waits，经 performance_schema.threads 的 PROCESSLIST_ID 对上等待方自己那条连接的 CONNECTION_ID()，并经 performance_schema.data_locks 确认它请求的锁在 users 表上（间隔 50 毫秒、最多 10 秒，超时即失败）；不用 information_schema.INNODB_TRX 判断是否在等锁——它读的是一份距上次读取不满 0.1 秒就不刷新的缓存，按 50 毫秒轮询会一直读到旧快照（run d56365f0 因此失败），超时诊断里报出它的内容不受此限。这是只在 MySQL 上跑的用例，可以用 MySQL 专有 SQL。认证材料写入与改密码的两种先后：改密码先提交——写入方在锁用户行的语句之前暂停，重置提交后放行，预期 401、不写；写入先提交——写入方在提交之前暂停，此时开始重置并用 data_lock_waits 确认它在等锁，再放行写入，预期写入成立、之后旧会话 401。每个等待都设超时，超时即失败并报出停在哪一步，不允许无限等待；需要调 reset_password 的用例直接调用服务；跨用例共用的 fixture 若要放进 conftest，停下说明（本任务只许改一个文件）'
      - '每个用例都断言设计写明的最终状态：对外结果（状态码与错误码）、令牌行与版本号、2FA 设置与恢复码、审计行（尤其是「没有 TOKEN_REUSED 审计」的那几条）；不出现死锁错误的用例同时断言没有抛 OperationalError'
      - '测试若暴露实现缺陷（例如死锁、行为与设计不符），停下并在 PR 里写明现象与复现方式，不修改任何产品代码，也不放宽断言让它通过'
      - 'SQL 断言不写死方言字面量（CLAUDE.md「写后端测试的约定」）；示例 uuid 用全零占位值；不装依赖；不对任何数据库执行迁移；不改 .platform/；复选框只允许 [ ] / [x]；不改 planning-v1 块；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推。PR 正文的「设计闸门」写 #369'
