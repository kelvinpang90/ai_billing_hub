      - '载荷照设计 §2「事件」：没给的 conversation_id、feature 不出现（不是 null）；LLM 载荷没有 quantity 与 unit，QUANTITY 载荷没有四个 token 字段；**载荷不带 tenant_id 与 project_id**；quantity 只收有限的 Decimal 或完全匹配「ASCII 数字、可选的小数点加 ASCII 数字」的字符串（不允许空白、正负号、下划线、指数与 Infinity 之类；int、float 与其他类型抛 ValueError，照设计只收这两种），先去掉小数尾零再按位数判定（0.000000010 规范化为 0.00000001，1E+3 输出 1000），负数、非有限值、整数超过 12 位、小数超过 8 位抛 ValueError；序列化为 sort_keys、紧凑分隔符、ensure_ascii=False 的 UTF-8 字节，超过 16 KiB 抛 ValueError'
      - 'signing.py：canonical_request(method, path_and_query, timestamp, request_id, body) 按 docs/api.md「集成请求签名」逐条实现（大写方法、路径原样、查询串按键值整段的 UTF-8 字节序排序、没有查询串时不带问号、空请求体也算 SHA-256）；sign(secret, canonical) 为 HMAC-SHA256 小写十六进制；request_headers(config, method, path_and_query, body, *, timestamp: int, request_id: str) 返回设计列出的五个签名头与有请求体时的 Content-Type；verify_webhook_signature(*, secrets, key_version, method, path_and_query, timestamp: str（请求头原值，原样进规范串）, event_id, body, signature) -> bool 照设计只做取密钥、算签名、比较：key_version 不是 int 或是 bool 时直接返回假，signature 不是 64 个小写十六进制字符时直接返回假，否则把两边转成 ASCII 字节再 hmac.compare_digest，任何输入都不抛异常；版本不在 secrets 里返回假；本模块不读时钟、不生成 id'
      - '测试：新增 integration-client/tests/test_client_config.py、integration-client/tests/test_client_events.py、integration-client/tests/test_client_signing.py，覆盖设计 §7 标 164 的各行，另加 WEBHOOK_SECRETS 格式错误（缺冒号、版本非数字、密钥为空）时异常消息不含任何密钥值；签名对照向量照抄 tests/backend/test_integration_auth.py 的全零占位输入与期望签名（不 import tests 或 app）；客户端测试只用标准库与 pytest，SQLite 用 tmp_path 下的文件，HTTP 用注入的假 Transport，时间用注入的时钟，不联网、不 sleep 真实时间、不出现 skipped（CI 的 backend-tests 分片把出现 skipped 判为失败）；根 pyproject.toml 的 [tool.pytest.ini_options] 中 testpaths 加 "integration-client/tests"、pythonpath 加 "integration-client"（原有值保留、顺序不变），上方注释写明客户端测试随 backend-tests 分片在 CI 里跑，其余配置不改'
