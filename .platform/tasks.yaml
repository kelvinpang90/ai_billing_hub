    status: done
    depends_on:
      - AIH-TASK-157
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-154-monthly-statements.md（设计闸门 #565 已批准 v6） 逐条一致，以 §2「告警」、§3 INV-14、§5 告警一列、§6 日志一条、§7 告警三行 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - '缺失对账单：对 due_periods(now) 里 cutoff + STATEMENT_MISSING_GRACE <= now < cutoff + STATEMENT_MISSING_GRACE + STATEMENT_MISSING_WINDOW 的每个账期与每个生成时 is_eligible 的租户，没有对账单的项数大于 0 即 P2；摘要 <n> statements missing, earliest period <YYYY-MM>，没有缺失时这一段是 0 statements missing；常量 STATEMENT_MISSING_GRACE: Final = timedelta(hours=6) 与 STATEMENT_MISSING_WINDOW: Final = timedelta(hours=24)，常量旁的注释写明只报 24 小时的理由（设计 §2「告警」：永久停出若一直报，这个维度的 Healthchecks 检查会一直 down，遮住之后的 P1）'
      - '晚到用量占比：窗口为 [now − 24 小时, now)，按马来西亚月边界拆成至多两段，每段只统计 billing_mode 为 PREPAID 的租户的 AI_USAGE 账本行（按 created_at，走 ix_wallet_transactions_tenant_created：tenant_id 用 IN 列表），内连接事件；晚到 ⇔ 该段所在月 K 下 occurred_at < start(K) AND NOT (occurred_at >= start(K-1) AND created_at < cutoff(K-1))，与 AIH-TASK-155 的 attributed_month 判定一致；晚到条数占比或金额占比 >= 1%（常量 LATE_USAGE_SHARE_P2: Final = Decimal("0.01")，用精确的 Decimal 比值与它比较，摘要里舍入后的百分比只用于显示、不参与判定，例如 0.995% 显示为 1.00% 但级别 OK）即 P2；只统计内连接得上事件的行；摘要 late usage 24h <a>/<b> rows (<x>%), <y>% of amount，百分比 ROUND_HALF_UP 到两位小数、分母为 0 时写 0.00（窗口内没有行时恰为 late usage 24h 0/0 rows (0.00%), 0.00% of amount，级别 OK）；不带租户、金额与公司名'
      - '合并：现有三部分（到期积压、PROCESSING、过期租约）的判据、级别与摘要文字一字不改，新两段各成一段用 ; 接在现有摘要之后，维度级别取全部部分中最严重的一个（照 wallet_negative_balance 的合并写法）；不加维度、不改维度顺序与 DIMENSIONS 注册表的其余条目；模块文档里 usage_processing_backlog 的说明补上两段新判据与出处'
      - '测试：tests/backend/test_usage_alerts.py 补设计 §7 告警三行：缺失在 cutoff + 6h 与 cutoff + 30h 前后各一秒（+6h 之前 OK、窗口内 P2、+30h 起 OK）、两期都缺而只有较新一期在窗口内时只数它（之前 OK、之后 P2、摘要只有计数与账期）、内部计量租户与早于首个账期不算缺失、晚到 100 行里 1 行晚到为 P2、0 行晚到 OK、窗口跨月时两段各按各月常量判（宽限日内入账的上月用量不算晚到）、原有积压与过期租约用例的级别与摘要前缀不变；tests/backend/test_internal_alerts.py 只在因摘要变长而必须调整的断言里改，断言意义不变'
