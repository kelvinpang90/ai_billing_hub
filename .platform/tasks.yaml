  - id: AIH-TASK-170
    title: Billing Client 第七层：健康指标与运维命令行
    purpose: >-
      按 docs/design/AIH-TASK-164-billing-client.md（设计闸门 #571 已批准 v24） §2「健康指标」与「模块与公开接口」中 metrics、__main__ 两行：新模块 metrics.py 与 __main__.py，门面加 health()。契约测试、接入指南与文档属于 AIH-TASK-171。
    status: done
    depends_on:
      - AIH-TASK-169
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-164-billing-client.md（设计闸门 #571 已批准 v24） 逐条一致，以 §2「健康指标」与 metrics、__main__ 两行、§6 日志一条、§7 标 170 的各行 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - 'metrics.py 与门面 health()：键集合固定为设计列出的十五个（store_available、pending、sending、dead_unacked、incidents_unacked、oldest_pending_age_seconds、held_in_memory、incidents_pending、dropped_events、conflicts_dropped、last_delivery_ok_at、last_status_reconcile_ok_at、status_reconcile_stale、auth_failing、level）；oldest_pending_age_seconds 按 PENDING 与 SENDING 行最早的 created_at 算，结果小于 0（注入的时钟早于 created_at）时取 0；last_status_reconcile_ok_at 取 reconcile_state；auth_failing 只看 INTEGRATION_AUTH_FAILED；level 判定照设计（P1：store_available 为假、未确认死信、未确认事故、待记事故、内存暂存非空或 auth_failing；dropped_events 与 conflicts_dropped 只展示、不参与；P2：最老待发超过 900 秒或对账超过 300 秒未成功或从未成功；否则 OK）；health() 自己读库出错并因此转入降级时，返回切换之后的 store_available（即假）；store_available 为假或读库失败时照设计 v24 统一处理：库里算出的九个键为 null，store_available 与四个进程内计数照实返回，level 为 P1，不抛'
      - '__main__.py：python -m acuven_billing_client --outbox <路径> 的 stats、dead [--limit N]、requeue <event_id> --reason、ack <event_id> --reason、replay --delivered-from --delivered-until --reason（带时区的 ISO 8601，换算成 Unix 秒再调 store）、incidents [--limit N]、ack-incident <incident_id> --reason、reset-status --tenant-id --project-id --reason，--reason 必填；时刻都是 Unix 秒的 JSON 数字；入口为 main(argv=None, *, clock=None) -> int（clock 供测试注入，缺省 time.time），python -m 调用它；成功的 JSON 写到 stdout，错误的 JSON 写到 stderr；参数解析错误（缺 --reason、未知子命令等）也输出一行 JSON 的 error 到 stderr、退出 2，不输出 argparse 默认的用法文本；输出格式、--limit 缺省 50、不输出 level 与进程内计数，照设计 §2 模块表的 __main__ 一行'
      - '命令行的输出与退出码：requeue 与 ack 输出一行 JSON（event_id 与 ok），ack-incident 输出一行 JSON（incident_id 与 ok），reset-status 输出一行 JSON（tenant_id、project_id 与 ok），这几个命令不论 ok 真假都把结果 JSON 写到 stdout（ok 为假时退出 1），只有异常引起的错误 JSON 写到 stderr，replay 输出一行 JSON（键为 replayed，值为改回的条数）；open_existing 本身抛出 Store 系列以外的 OSError 或 sqlite3.Error（例如没有权限打开锁文件），或成功之后的读写抛 sqlite3.Error、OSError 或任何 StoreError 子类（例如损坏的页、StoreReplacedError），都退出 4，输出一行 JSON 的 error（只含错误类别，不含文件内容），不改文件；成功退出 0，replay 改回 0 行也是成功；目标不存在或状态不对（含 reset-status 那一对没有状态行）退出 1；取不到单进程锁（outbox 正被运行中的进程使用）退出 3，输出一行 JSON 的 error，提示改用进程内方法；store 抛 ValueError（原因为空或超过 500 字符、重放时间段倒置）、--limit 不是正整数、时刻没有时区都按参数错退出 2 并输出一行 JSON 的 error；一律用 AIH-TASK-165 的 Store.open_existing 打开 --outbox（不存在、零字节、不是 SQLite 文件、别的应用的库、schema_version 比代码新都退出 1，输出一行 JSON 的 error（不含文件内容），不建也不改文件）；stats 里只在 reconcile_state 出现过的那一对，其 effective_status、status_version、applied_at 为 null；只经 AIH-TASK-165、166 的 store 函数读写库，不直接写 SQL；只读写本地 SQLite、不联网、不需要凭据'
      - '测试：新增 integration-client/tests/test_client_metrics.py 与 integration-client/tests/test_client_cli.py，覆盖设计 §7 的健康指标、确认后告警消失、命令行与「命令行对着被锁的 outbox」四行，以及 AIH-TASK-168、169 移交过来的断言（「事故记录」「溢出事故」两行里 health().level 的部分；「webhook 不冒充对账」一行里 status_reconcile_stale 的部分）（命令行每个子命令的成功、失败与参数错，含 reset-status；被锁时用 multiprocessing 子进程持有 BillingClient）；客户端测试只用标准库与 pytest，SQLite 用 tmp_path 下的文件，HTTP 用注入的假 Transport，时间用注入的时钟，不联网、不 sleep 真实时间、不出现 skipped（CI 的 backend-tests 分片把出现 skipped 判为失败）'
      - '只改本任务 allowed_change_paths 里的文件；不改 delivery.py、transport.py、status.py、webhook.py 与 store.py；不改 app/、alembic/、frontend/ 与服务端任何代码；不装依赖；不对任何数据库执行迁移；不连生产；不改 .platform/ 与 .github/；复选框只允许 [ ] / [x]；不改 planning-v1 块；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推。PR 正文的「设计闸门」写 #571'
    allowed_change_paths:
