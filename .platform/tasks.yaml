      - 'app/payments/base.py：PaymentGateway 协议（同步方法；create_payment、get_payment_status、verify_webhook、parse_webhook；list_settlements 不实现）与冻结数据类 CreatedPayment、GatewayPaymentStatus（字段照设计，含 session_id）、ParsedEvent(gateway_event_id, event_type, livemode, fields)（fields 只含 §6 白名单字段），GatewayState 枚举（PAID、OPEN、FAILED、EXPIRED、INCONSISTENT、UNKNOWN），异常 GatewayUnavailable、GatewayRequestRejected（带 Stripe 错误码，不带请求体与密钥）、WebhookSignatureError、WebhookPayloadError'
      - 'app/payments/stripe_gateway.py 的 StripeGateway(secret_key, webhook_secret, *, timeout_seconds, webhook_tolerance_seconds, transport=None)（同步，用 httpx2 的同步客户端）；app/payments/__init__.py 的工厂 get_payment_gateway(settings) -> PaymentGateway | None（凭据读不到返回 None，路由、建单与事件任务都经它取得网关，测试 monkeypatch 它注入假传输）：create_payment 照设计发 POST /v1/checkout/sessions（表单编码、mode=payment、一个 MYR 价格项且 unit_amount 为整数分、client_reference_id 与 metadata[payment_id] 为 public_id、expires_at、success_url、cancel_url、Idempotency-Key 为 topup-<public_id>、不传 payment_method_types）；get_payment_status 发 GET 并展开 payment_intent.latest_charge.balance_transaction，按设计的映射表（含 no_payment_required 一行；complete 而 payment_status 是表外取值时为 UNKNOWN）得出 state 并填全部字段；请求地址取配置的 stripe_api_base_url（仓库里不写 Stripe 的主机名）'
      - 'verify_webhook(raw_body, headers, *, now)：从 Stripe-Signature 取 t 与全部 v1，计算 HMAC-SHA256(webhook_secret, t + "." + 原始请求体)，任一 v1 用 hmac.compare_digest 相等即通过；|now − t| 大于 webhook_tolerance_seconds、请求头缺失或格式不对都抛 WebhookSignatureError；parse_webhook 不是 JSON、缺 id 或 type、或 livemode 缺失或不是布尔值都抛 WebhookPayloadError；错误分类：网络错误、超时、5xx、429，以及 2xx 但响应不是 JSON 或缺必需字段为 GatewayUnavailable（必需字段按方法分：create_payment 要 id、url、status；get_payment_status 要 id、status、payment_status，url 不必需，complete 的会话上 url 为 null，此时 redirect_url 为空）；3xx 为 GatewayRequestRejected（错误码 UNEXPECTED_REDIRECT，不跟随）；其余 4xx 为 GatewayRequestRejected（Stripe 的 idempotency_key_in_use 也归此类但保留错误码，供建单区分）；金额与整数分互换用 Decimal 精确换算'
