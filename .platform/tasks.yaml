    depends_on:
      - AIH-TASK-125
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-125-portal-notifications.md（设计闸门 #471 已批准 v7）逐条一致，以 §2「通知规则」「投递」「时间」「金额」，§3 INV-4、INV-7、INV-10、INV-13、INV-14，§4 outbox 行的跃迁表与串行化，§5，§6 日志一条为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计。开工前核对设计 §1「现有行为」列出的函数与常量（EVENT_LOW_BALANCE、EVENT_BILLING_STATUS_CHANGED、_outbox_event 与 _apply_billing_status 写的 payload 键、deliver 的领取 UPDATE、_settle、recover、_RENDERERS、alerts.outbox_backlog、AIH-TASK-125 交付的 Notification 模型）形状如所述；任何一项缺失或形状不同时停下说明，不自行补'
      - '新文件 app/services/notifications.py：纯函数规则，输入 event_type、aggregate_type、payload_json 与 created_at，输出通知草稿、不出通知或无效三者之一，恰好按设计 §2 规则表：aggregate_type 不是 tenant 即无效；先校验再分类——设计「任一 → 无效」那一行对所有事件先适用，billing_status_changed 必须有 billing_status（ACTIVE 或 SUSPENDED）与 balance，low_balance 必须有 balance 与 threshold，校验通过后才按 billing_mode 判定是否出通知（所以内部计量租户的 payload 不合法时同样是无效，不是不出通知）；金额整串匹配设计给的正则后用 Decimal(str) 解析（threshold 另要求不为负）；billing_status_changed 的 billing_mode 键缺失按预付、为 INTERNAL_METERED_ONLY 时不出通知、为其他值或非字符串时无效；判定只看 payload，不读租户当前状态；不写数据库、不记日志'
      - 'app/tasks/outbox.py：新增通知类事件名单与「有处理器的事件类型」函数（邮件类并通知类），recover 用它；deliver 的领取一步不改；通知类事件领取成功后在一个新事务里先 UPDATE domain_outbox SET status=SENT, processed_at=now WHERE id=? AND status=PENDING AND attempt_count=本次领取的次数，受影响行数不是 1 则回滚并返回 already-settled，再按规则：草稿时在同一事务里按 aggregate_id 查租户 id（查不到与无效同样处理），插入 notifications（public_id 新 uuid4、source_outbox_id、occurred_at 取 outbox 行 created_at、created_at 取整到秒）或不插入，最后提交；无效或事务内异常时回滚，之后未用尽次数时等下次领取，用尽时死信结算同样带 status=PENDING 与 attempt_count=本次领取的次数、不清空 payload，受影响 0 行时什么都不做并返回 superseded（只有当前领取者能结算这一行）；通知类事件不调 build_transport、不需要前端基址；任何异常不向外抛。邮件类事件的渲染、发送与结算（含清空 payload）不变'
      - 'app/services/alerts.py：outbox_backlog 改用同一个「有处理器的事件类型」函数，文档字符串改正；其他检查不变'
