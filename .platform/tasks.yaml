      - 'record_audit 构造 AuditLog 时 created_at 写 now.replace(microsecond=0)，这是唯一的行为改动；签名、其余字段、session.add 与事务归属不变；函数文档补一句：审计时间在这里统一向下截到整秒，与其余写入路径的约定一致，MySQL 的 DATETIME 不存小数秒、不截会被四舍五入；app/repositories/wallet.py 里直接构造 AuditLog 的两处用账本行的 created_at（已是整秒），不改'
