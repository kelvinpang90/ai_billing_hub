  # Billing Client 库（设计闸门 #571 v24）：本仓库 integration-client/，只用标准库；第一个接入方 acuven_aichat，接入在它自己的仓库另做。
  # Kelvin 2026-11-05 定：outbox 用本地 SQLite 文件；第一版做 spec §35 全部七项；包在本仓库子目录、pip 从 git 安装钉到提交。不改服务端。
  - id: AIH-TASK-164
    title: Billing Client 第一层：包骨架、配置、事件校验与序列化、请求签名
    purpose: >-
      按 docs/design/AIH-TASK-164-billing-client.md（设计闸门 #571 已批准 v24） §1、§2「包的位置与形态」「模块与公开接口」「事件」「签名」：新建 integration-client/ 目录下的 acuven_billing_client 包骨架与它自己的 pyproject.toml，实现 config.py、ids.py、events.py（字段校验与序列化，不写库）、signing.py（规范串、签名、请求头与 webhook 签名比较函数），根 pyproject.toml 的 pytest 配置让客户端测试进现有 CI。不做存储、投递、门面、状态与指标：分别属于 AIH-TASK-165..171。
    status: done
    depends_on: []
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-164-billing-client.md（设计闸门 #571 已批准 v24） 逐条一致，以 §1、§2「包的位置与形态」「模块与公开接口」中 config、ids、events、signing 四行、「事件」「签名」、§6、§7 标 164 的各行 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - '新增 integration-client/pyproject.toml：项目名 acuven-billing-client、版本 0.1.0、requires-python >= 3.12、dependencies 为空列表、构建后端用 setuptools 且只打包 acuven_billing_client；acuven_billing_client/__init__.py 定义 __version__ = "0.1.0"（与 pyproject 一致）并导出本任务的公开名字；integration-client/README.md 写包的用途、安装方式（pip 从本仓库 git 安装、钉到提交、subdirectory 为 integration-client，示例里的仓库地址用占位符写，不写真实地址）与「接入指南在 AIH-TASK-171 补全」一句'
      - 'config.py：不可变的 BillingClientConfig，字段照设计 §2；可调参数的字段名与默认值为 delivery_interval_seconds、batch_max_events、batch_max_bytes、lease_seconds、http_timeout_seconds、reconcile_interval_seconds、reconcile_retry_seconds、delivered_retention_seconds、held_max_events、pending_incidents_max（条数类 batch_max_events、batch_max_bytes、held_max_events、pending_incidents_max 必须是 int，秒数类可以是 int 或有限的 float，bool 都不算，全部必须为正，batch_max_bytes 另须不小于 17000（单条事件上限 16384 字节加批量包装，小于它会让合法事件永远领不出去）；直接构造 BillingClientConfig 与 from_env 走同一套校验：base_url 协议、必填字符串非空、key_version 为正 int 且不是 bool、webhook_secrets 的键为正 int、值为非空且不含空白的字符串，否则构造时 ValueError；默认值照设计：投递间隔 10 秒、每批 100 条与 1,000,000 字节、租约 60 秒、HTTP 超时 10 秒、对账 240 秒与补查 30 秒、已送达保留 7 天、内存暂存 1000 条、待记事故 10000 个）；delivered_retention_seconds 小于 1 天时构造配置对象抛 ValueError；key_version 必须是正整数；类方法 BillingClientConfig.from_env(prefix="ACUVEN_BILLING_") 读设计列出的八个变量，KEY_VERSION 与 WEBHOOK_SECRETS 里的版本都必须完全匹配 ^[1-9][0-9]{0,18}$（只认 ASCII 数字，不接受空白、正负号、下划线）；WEBHOOK_SECRETS 为「版本:密钥」用逗号分隔（每项去掉首尾空白后在第一个冒号处切开，冒号两侧不允许空白，密钥不能为空也不能含空白；空项（例如末尾多一个逗号）、版本重复都算格式错误；变量未设置或只有空白表示不接收 webhook，得到空字典）；必填变量（除 WEBHOOK_SECRETS 外的七个）一律去掉首尾空白后再保存与校验，为空算缺失；BASE_URL 必须以 http 或 https 协议开头；缺必填变量或任何一项格式不对（含 WEBHOOK_SECRETS 缺冒号、版本不是正整数、密钥为空）都抛 ValueError，消息只点名变量名（WEBHOOK_SECRETS 出错时最多再给出第几项），**不含变量的值**；repr 与 str 都不含 secret 与 webhook 密钥'
