      - 表单：transaction_type 只能选 ADJUSTMENT_CREDIT、BONUS、ADJUSTMENT_DEBIT、REFUND_ADJUSTMENT 四种；管理员输入不带符号的金额，前端按类型加符号（贷方为正、借方为负）组成请求里的 amount 字符串；金额格式按 docs/api.md（1–12 位整数、可选 1–8 位小数、不能为 0），全程字符串校验与拼接，不 parseFloat、不 Number()、不舍入；reason 必填、去首尾空白后 1–255，表单上提示「只写业务说明，不写个人数据，永久保留」
      - 提交前有确认步骤，显示客户、类型、带符号的金额与原因；确认后才发请求
      - 幂等键：每次打开表单用 crypto.randomUUID() 生成一个小写 uuid；同一次打开里的重试带同一个键。一旦发出过请求而结果未知（网络错误、超时、5xx），类型、金额与原因锁定为只读，只能「用同一个键重试」或关闭表单 —— 不许改了金额再用同一个键发（会 409），也不许换新键重发（可能已入账，造成重复调账）；关闭后再打开才生成新键。这条要写进组件注释
