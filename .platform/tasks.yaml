      - '任务用 celery.shared_task(name="ai_api.deliver_due") 注册，app/core/celery_app.py 的 TASK_MODULES 加 app.ai_api.delivery，beat_schedule 加同名条目（周期取 BILLING_AI_DELIVERY_SWEEP_SECONDS，expires 取周期的 0.9 倍，照现有条目）；app/core/config.py 加设计 §2「配置」表里 worker 与 beat 用到的各项（BILLING_AI_INGEST_BASE_URL 与四个 BILLING_AI_DELIVERY_*）并带默认值，BILLING_AI_INGEST_BASE_URL 只收明文 http 协议（设计 §2「配置」表），其他协议在配置校验时报错；投递用 app/ai_api/database.py 的 engine 工厂在每个 worker 进程里建一次自己的 engine；docker-compose.yml 经 x-backend 的 environment 转发（docker-compose.yml 里的 <<: *backend 是浅合并：服务里一写 environment 或 secrets 就整个替换继承来的那份，所以新变量加在 x-backend 的 environment 里，需要只给某个服务的键时先给 x-backend 的 environment 加锚点再合并，secrets 列表照抄全部已有条目再加新的一条）'
