    depends_on:
      - AIH-TASK-174
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-172-payments-gateway.md（设计闸门 #580 已批准 v3） 逐条一致，以 §2「支付 Webhook」落库部分、「事件处理任务」「告警」、§3 INV-11、INV-14、§5 事件相关的行、§7 标 175 的各行 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - 'app/services/payment_events.py 的 record_event(session_factory, parsed, raw_body, *, now, livemode)：四种处理类型为 RECEIVED、其余 IGNORED、livemode 不一致为 IGNORED 并在 last_error_code 记 LIVEMODE_MISMATCH（IGNORED 时写 processed_at）；payload_fingerprint 为原始请求体的 SHA-256；metadata_json 就是 parsed.fields；撞唯一约束时比对指纹：相同返回「重复」，不同则把 fingerprint_conflict_at 更新为本次的 now（每次冲突都更新，让 24 小时窗口的告警对再次冲突也生效）、记 ERROR、返回「冲突」，都不覆盖原行'
      - 'app/tasks/payment_events.py 的 process_due(*, now=None, rng=None)：开始时取 MySQL 命名锁 GET_LOCK(CONCAT(''payment_events:'', DATABASE()), 0)（照 app/ai_api/delivery.py；SQLite 下跳过），取不到直接返回；每轮最多 50 个、预算 45 秒（用 time.monotonic 计，与注入的 now 无关；now 为 None 时每个事件处理前各读一次当前 UTC 时间，传入时整轮都用它），一次领一个（短事务、FOR UPDATE SKIP LOCKED、按 next_attempt_at 升序取到期的 RECEIVED、RETRY 或租约过期的 PROCESSING，置 PROCESSING、租约 60 秒、attempts 加 1）；处理照设计：按 metadata_json 的 client_reference_id 找支付（找不到为 UNMATCHED）、写 payment_id；支付的 gateway_payment_id 为空而事件带会话 id（metadata_json.object_id）时用条件更新（gateway_payment_id IS NULL）认回，撞唯一约束为 REJECTED（GATEWAY_REFERENCE_TAKEN）；再调用 confirm_payment；成功为 PROCESSED（清空 last_error_code）；仍是「无可查询」时支付已过 expires_at 为 REJECTED（NO_GATEWAY_REFERENCE），否则 RETRY（与其他 RETRY 同一退避规则）；GatewayUnavailable、state 为 UNKNOWN 或 ConfirmConflict 为 RETRY；last_error_code 按原因写：GATEWAY_UNAVAILABLE、GATEWAY_STATE_UNKNOWN、CONFIRM_CONFLICT、NO_GATEWAY_REFERENCE（未过期时的 RETRY 也写它），UNMATCHED 写 PAYMENT_NOT_FOUND（缺 client_reference_id 时写 NO_CLIENT_REFERENCE）；RETRY 按 min(3600, 2^min(attempts, 12)) × uniform(0.5, 1.0) 退避且不放弃；GatewayRequestRejected 为 REJECTED 并记错误码；进入终止状态时写 processed_at；落事件结果用条件更新（status = PROCESSING 且 lease_until 等于领取时写的值），影响 0 行说明租约已被别人重领，丢弃本次结果只记 WARNING；开关为假或 get_payment_gateway 返回 None 时直接返回、不领取事件'
      - 'app/core/celery_app.py 照现有 Beat 条目写法登记 payment_events.process_due（条目名 payment-events-process-due，间隔取 payment_event_poll_seconds，expires 为间隔减 1 秒）并把模块加进 TASK_MODULES；tests/backend/test_celery.py 里逐项比对 Beat 条目与 TASK_MODULES 的用例只补这一项'
      - 'app/services/alerts.py 的 wallet_negative_balance 维度照设计「告警」表加五个判据（窗口列照表：review_required_at、fingerprint_conflict_at、received_at、processed_at；窗口为 now − 24 小时 < 时刻 ≤ now），配置判据从 get_settings() 与 read_stripe_credentials 读，不改 AlertContext；最老未处理事件的年龄为 max(0, ⌊now − received_at⌋) 秒，超过 900 秒（严格大于）才算 P2；摘要只在三个 24 小时计数任一大于 0、最老未处理事件超过 900 秒或配置判据触发时追加设计给出的那一段（逐字照设计），否则与原来逐字相同；不新增维度；docs/runbook.md 与 docs/api.md 里这个维度的说明补上支付判据与排查入口'
      - '测试：新增 tests/backend/test_payment_events.py（落库各情形、指纹冲突、一次领一个与租约、重试退避区间、UNMATCHED、REJECTED、成功后清空错误码、认回会话四组、重领后不重复入账、不经 Celery 直接调用扫描函数）与 tests/backend/test_payment_alerts.py（告警表每一行与窗口边界、没有支付数据时摘要逐字不变）；支付相关的测试在每个用例后清理自己写的支付与事件行，免得 MySQL 共用库里的其他告警用例看到支付段落；后端测试照 CLAUDE.md「写后端测试的约定」：断言 SQL 时不写死方言相关的字面量，跨文件共用的 fixture 在 conftest 注册，需要真 MySQL 的场景照现有写法在 BILLING_TEST_DATABASE_URL 未设置时 skip（CI 必跑），CI 上不出现 skipped；Stripe 一律用注入的假传输，不联网'
