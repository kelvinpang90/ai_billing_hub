  - id: AIH-TASK-150
    title: 健康告警：巡检把 TLS 证书到期与主机时钟同步并进磁盘维度
    purpose: >-
      deploy/monitor.sh 的 disk 维度（宿主机层面的检查）在磁盘水位与 binlog 预算之外，再查两件不会让任何请求报错、却会悄悄出事的宿主机问题：对外域名的 TLS 证书剩余天数（证书由共享基建续期，这里只负责发现；剩 21 天以内 P2、7 天以内或已过期 P1），以及主机时钟是否在做 NTP 同步（不同步 P2）。并进已有的 BILLING_HEALTHCHECK_DISK_URL，不新增检查、不新增 .env 地址；同步部署文档与 runbook。不改应用代码。
    status: done
    depends_on:
      - AIH-TASK-149
    acceptance_criteria:
      - 'deploy/monitor.sh 新增 check_tls 与 check_clock 两个函数，由 check_disk 在 check_binlog 之后调用（并进 disk 维度，复核时随 check_disk 一起重跑）；沿用本脚本的约定：问题逐行写 stdout、行首是 P1 / P2，普通日志一律走 stderr，命令替换里失败的命令写 || true（set -e 下不中止）；disk 维度的 OK 摘要按实际执行情况拼接：disk below <警戒>% (<百分比>) 之后，证书检查真的执行了写 + tls，被跳过（BILLING_FRONTEND_BASE_URL 为空或不是 https）写 + tls skipped；时钟检查真的读到了状态写 + clock，被跳过（命令不存在或输出为空）写 + clock skipped。判断「是否会执行」的条件与 check_tls / check_clock 内部的跳过条件用同一组辅助函数（例如取 https 主机名、读 NTP 状态各一个），不在两处各写一份；摘要的拼接抽成一个独立函数（例如 disk_ok_summary），由主流程里 disk 那一处 publish 调用（check_disk 跑在命令替换的子 shell 里，不能靠它设变量）'
      - 'check_tls：主机名取 .env 的 BILLING_FRONTEND_BASE_URL（env_value 字面解析，不 source），只接受协议为 https 的值，去掉协议头、路径与端口；值为空或不是 https 时 stderr 记一行 no https BILLING_FRONTEND_BASE_URL configured: skipping the certificate check，不报问题。用 timeout 15 包住 openssl s_client（-connect <主机>:443 -servername <主机>，标准输入接 /dev/null），再用 openssl x509 -noout -enddate 取 notAfter，用 date -d 换算成秒级时刻；读不到证书（连不上、超时、输出里没有 notAfter 或换算失败）报 P2 tls certificate could not be read；notAfter 不晚于当前时刻（按秒比较，不按天数比较：bash 的整数除法向零截断，过期不到一天时天数是 0）报 P1 tls certificate has expired；否则剩余整天数 = 两者相差的秒数整除 86400，小于 BILLING_MONITOR_TLS_CRIT_DAYS（默认 7）报 P1 tls certificate expires in <N> days (crit <阈值>)；小于 BILLING_MONITOR_TLS_WARN_DAYS（默认 21）报 P2 tls certificate expires in <N> days (warn <阈值>)；否则不报。问题行与日志都不带主机名'
      - 'check_clock：读 timedatectl show -p NTPSynchronized --value；值为 yes 不报；其他非空值（no 等）报 P2 host clock is not NTP-synchronized；命令不存在或输出为空时 stderr 记一行 clock sync status unavailable; skipping the clock check，不报问题（与 check_binlog「量不到不报警」同一条理由）'
      - '脚本头部注释与 disk 维度的注释写明为什么这两项并进 disk 而不是各自一个检查（Healthchecks 免费档 20 个已用满；disk 很少变红，被遮住的概率最低；代价是 disk 已红时新问题不再单独通知，要看 journalctl 里每一行）；两个阈值各配一段注释说明意义（Let''s Encrypt 正常在剩 30 天时续期，21 天意味着续期已失败约 9 天）'
      - 'tests/backend/test_deploy.py 的生产巡检一节：文本守卫——两个阈值的默认值是 21 与 7 且 crit 小于 warn；check_disk 调用 check_tls 与 check_clock；openssl s_client 前有 timeout；BILLING_FRONTEND_BASE_URL 经 env_value 读取；不出现 BILLING_HEALTHCHECK_ 开头的新键（并进 BILLING_HEALTHCHECK_DISK_URL）'
      - 'tests/backend/test_deploy.py 新增用 bash 实际执行的场景用例（写法照同文件的 run_ai_health_smoke：从 monitor.sh 截出 env_value、第 1 条所说的共用辅助函数、check_tls、check_clock 与摘要拼接函数，摘要断言直接调用截出的拼接函数，不在测试里另写一份拼接逻辑，假的 openssl / timedatectl 放在 PATH 前面，假的 .env 由用例写出，不联网）：证书剩 30 天不报；剩 20 天 P2；剩 5 天 P1；已过期 P1（含过期不到一天）；读不到 P2；BILLING_FRONTEND_BASE_URL 为空或为 http 时不报且 stderr 有 skipping 那一行；NTP 为 yes 不报、为 no 报 P2、命令不存在不报且 stderr 有 unavailable 那一行；所有问题行都不含假主机名；OK 摘要：两项都执行时以 + tls + clock 结尾，BILLING_FRONTEND_BASE_URL 为空或为 http 时含 + tls skipped 且不含不带 skipped 的 + tls，时钟命令不存在时含 + clock skipped'
      - 'docs/deployment.md §8：8.1 表格的磁盘一行把 TLS 证书与主机时钟写进判据、阈值与分级；四条取舍的第 1 条（各自一个检查）补一句：宿主机层面的 TLS 与时钟并进磁盘维度，理由是免费档 20 个已用满，代价照上面那段 AI 就绪的说法；8.3 诚实清单里注明 §95 的 TLS certificate expiry 与 host clock drift 已由本任务覆盖。docs/runbook.md 新增「TLS 证书即将到期或读不到」与「主机时钟未同步」两节（判据、先查什么、证书由共享基建的 nginx 续期这一点、恢复后 disk 检查回到 up），并把 disk 维度在告警对照处的说明补上这两项'
      - '不改 app/、alembic/、docker-compose.yml、deploy/cron.d/、deploy/ 下其他脚本、.env 类文件；不新增 Healthchecks 检查或 .env 地址键；不装依赖；不连生产；不改 .platform/；复选框只允许 [ ] / [x]；不改 planning-v1 块；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推。PR 正文的「设计闸门」写 不适用'
    allowed_change_paths:
