      - 页面：MeterTypesPage（表格含每个类型的分量与取数字段；新建表单只收 code、display_name、unit、quantity_kind、component_code；形态固定为 QUANTITY 并在表单里说明「多字段形态要改代码」）；ProvidersPage；ProviderDetailPage（模型与别名两块；别名按字符串分组显示各段区间，当前段高亮；映射与撤销；说明「改映射只影响此后发生的用量」）
      - '路由：catalogProviders（/catalog/providers）、catalogProviderDetail（/catalog/providers/:providerId，用 generatePath 生成）、catalogMeterTypes（/catalog/meter-types）；顶栏菜单加一项指向供应商页，供应商页顶部有到计量类型页的链接'
      - 代码列（provider / model / alias / meter code）按原样显示与提交，不做大小写转换；表单前端校验用与后端相同的正则（写成常量并在注释里指向设计文件 docs/design/AIH-TASK-025-ai-catalog.md 的字段规则表），后端 422 仍按错误显示
      - open_catalog：点顶栏菜单里的目录项（文案取 en.json，链接指向 paths.ts 的 catalogProviders）进入供应商页；页面不是加载失败或无权限状态（空列表合法）
      - check_meter_types：从供应商页的链接进入计量类型页；表格里能看到迁移种子的 9 个计量类型代码（LLM_TOKEN、EMBEDDING_TOKEN、AUDIO_SECOND、AUDIO_MINUTE、TTS_CHARACTER、IMAGE_GENERATION、OCR_PAGE、DOCUMENT_PAGE、CUSTOM），其中 LLM_TOKEN 一行显示 4 个分量；后端值取页面自己发出的 GET /api/v1/admin/usage-meter-types 的响应体（被动观察，不自己发请求）
