      管理端前端：在客户详情的项目区块里加 AI 密钥面板（列出、签发时 token 只显示一次、吊销），调用 AIH-TASK-059 的三个接口；用量事件页加「功能」一列与筛选框（设计闸门 #281 已批准 v23 §8 第 10 项）。只做前端，外加验收脚本的一个只读步骤。
    status: done
    depends_on:
      - AIH-TASK-059
    acceptance_criteria:
      - '语义一律以 docs/api.md 与 docs/design/AI-MODULE.md 为准；与后端代码冲突时停下，在 PR 里说明。不改任何后端文件与设计文件；不装依赖；不改 .platform/ 与 planning-v1 块'
      - '新增 frontend/src/api/aiAccess.ts 封装三个接口，写法沿用 frontend/src/api/integrationAccess.ts；frontend/src/api/adminUsageEvents.ts 的类型与列表查询加 feature'
      - '新增 frontend/src/features/customers/AiAccessPanel.tsx，挂在 ProjectsPanel 每一行的展开区里，与已有面板并列、互不影响：列出密钥（client_id、状态、时间，含已吊销），加载中与失败（带 request_id）两种状态都画出来；签发后在一次性弹窗里显示 client_id 与 token，写明只显示这一次、关掉后无法再看；吊销要二次确认；第三把的 409 显示对应文案与 request_id，未知码回落到后端 message；提交中禁用按钮，成功后只让该项目的密钥查询失效重取；面板写明 AI 密钥要等运维命令上线（AIH-TASK-068）后才签发'
      - 'frontend/src/features/usage/UsageEventsPage.tsx 加「功能」一列与按功能精确筛选的输入框，空值显示占位符；筛选值进查询参数'
      - '文案走 i18n，满足 no-hardcoded-jsx-text 与 keys.test.ts。测试（vitest + Testing Library，放在被测文件旁边）覆盖：三个 api 函数的路径与请求体；面板两种状态；签发弹窗只出现一次 token、关闭后列表不含 token；吊销确认与错误显示；用量事件页的功能列与筛选参数；示例 uuid 全零，token 用明显虚构的占位值'
      - 'check_ai_access：在夹具客户详情的项目列表里点第一行的展开按钮（已展开则不再点；只点展开，不点签发或吊销）；AI 密钥面板不是加载失败或无权限状态；后端值取页面自己发出的 GET ai-access 接口的响应体（被动观察，不自己发请求），面板显示的密钥行数与响应里的条数一致。部署后浏览器验收：acceptance.browser 固定跑 scripts/acceptance/admin_customers.mjs，本任务把这个新步骤加进脚本（文件名不变），已有步骤行为不变、照跑仍应 PASS；文件头的步骤说明同步补上新步骤；沿用验收脚本已有的约束；脚本只执行 stdin 里 steps 列出的步骤'
      - 'allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；CI 的 frontend job（含 build）必须全绿；以 Draft PR 交付，不合并、不直推。设计闸门：不适用 —— 纯前端，调用的接口已过闸门 #281，签发、吊销与上限规则全在后端，前端不改任何一条；PR 正文要把这条理由写出来'
    allowed_change_paths:
      - scripts/acceptance/admin_customers.mjs
      - frontend/src/api/aiAccess.ts
      - frontend/src/api/aiAccess.test.ts
      - frontend/src/api/adminUsageEvents.ts
      - frontend/src/api/adminUsageEvents.test.ts
      - frontend/src/features/customers/AiAccessPanel.tsx
      - frontend/src/features/customers/AiAccessPanel.test.tsx
      - frontend/src/features/customers/ProjectsPanel.tsx
      - frontend/src/features/customers/ProjectsPanel.test.tsx
      - frontend/src/features/usage/UsageEventsPage.tsx
      - frontend/src/features/usage/UsageEventsPage.test.tsx
      - frontend/src/i18n/locales/en.json
    # MXC 里能跑的五项加前端三项；前端 build 与 tests.backend 只在 CI。
    allowed_commands:
      - docs.check
      - policy.check
      - tests.process
      - lint.fix
      - format.apply
      - lint.check
      - format.check
      - frontend.test
      - frontend.typecheck
      - frontend.lint
    execution: sequential
    stop_on_first_failure: true
    max_attempts: 1

    # 合并且部署成功后，Worker 用本机固定的浏览器与凭据跑一次 acceptance.browser（最多 3 次尝试）。
    # acceptance.browser 不在上面的 allowed_commands 里：它只能被这个 acceptance 块引用。
    acceptance:
      kind: browser
      command: acceptance.browser
      timeout_seconds: 300
      writes: false
      steps:
        - login
        - open_customers
        - open_fixture
        - check_ai_access

    worker_handoff_state: awaiting_review
    worker_failure_state: failed
    terminal_states:
      - completed
      - failed
      - cancelled

    creates_branch: true
    creates_pull_request: true
    prohibited:
      - production_deploy
      - database_migration
      - dependency_install
      - credential_access
      - direct_push_to_protected_branch
      - merge
      - bypass_ci
      - bypass_review

