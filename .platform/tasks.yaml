      - 部署后浏览器验收：acceptance.browser 固定跑 scripts/acceptance/admin_customers.mjs，本任务把下面列出的新步骤加进这个脚本（文件名不变），已有步骤（login、open_customers、open_fixture、check_balance、open_audit、check_audit_entry 以及之前任务加的步骤）行为不变、照跑仍应 PASS；文件头的步骤说明与「只点」清单同步补上新步骤与新点的元素；沿用验收脚本已有的约束（见 AIH-TASK-024、AIH-TASK-023 的验收标准与脚本文件头）；脚本只执行 stdin 里 steps 列出的步骤。验收只读：只点导航链接与页内的只读入口，不点任何会写数据的按钮，不提交任何表单
      - 不改 planning-v1 块
    allowed_change_paths:
      - scripts/acceptance/admin_customers.mjs
      - frontend/src/api/adminCatalog.ts
      - frontend/src/api/adminCatalog.test.ts
      - frontend/src/features/catalog/MeterTypesPage.tsx
      - frontend/src/features/catalog/MeterTypesPage.test.tsx
      - frontend/src/features/catalog/ProvidersPage.tsx
      - frontend/src/features/catalog/ProvidersPage.test.tsx
      - frontend/src/features/catalog/ProviderDetailPage.tsx
      - frontend/src/features/catalog/ProviderDetailPage.test.tsx
      - frontend/src/components/DecimalText.tsx
      - frontend/src/components/DecimalText.test.tsx
      - frontend/src/routes/index.tsx
      - frontend/src/routes/paths.ts
      - frontend/src/layouts/AppLayout.tsx
      - frontend/src/i18n/locales/en.json
      - docs/TODO.md
    # MXC 里能跑的五项加前端三项；前端 build 与 tests.backend 只在 CI。
    allowed_commands:
      - docs.check
      - policy.check
      - tests.process
      - lint.check
      - format.check
      - frontend.test
      - frontend.typecheck
      - frontend.lint
    execution: sequential
    stop_on_first_failure: true
    max_attempts: 1

    # 合并且部署成功后，Worker 用本机固定的浏览器与凭据跑一次 acceptance.browser（最多 3 次尝试）。
    # acceptance.browser 不在上面的 allowed_commands 里：它只能被这个 acceptance 块引用。
    acceptance:
      kind: browser
      command: acceptance.browser
      timeout_seconds: 300
      writes: false
      steps:
        - login
