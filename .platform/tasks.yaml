      - '显示金额 _display_money(Decimal) -> str 放在 app/tasks/outbox.py：先 quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)，再格式化成带千分位的两位小数；量化结果为 0 时一律是 0.00（不出现 -0.00）；不经 float，不能只靠 format(value, ",.2f")（Decimal 格式化按上下文舍入，默认 ROUND_HALF_EVEN）。显示时刻：把 _invitation_deadline 改名为 _malaysia_time（行为不变，邀请信调用处同步），通知邮件的 occurred_at 也经它格式化'
