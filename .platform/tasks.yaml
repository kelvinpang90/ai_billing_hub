  - id: AIH-TASK-168
    title: Billing Client 第五层：记账门面、存储故障暂存与回灌、后台线程与死信运维
    purpose: >-
      按 docs/design/AIH-TASK-164-billing-client.md（设计闸门 #571 已批准 v24） §2「存储」的暂存回灌、「投递」的后台线程与死信、「健康指标」末尾的三个进程内计数、§5：新模块 client.py 的 BillingClient 门面的记账与投递部分（record_llm_usage、record_quantity_usage、start、stop、deliver_once、requeue_dead、ack_dead、list_dead、replay_delivered、list_incidents、ack_incident、held_in_memory、incidents_pending、dropped_events、conflicts_dropped）。不做有效状态与 webhook（属于 AIH-TASK-169）。
    status: done
    depends_on:
      - AIH-TASK-167
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-164-billing-client.md（设计闸门 #571 已批准 v24） 逐条一致，以 §2「模块与公开接口」中 client 一行、「存储」的写入事件、暂存回灌与待记事故、「投递」的后台线程与死信、「健康指标」末尾一句、「事务边界」、§3 INV-1、INV-14、§5、§7 标 168 的各行 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - 'BillingClient(config, *, transport=None, clock=None, rng=None)：构造时照设计 v15「构造时存储不可用 → 降级运行」处理（打开 Store 抛 sqlite3.Error、OSError 或版本错误时不抛，store_available 为假，record_* 进暂存，处置函数抛 StoreUnavailableError（就是 store.py 定义的那一个，client.py 只重新导出，不另定义；record_* 遇到它照存储故障进暂存），投递线程每个间隔先尝试重新打开，deliver_once() 在降级时也先尝试重新打开，成功后照常回灌与投递；运行中任何读写库抛出 IntegrityError 以外、且 sqlite_errorname 不是 SQLITE_BUSY 或 SQLITE_LOCKED 的 sqlite3.Error 或 OSError 时，调用 Store.invalidate() 作废全部连接、转入同一套降级状态（照设计 v17「运行中转入降级」与 v23 对关闭连接行为的说明；StoreReplacedError 同样转入降级并立即尝试重新打开路径上的文件；StoreLockedError 与 StoreResidueError 按构造时打开失败处理（降级、每个间隔再试）；BUSY 与 LOCKED 不转降级，只让本次记账进暂存）；只有配置不合法才抛）；store_available 为只读属性；record_llm_usage 与 record_quantity_usage 调 AIH-TASK-164 的构建函数再调 store.insert_event；校验错误（ValueError、TypeError）与 EventConflictError 照常抛；写库前先查进程内暂存：暂存里已有同 event_id 时字节相同直接返回该 id、不同抛 EventConflictError，不重复放入；IntegrityError 以外的 sqlite3.Error 不抛、放进上限为配置值的进程内暂存并记 ERROR（不带载荷），暂存满则丢弃、dropped_events 加 1、记 ERROR 带 event_id，并把 (event_id, DROPPED, 时刻) 放进待记事故列表（上限取配置；满了不再记 id，只累加溢出计数并记下溢出的首次与最近时刻、记 ERROR）；返回 event_id'
      - '暂存回灌照设计「存储」：每轮开头逐条写回，成功或同内容冲突移出暂存；不同内容冲突移出并 conflicts_dropped 加 1、记 ERROR 只带 event_id、放进待记事故（CONFLICT_DROPPED）；仍是存储故障则留在暂存并停止本轮回灌；回灌之后在存储可用时把待记事故列表与溢出计数用 store.record_incidents 在一个事务里写入：照设计 v14 的写法：用一把专用锁保证同一时刻只有一处在写；在锁内把列表与溢出计数（条数与首次、最近时刻）整体移入待写快照并把进程内的列表与计数清零，锁外写库，写成功就丢掉快照，写失败按设计并回（先快照、再写库期间新增的，超出上限的 id 转为溢出，两段溢出条数相加、首次取较早、最近取较晚）；暂存回灌本身也由同一把专用锁串行，deliver_once 与后台线程不会同时回灌，同一个内容冲突只计一次；held_in_memory、incidents_pending（待记事故列表条数加溢出计数）、dropped_events、conflicts_dropped 为只读属性，线程安全'
      - 'start() 启动一个守护线程，第一轮立即执行，投递线程循环「回灌 → 调用一次 run_delivery_round → 用停止事件的 wait 等投递间隔」（每个间隔只投递一轮，照设计）（对账线程由 AIH-TASK-169 加入同一个 start / stop，本任务只实现投递线程）；一轮里的异常捕获记 ERROR 后继续，线程不退出；重复 start 不起第二个线程；stop 成功之后可以再 start（清掉停止事件、起新线程）；上一次 stop 超时、旧线程还活着时 start 抛 RuntimeError；stop(timeout) 设停止事件并等线程结束，超时线程仍在则返回假并记 WARNING，否则返回真；close(timeout) 先 stop 再 Store.close() 释放单进程锁（测试里模拟重启时先 close 旧客户端）；deliver_once() 同步执行一次回灌加一轮投递，返回 DeliverySummary（降级且重新打开失败时不抛，返回 DeliverySummary.zero()；本轮途中存储出错时（run_delivery_round 抛出存储错误）按规则转入降级并返回 DeliverySummary.zero()，不抛，已落状态的行以库为准、不另统计；错误名一律按前缀匹配（SQLITE_BUSY、SQLITE_LOCKED 开头的都算暂时性，SQLITE_CORRUPT 开头的与 SQLITE_NOTADB 都算坏文件类，例如 SQLITE_BUSY_SNAPSHOT、SQLITE_CORRUPT_INDEX）；回灌遇到 SQLITE_BUSY 或 SQLITE_LOCKED 时停止本轮回灌但照常投递；投递本身遇到 SQLITE_BUSY 或 SQLITE_LOCKED 不转降级，deliver_once 返回 DeliverySummary.zero()、不抛，后台线程下一轮再试；处置函数遇到它们原样抛出 sqlite3.OperationalError、不转降级；record_* 遇到 StoreIntegrityFault 只把这一条放进暂存、记 ERROR，不作废连接、不转降级；其他异常照常抛给调用方）；回灌时某一条单独引起 StoreIntegrityFault，就把这一条移出暂存、dropped_events 加 1、记 ERROR（只带 event_id）、放进待记事故（DROPPED），继续回灌下一条；replay_delivered 只收带时区的 datetime（不带时区抛 ValueError），换算成 Unix 秒再调 store；构造时打开失败若是 StoreForeignError 且 sqlite_errorname 为 SQLITE_NOTADB 或 SQLITE_CORRUPT，同样记下坏文件身份；转入降级后由门面调用 Store.reopen() 重新打开（照设计 v24：因 SQLITE_CORRUPT 或 SQLITE_NOTADB 降级时记下坏文件身份，路径上的文件身份未变就不重开）；StoreIntegrityFault 按存储故障处理；降级时 list_dead、list_incidents 与处置函数抛 StoreUnavailableError，处置途中遇到会转入降级的错误也是先转入降级再抛 StoreUnavailableError；list_incidents 缺省 limit 为 50；close() 之后 record_*、start、deliver_once 与各处置函数抛 RuntimeError（关闭后再用是接入方的编程错误），门面也不再调用 Store.reopen（stop 超时后残留的线程转入降级时同样不重开）；incidents_pending 包括正在写库的那份待写快照，写成功后才减去；只有当前连接代号的连接上抛出的错误才触发转入降级，旧代号连接迟到的错误只记 WARNING、不作废新打开的库、不标记坏文件；异常处理见本条前文；暂存由一把锁保护，回灌时在锁内取快照、在锁外写 SQLite、再在锁内移除已处理的条目，记账不会因回灌写库而被锁住；requeue_dead、ack_dead、replay_delivered、list_incidents、ack_incident 转调 store（原因必填，照 AIH-TASK-166），list_dead(limit=50)'
      - '测试：新增 integration-client/tests/test_client_record.py 与 integration-client/tests/test_client_runner.py，覆盖设计 §7 标 168 的各行（平台不可用时记账照常、存储故障与暂存满、回灌时冲突两种、事故记录（含模拟重启后仍在）、溢出事故、后台线程不死与 stop 在超时内返回、重启后继续送），**例外，以本契约为准**：设计 §7「运行中转入降级」一行的「去掉替身后下一轮重新打开、回灌入库」部分改用 SQLITE_IOERR 替身来测（它不属于坏文件类，按设计 v24 允许重开同一个文件），SQLITE_CORRUPT 触发的降级只断言进入降级、连接关闭、事件进暂存，它的恢复由「部分损坏的文件不来回切换」一行覆盖（设计 v24 的坏文件规则不重开同一个文件，与该行原写法冲突，规则以设计正文为准）；另覆盖设计 §7「构造时存储不可用」「运行中转入降级」「部分损坏的文件不来回切换」「空闲线程不写旧文件」「单进程锁」「只移走主库」「三个文件一起移走」「运行中隔离损坏文件」「降级后只靠 deliver_once() 恢复」九行中本任务的部分、自带 event_id 须给 occurred_at 经门面时不写库、同参数两次返回同一 id、写事故期间新加的待记事故不丢、设计 §7「回写失败并回」一行、deliver_once 与后台线程同时回灌时一个冲突只计一次；**例外，以本契约为准**：设计 §7「事故记录」「溢出事故」两行里对 health().level 与 incidents_unacked 的断言，本任务改用 AIH-TASK-166 的 store 只读计数（未确认事故数）与本任务的 incidents_pending 属性断言，level 的部分由 AIH-TASK-170 的测试覆盖（health() 在 169 才实现，设计 §7 的任务列只是测试归属，不改变行为）；存储故障用注入的、写入时抛 sqlite3.OperationalError 的 Store 替身或 monkeypatch，不靠真的写满磁盘；后台线程的用例可以把投递间隔配成 0.01 秒并用 threading.Event 同步，单个用例耗时不超过 2 秒；在打开状态下移动或替换文件的用例依赖 POSIX 语义（生产与 CI 都是 Linux），可以在 sys.platform 为 win32 时条件跳过，CI 上不会出现 skipped；客户端测试只用标准库与 pytest，SQLite 用 tmp_path 下的文件，HTTP 用注入的假 Transport，时间用注入的时钟，不联网、不 sleep 真实时间、不出现 skipped（CI 的 backend-tests 分片把出现 skipped 判为失败）'
      - '只改本任务 allowed_change_paths 里的文件；不改 delivery.py、transport.py、store.py 与 AIH-TASK-164 交付的模块；不改 app/、alembic/、frontend/ 与服务端任何代码；不装依赖；不对任何数据库执行迁移；不连生产；不改 .platform/ 与 .github/；复选框只允许 [ ] / [x]；不改 planning-v1 块；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推。PR 正文的「设计闸门」写 #571'
