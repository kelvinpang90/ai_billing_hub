    allowed_change_paths:
      - docs/ARCHITECTURE.md
    # 只改一份文档，文档检查足够；tests.backend 跑不起来，只在 CI。
    allowed_commands:
      - docs.check
    execution: sequential
    stop_on_first_failure: true
    max_attempts: 1

    worker_handoff_state: awaiting_review
    worker_failure_state: failed
    terminal_states:
      - completed
      - failed
      - cancelled

    creates_branch: true
    creates_pull_request: true
    prohibited:
      - production_deploy
      - database_migration
      - dependency_install
      - credential_access
      - direct_push_to_protected_branch
      - merge
      - bypass_ci
      - bypass_review
