  # R5 的最后一刀：补齐 AIH-TASK-007 留下的 15 个缺口（覆盖表在 docs/REQUIREMENTS.md 第 1.3 节）。
  #
  # ⚠️ 本任务是**唯一一个会改 spec 正文**的已登记任务。spec 是需求的事实来源，所以契约把它
  #    锁成「只许新增、不许改写」：见验收条件第 2 / 3 / 4 条，其中第 3 条是机械可查的 ——
  #    spec 文件的 git diff 里删除行恰好一行，且必须就是文件头的 Version 行。
  #
  # 分档口径由 Kelvin 于 2026-09-21 拍板（三个选项里选「分档补」）：15 个缺口性质不同，
  # 不能一刀切发编号。
  #   · Invariant 7（成本 / 毛利对客户不可见）、Invariant 13（钱包变更 + 状态跃迁 + 审计 +
  #     domain outbox 同事务提交）是真正的系统不变量 —— 新增 REQ；
  #   · Gate 1（SST 口径）、Gate 4（支付 / Email / WhatsApp 真实账号打通）是上线闸门，
  #     可独立验收 —— 新增 REQ；
  #   · DoD 1–8 与 DoD 13–15 共 11 条（要有迁移 / 校验 / 授权 / 审计 / 测试 / 错误处理 /
  #     API 文档 / 前端态 / 迁移分析 / 监控归属 / 性能验证）是**逐功能的交付流程要求**，
  #     由 spec §132 的 DoD 与 PR 模板自检强制。给它们发 REQ 编号会和 REQUIREMENTS.md
  #     第一节自己的规矩（每个 REQ 必须有「必需测试证据」）打架 ——「要有测试」的测试证据
  #     只能写成「有测试」，是循环。所以改标「不适用」并逐条写明理由。
  # 4 + 11 = 15，补完覆盖表里一个「缺口」都不剩，R5 才可以勾掉。
  #
  # ⚠️ 本条登记是管理员前置条件：须先合并，之后才能调度本任务的 Worker run。
  #    Worker 本任务不改 .platform/ 下任何文件。
  - id: AIH-TASK-008
    title: spec REQ ids for the remaining hard requirements (R5 closure)
    purpose: >-
      按 2026-09-21 拍板的分档口径补齐 docs/REQUIREMENTS.md 第 1.3 节的 15 个缺口：给 Invariant 7、
      Invariant 13、Gate 1、Gate 4 四条在 spec 里新增 REQ-* 编号（只新增段落，不改写任何既有句子），
      其余 11 条逐功能交付流程要求改标「不适用」并逐条给理由；同步追溯表、覆盖列的合法取值与校验脚本。
      纯可追溯性标注，spec 的规范性语义一个字不改，不碰业务代码、数据库、迁移、CI 配置与 .platform/。
    status: done
    depends_on: []
    acceptance_criteria:
      - 分档口径照抄本条登记的注释（Kelvin 2026-09-21 拍板）：Invariant 7、Invariant 13、Gate 1、Gate 4 四条新增 REQ-* 编号；DoD 1–8 与 DoD 13–15 共 11 条把覆盖列改为固定串「不适用」并逐条写明理由；4 + 11 = 15，处理完覆盖表里不得再有「缺口」行
      # 整条必须加引号：句中的 `REQ-<AREA>-<NNN>`: 含半角冒号加空格，不加引号会被 YAML 解析成字典，
      # 控制面的 load_task 随即以 invalid task contract 拒绝整个任务（本机用真加载器实测过）
      - "spec 的改动只允许新增：新 REQ 按 §20 里 `REQ-INGEST-001` / `REQ-INGEST-002` 的既有写法，写成 `` `REQ-<AREA>-<NNN>`: <规则> `` 的独立一段，逐条插在**已经陈述该规则的那一节**里；不得新建附录或汇总节，不得挪动、合并或改写任何已有句子"
      - 全文唯一允许被删除或修改的行是文件头的 `**Version:** 1.6`（改为 1.7）；Revision History 另加一行，写明 Traceability only, no normative change 并列出新增的四个 REQ 编号。PR 正文必须给出这一条的机械证据：spec 文件的 diff 里删除行恰好一行，且就是那行 Version
      - 四个新 REQ 的规则文字必须是对既有规则的复述，不得引入新要求、不得收紧或放宽既有语义；ID 按既有命名 `REQ-<AREA>-<NNN>`，不与已有 13 个重号
      - 落点建议（可偏离，但偏离必须在 PR 正文里说明理由）：Invariant 7 → §69（已有「Do NOT show」清单）；Invariant 13 → §74.6 或 §79（domain outbox 与账本原子提交所在）；Gate 1 → §45.1（税务闸门）；Gate 4 → §47（Notification Adapter）或 §134（试点上线验证）
      - docs/REQUIREMENTS.md 第 1.2 节追溯表为四个新 REQ 各加一行，「主要章节」与「必需测试证据」按现有 13 行的粒度填实，不得留空、不得写「待定」或「见正文」
      - docs/REQUIREMENTS.md 第 1.1 节把覆盖列的合法取值由两种改为三种（一个或多个真实存在的 REQ-* ID ／ 固定串「缺口」／ 固定串「不适用」），并写明「不适用」的判定口径：该条是逐功能的交付流程要求，由 §132 的 DoD 与 PR 模板自检强制，不构成可独立验收的系统规则
