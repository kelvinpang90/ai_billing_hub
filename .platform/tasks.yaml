  - id: AIH-TASK-141
    title: 计费扫描并行：Beat 每 10 秒派两个计费扫描，扫描先抢名额，worker 默认并发改为 3
    purpose: >-
      按 docs/design/AIH-TASK-141-billing-sweep-parallelism.md（设计闸门 #522 已批准 v4）§2：app/core/celery_app.py 新增常量 USAGE_BILLING_SWEEP_PARALLELISM = 2，把 beat_schedule 里的 usage-billing-sweep 换成按它生成的 usage-billing-sweep-1 … usage-billing-sweep-N；app/services/usage_billing.py 的 bill_pending_events 加 parallelism 参数与「扫描名额」（带库名的 MySQL 命名锁，抢不到就立即返回 0），任务传常量；docker-compose.yml 里 celery-worker 的默认并发从 2 改为 3；补调度、名额与并发的测试，同步运维文档。不改认领、处理、卡住回收的任何 SQL、锁顺序或事务边界，不改周期、预算与每批条数，不改容器配额。压测脚本按新的派发节奏模拟属于 AIH-TASK-142。
    status: done
    depends_on:
      - AIH-TASK-140
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-141-billing-sweep-parallelism.md（设计闸门 #522 已批准 v4）逐条一致，以 §1「明确不做什么」、§2「改动点」、§4、§5、§7、§8 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - 'app/core/celery_app.py：新增模块级常量 USAGE_BILLING_SWEEP_PARALLELISM = 2，与 USAGE_BILLING_SWEEP_SECONDS 等常量放在一起，注释写明它为什么是常量而不是配置项、以及 celery-worker 并发必须至少比它多 1；beat_schedule 不再有 usage-billing-sweep，改为 usage-billing-sweep-1 到 usage-billing-sweep-<N> 共 N 个条目，每个的 task 为 app.tasks.usage_billing.bill_pending_events、schedule 为 USAGE_BILLING_SWEEP_SECONDS、options 为 expires USAGE_BILLING_SWEEP_EXPIRES_SECONDS；usage-stale-recovery 与其他条目不变'
      - 'app/services/usage_billing.py：bill_pending_events 新增关键字参数 parallelism: int | None = None（None 不抢名额、行为与现在相同；< 1 抛 ValueError），扫描名额照设计 §2「改动点」第 0 条：私有上下文管理器，专用 AUTOCOMMIT 连接，名字为「库名:usage-billing-sweep:i」（SQL 里用 CONCAT 与 DATABASE() 拼），i = 1 … parallelism 依次 GET_LOCK(name, 0)，全部抢不到时不认领、返回 SweepResult(claimed=0) 并记 debug 日志，任何一次 GET_LOCK 返回 NULL 或语句失败就不再试后面的名额、同样返回 0 并记 warning；抢、确认、释放三条语句各包成模块级私有函数 _get_lock / _holds_lock / _release_lock，都接收名额序号 slot，名字只在 SQL 里用模块常量 _SWEEP_SLOT_NAME（CONCAT 与 DATABASE() 拼，slot 为绑定参数）拼，原样返回 1 / 0 / None、失败时抛异常，测试经 monkeypatch 替换它们；每次 claim_events 与每次 process_event 之前经 _holds_lock 在名额连接上执行 SELECT IS_USED_LOCK(name) = CONNECTION_ID()，返回不是 1 或语句失败就停下（不再认领、不再处理本批剩余事件，记 warning，正常返回），本批剩余事件留给卡住回收；finally 里 RELEASE_LOCK、释放失败就 invalidate 连接，SQLite 上不做限制；claim_events、process_event、recover_stale_processing 不改。app/tasks/usage_billing.py：bill_pending_events 任务传 parallelism=USAGE_BILLING_SWEEP_PARALLELISM（从 app.core.celery_app 导入）'
      - 'docker-compose.yml：celery-worker 的 --concurrency 默认值由 2 改为 3（仍写成 ${BILLING_CELERY_CONCURRENCY:-3}），旁边的注释补一句「至少比计费扫描的并行数多 1，见 app/core/celery_app.py 的 USAGE_BILLING_SWEEP_PARALLELISM」；不改 cpus、mem_limit 与其他服务'
