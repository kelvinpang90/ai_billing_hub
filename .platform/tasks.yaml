  - id: AIH-TASK-017
    title: admin frontend - manual wallet adjustment
    purpose: >-
      管理端前端第三刀：在客户详情页加「手工调账」入口，调用 docs/api.md「管理端手工调账」的接口（已过设计闸门 #111、
      由 AIH-TASK-011 上线）。重点是幂等键的生命周期与「结果未知时不许改单」。只做前端。
    status: done
    # 016 也改 CustomerDetailPage.tsx 及其测试；依赖 016 让两者按计划顺序串行，不在同一页面上冲突。
    depends_on:
      - AIH-TASK-016
    acceptance_criteria:
      - 语义一律以 docs/api.md「管理端手工调账」与 docs/design/AIH-TASK-010-admin-wallet-adjustment.md 为准；与后端代码冲突时停下，在 PR 里说明。不改任何后端文件与设计文件
      - 新增 frontend/src/api/walletAdjustments.ts：postAdjustment(customerId, body)，返回调账对象（金额字段是 string），错误是 ApiError
      - 新增 feature 目录 frontend/src/features/wallet/（spec §101 的目录名）与 AdjustmentModal.tsx，由 CustomerDetailPage 打开
      - 表单：transaction_type 只能选 ADJUSTMENT_CREDIT、BONUS、ADJUSTMENT_DEBIT、REFUND_ADJUSTMENT 四种；管理员输入不带符号的金额，前端按类型加符号（贷方为正、借方为负）组成请求里的 amount 字符串；金额格式按 docs/api.md（1–12 位整数、可选 1–8 位小数、不能为 0），全程字符串校验与拼接，不 parseFloat、不 Number()、不舍入；reason 必填、去首尾空白后 1–255，表单上提示「只写业务说明，不写个人数据，永久保留」
      - 提交前有确认步骤，显示客户、类型、带符号的金额与原因；确认后才发请求
      - 幂等键：每次打开表单用 crypto.randomUUID() 生成一个小写 uuid；同一次打开里的重试带同一个键。一旦发出过请求而结果未知（网络错误、超时、5xx），类型、金额与原因锁定为只读，只能「用同一个键重试」或关闭表单 —— 不许改了金额再用同一个键发（会 409），也不许换新键重发（可能已入账，造成重复调账）；关闭后再打开才生成新键。这条要写进组件注释
      - 结果：201 显示记账成功与 balance_after、billing_status；200 且 replayed 为 true 时明确显示「此前已记过，本次未重复入账」；409 ADJUSTMENT_CONFLICT、422（含 BALANCE_OUT_OF_RANGE）、404 CUSTOMER_NOT_FOUND 显示后端 message 与 request_id；成功（含重放）后刷新客户详情（余额、计费状态）
      - 金额展示用 015 的 MoneyText；文案走 i18n，满足 no-hardcoded-jsx-text 与 keys.test.ts
      - 测试：请求体的 amount 按类型带符号且是字符串；非法金额（0、13 位整数、9 位小数、带指数、带 +）被拦下且不发请求；同一次打开的重试复用同一个键、重新打开换新键；结果未知后字段只读；replayed 的展示；409 的展示；成功后刷新详情。uuid 与幂等键在测试里一律用 00000000-0000-4000-8000-000000000000 这类全零占位值（secret-scan 会把随机 uuid 当密钥）
      - docs/TODO.md 新增 AIH-TASK-017 记录段；不改 planning-v1 块；复选框只允许 [ ] / [x]
