  - id: AIH-TASK-157
    title: 月度对账单第四层：每小时补生成到期对账单的任务与 beat
    purpose: >-
      按 docs/design/AIH-TASK-154-monthly-statements.md（设计闸门 #565 已批准 v6） §2「Celery 任务」与 §5：在 app/services/statements.py 加 catch_up_tenant 与 generate_due（每项一个事务，并发重复与编号碰撞照设计处理），新任务模块 app/tasks/statements.py 与 beat 条目 statements-generate-due（每小时整点 crontab(minute=0)，expires 3240 秒）。首个账期 2026-12 在 2027-01-02 01:00（马来西亚时间）才到期，之前每次都是空跑。告警属于 AIH-TASK-158，接口属于 159。
    status: done
    depends_on:
      - AIH-TASK-156
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-154-monthly-statements.md（设计闸门 #565 已批准 v6） 逐条一致，以 §2「Celery 任务」「生成函数」末段的并发处理、§3 INV-14、§4、§5、§7 catch-up 与 beat 登记两行 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - 'catch_up_tenant(factory, tenant_id, now, *, generated_by=None, before_commit=None, raise_errors=False) -> list[MonthlyStatement]：开头在独立的只读事务里读一次租户 public_id（租户不存在时直接返回空列表），之后的日志都用它，出错后不再查库；照设计 §2「Celery 任务」的五条逐条实现：对 due_periods(now) 升序，每个账期一个事务调用 generate_statement；已有行与不合格的账期跳过；只有 generate_statement 本身抛的 IntegrityError 走「回滚、新事务里查 (tenant_id, period_start)：已存在当作成功（不进返回值）继续下一期，不存在（编号碰撞）记一条 warning 并停止这个租户的后续账期、不算错误」；新生成的那份依次调用 before_commit(session, statement)、session.flush()、提交，这三步抛的任何异常（包括 IntegrityError）都按失败处理；失败（上一句，或 generate_statement 抛的其他任何异常）时回滚，记一条固定文本的 error 日志（extra 只带租户 public_id、账期 label 与异常类型名，不带金额与公司名）后停止这个租户的后续账期；raise_errors 为 False 时返回已生成的部分，为 True 时记完日志后原样抛出（管理端用 True，generate_due 用 False）；返回本次新生成的对账单（按账期升序）'
      - 'generate_due(factory, now) -> int：对生成时 billing_mode 为 PREPAID 的租户按 id 升序调用 catch_up_tenant，单个租户失败不影响其他租户：每次 catch_up_tenant 调用外层再包一层 except Exception（catch_up_tenant 每期之外的步骤抛错时也会到这里），记一条固定文本的 error 日志（extra 只带租户 public_id 与异常类型名，照设计 §6；public_id 由 generate_due 列租户时一并取出，不在出错后再查）后继续下一个租户（这种情况下该租户本次已提交的份数拿不到，不计入返回值与 info 日志，只少计、不影响已提交的对账单）；返回新生成的总份数；app/tasks/statements.py 新增 Celery 任务 app.tasks.statements.generate_due（写法照 app/tasks/wallet_reconciliation.py：取 session 工厂与当前 UTC 时刻，调用服务函数，记一条 info 日志带份数）；app/core/celery_app.py 的 include 列表登记这个模块，beat_schedule 新增 statements-generate-due 条目，schedule 为 crontab(minute=0)（每小时整点，写法照 FX_FETCH_SCHEDULE）、options 的 expires 3240（常量写在模块级）'
      - '测试：新增 tests/backend/test_statements_task.py，覆盖设计 §7 catch-up 一行（任务停了两个月后运行补齐两期；某租户中间一期自检失败时其余租户补齐、失败租户只到失败之前、返回份数正确、日志不含金额）、永久停出一行（某租户 M 期自检失败后再跑两轮整点、now 跨过 M+1 的到期时刻：每轮 M 都失败且日志带检查编号，M+1 不生成，其他租户的 M 与 M+1 照常生成）、并发重复（MySQL 下另一个线程先插入并提交同一项，catch_up 的 INSERT 得到 IntegrityError 后当作成功继续下一期）、before_commit 钩子抛 IntegrityError 时按失败处理（raise_errors=True 时抛出、False 时不抛，都记 error、这一份不在）、编号碰撞（让随机部分固定撞上已有编号：warning、停止该租户、不抛到 generate_due 之外）、before_commit 钩子被调用恰一次且与对账单同事务（钩子抛错时对账单也没写）、未到期时空跑返回 0；tests/backend/test_celery.py 补 beat 条目（crontab(minute=0)、expires 3240）与 include 的断言，其余不动；测试写入的对账单行用 SET FOREIGN_KEY_CHECKS = 0 加 TRUNCATE 清掉'
      - 'docs/runbook.md 新增「月度对账单」一节：生成时刻（新月第 2 日 01:00 之后的整点）、首个账期 2026-12、每小时补生成、任务停了怎么办（等下一小时或用管理端补生成，AIH-TASK-159 之后）、生成失败的日志怎么读（只有租户 public_id、账期与异常类型名，StatementIntegrityError 另带检查编号）；StatementIntegrityError 是数据缺陷，按设计 §5 是已知限制（Kelvin 2026-11-04 拍板）：这个租户从该期起永久停出、重试不会好；缺失告警只在该期到期后 6–30 小时内报 P2（AIH-TASK-158），之后只能从 error 日志与管理端列表看到，处置是按检查编号查出缺陷行（1 期初加发生额不等于期末，2 收费事件金额与账本不符，3 收费事件条数与本期用量账本行数不符，missing_event 用量账本行连不上事件），不改不删账本、事件与对账单，再开设计闸门定修复；StatementTaxPolicyUnavailable 表示该期 cutoff 时刻没有生效的税务政策（或读出校验失败）：先确认 MY/SST 的税务政策版本，缺版本就按税务政策发布流程补一条覆盖该时刻的版本，下一个整点自动补上，读出校验失败按数据缺陷处置；不要手工改或删对账单行（触发器会拒绝）'
      - '只改下列路径；不改模型、迁移、钱包、账本、计费与告警；不装依赖；不对任何数据库执行迁移；不连生产；不改 .platform/；复选框只允许 [ ] / [x]；不改 planning-v1 块；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推。PR 正文的「设计闸门」写 #565'
    allowed_change_paths:
      - app/services/statements.py
