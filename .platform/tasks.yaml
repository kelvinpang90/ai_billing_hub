  # P-2 的 R5「需求编号覆盖度」（docs/TODO.md）。文档卫生任务：不碰钱、不碰用量摄取 /
  # 认证与会话 / Webhook，按 CLAUDE.md「前端 / 文档 / CI / 脚本不走闸门」，设计闸门不适用。
  #
  # 登记前用脚本对着 711a52e 量过现状（2026-09-21），四条都是下面验收条件的依据：
  #   ① 第二节章节索引逐节列出的编号有 131 个，§123–§131 九节没有自己的行 —— 它们被一行
  #      合并的「123–131 | Development Phases 0–8 | 见 TODO.md」代掉了，既没有标题也没有说明；
  #   ② spec 全文出现 13 个 REQ-*，第一节追溯表只有 12 行，缺 REQ-INGEST-002（§20）。按
  #      REQUIREMENTS.md 自己的规矩（「没有下表列出的证据…该需求不算完成」），它现在无法被验收；
  #   ③ 索引里 §72 / §102 / §138 三行指向 spec 已退役的编号 —— changelog v1.4 退役 §102 / §138、
  #      v1.6 退役 §72，且明说编号稳定、留空不重用，但索引仍按退役前的标题列着；
  #   ④ 大写 MUST / SHALL / NEVER 全文合计只出现 14 次（MUST 13，其中 MUST NOT 7；NEVER 1；SHALL 0），
  #      小写 must 却有 173 次 —— spec 不按 RFC 2119 写。所以「覆盖每条硬性要求」没法靠关键词机械
  #      判定，本任务必须先定义什么算一条硬性要求，且定义要可枚举，否则验收条件是空的。
  #
  # ⚠️ 本条登记是管理员前置条件：须先合并，之后才能调度本任务的 Worker run。
  #    Worker 本任务不改 .platform/ 下任何文件。
  # ⚠️ 校验脚本刻意是 tests/test_requirements_coverage.py 而不是 scripts/check_*.py：CI 的 docs
