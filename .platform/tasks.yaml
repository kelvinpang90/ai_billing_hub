  #   ④ 大写 MUST / SHALL / NEVER 全文合计只出现 14 次（MUST 13，其中 MUST NOT 7；NEVER 1；SHALL 0），
  #      小写 must 却有 173 次 —— spec 不按 RFC 2119 写。所以「覆盖每条硬性要求」没法靠关键词机械
  #      判定，本任务必须先定义什么算一条硬性要求，且定义要可枚举，否则验收条件是空的。
