      - 签名库复用 app/services/integration_auth.py 的 canonical_request 与 sign，不另写规范化；sign_status_webhook 返回 X-Acuven-Timestamp（Unix 纪元秒整数）、X-Acuven-Signature、X-Acuven-Event-ID、X-Acuven-Key-Version 四个头；signing_material 在没有 ACTIVE 时返回 None
