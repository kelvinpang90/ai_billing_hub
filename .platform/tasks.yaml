    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-164-billing-client.md（设计闸门 #571 已批准 v24） 逐条一致，以 §2「存储（SQLite）」中 ops_log、incidents、status_state、reconcile_state 四张表与待记事故、「投递」的死信与中心恢复后的重放、「有效状态」的应用与状态重置、§4 死信、重放与事故确认各行、§5 对应的行、§7 标 166 与标「165、166」的各行 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - '处置函数：requeue_dead(event_id, *, reason)（清 last_error_code、dead_at、dead_acked_at）、ack_dead(event_id, *, reason)、replay_delivered(*, delivered_from, delivered_until, reason) -> 改回的条数（两个时刻在存储层是 Unix 秒的 float，与 delivered_at 同口径；门面与命令行负责把带时区的时刻换算过来）、ack_incident(incident_id, *, reason)、reset_status(tenant_id, project_id, *, reason) -> 是否删了行；原因须是字符串（不是字符串抛 TypeError）、去掉首尾空白后为 1 到 500 个字符（否则 ValueError、不改），ops_log.reason 与 incidents.ack_reason 存去掉首尾空白之后的文本；成功时在**同一个事务**里写 ops_log（重放每行一条，RESET_STATUS 的 target_id 为 <tenant_id>/<project_id>）；非法状态或已确认、不存在时返回假且不写 ops_log；list_dead(limit, *, include_acked=True)（按 dead_at、再按 event_id 升序，返回 event_id、last_error_code、attempts、dead_at 与 dead_acked_at）'
      - '事故：record_incidents(items, *, overflow) 在一个事务里写入：items 为逐条丢弃的 event_id、kind（DROPPED 或 CONFLICT_DROPPED）与时刻，每条生成新的 incident_id（inc_ 加新 ULID），只在同一 event_id、同一 kind 已有未确认事故时跳过；overflow 为溢出条数与首次、最近时刻，条数大于 0 时写一行 OVERFLOW_DROPPED（event_id 为空、dropped_count 为该条数）；list_incidents(limit, *, include_acked=True) 按 recorded_at、再按 incident_id 升序返回设计列出的字段；未确认事故数的只读计数'
      - '状态与对账时刻：read_status(tenant_id, project_id) 只读那一对的 status_state 行；apply_status(tenant_id, project_id, fields, *, now) -> bool 在 BEGIN IMMEDIATE 里没有行就插入、status_version 更大才整行覆盖（含 applied_at），相等或更小不改，**不写对账时刻**；record_reconcile_ok(tenant_id, project_id, *, now) 与 record_reconcile_error(tenant_id, project_id, *, now) 只写 reconcile_state 那一对的 last_ok_at 或 last_error_at（没有行就插入），不碰 status_state；带 now 参数的函数用传入的时刻，其余写时刻的函数（处置、事故、重放）一律取 Store 构造时注入的时钟；read_reconcile(tenant_id, project_id) 返回 last_ok_at 与 last_error_at（没有行时都为 None）；只保存设计列出的已知字段；list_status_pairs() 返回两表里出现过的每一对及其两表的列（某表没有这一对时那些列为 None），供命令行使用'
      - '测试：新增 integration-client/tests/test_client_store_ops.py，覆盖设计 §7 标 166 与标「165、166」的各行中本任务的部分（重放已送达、处置必填原因与审计、事故确认后再丢弃、状态重置的存储部分、错误码清除中 requeue_dead 的部分、§4 死信与事故确认各行），另覆盖 apply_status 与 record_reconcile_* 互不影响（首次对账失败后 status_state 仍没有行、之后 apply_status 能插入）、换项目不沿用旧状态的存储部分、OVERFLOW_DROPPED 的写入、ops_log 在事务中途失败时与状态改动一起回滚；客户端测试只用标准库与 pytest，SQLite 用 tmp_path 下的文件，HTTP 用注入的假 Transport，时间用注入的时钟，不联网、不 sleep 真实时间、不出现 skipped（CI 的 backend-tests 分片把出现 skipped 判为失败）'
      - '只改 store.py、__init__.py 的导出与 test_client_store_ops.py；不改 AIH-TASK-165 已交付函数的行为；不改 app/、alembic/、frontend/ 与服务端任何代码；不装依赖；不对任何数据库执行迁移；不连生产；不改 .platform/ 与 .github/；复选框只允许 [ ] / [x]；不改 planning-v1 块；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推。PR 正文的「设计闸门」写 #571'
