      - '如果根因在被测代码（app/ 下任何文件）而不是测试本身：停下，不改 app/，在 PR 正文写明是哪一处、为什么，并把 PR 留作只含分析的 Draft（AI 模块的行为受设计闸门 #281 约束，要改得另开任务）'
      - '根因在测试时，只改这一个测试（及它专用的辅助函数）：去掉依赖绝对耗时的断言（elapsed < 0.5、health_elapsed < 0.5 一类），改为不依赖机器速度、且能把超额请求与已接纳请求区分开的判据（注意：已接纳的请求也会在解除阻塞之前超时返回 503，所以「在解除阻塞前返回」区分不了两者）。两条都要有：① 计数——包装执行器的 submit 或捕获 AiDatabaseCapacityExceeded，断言每一轮被准入上限拒绝的请求不少于 12 - limit，且被拒绝的请求没有进入过 resolve_access；② 先后——每一轮里被拒绝的请求全部在该轮第一个已接纳请求返回之前完成（按完成顺序判断，不比较绝对耗时）；保留原有的五项意图：超额请求得到 503 AI_STORE_UNAVAILABLE、并发占用不超过 limit、被阻塞的调用不超过 2、阻塞期间健康检查返回 200、解除阻塞后新请求成功且只留一行'
