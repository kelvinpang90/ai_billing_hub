  - id: AIH-TASK-167
    title: Billing Client 第四层：HTTP 传输与一轮投递：组批、回执判定、单发回退、退避与清理
    purpose: >-
      按 docs/design/AIH-TASK-164-billing-client.md（设计闸门 #571 已批准 v24） §2「投递」：新模块 transport.py 与 delivery.py。delivery.py 提供一轮投递的函数（领取、组批、签名发送、按回执落状态、批层不可重试改单发与续租、退避、401 固定 60 秒重试、清理），不含门面、内存暂存与后台线程（属于 AIH-TASK-168）。
    status: done
    depends_on:
      - AIH-TASK-166
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-164-billing-client.md（设计闸门 #571 已批准 v24） 逐条一致，以 §2「模块与公开接口」中 transport、delivery 两行、「投递」「时间语义」、§3 INV-2、INV-11、INV-13、INV-14、§5 投递相关的行、§7 标 167 的各行 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - 'transport.py：Transport 协议与 Response(status, body)；默认 UrllibTransport 用 urllib.request，不跟随重定向（重定向当作网络错误），响应体最多读 64 KiB，超时取配置；网络异常统一抛本模块的 TransportError，消息不带请求头与请求体'
      - 'delivery.py 的 run_delivery_round(store, transport, config, *, clock, rng, new_request_id) -> DeliverySummary（delivery.py 定义并导出的冻结 dataclass，字段 claimed、delivered、retried、dead、fenced 五个整数，另有类方法 zero() 返回全 0 的实例；续租不足而放弃的行与收到回执后 mark_* 栅栏失效的行都计入 fenced）：**一次调用只领取一次、处理一批**（是否连续多轮由 AIH-TASK-168 的门面决定）；领取 → 按设计拼批量请求体（各条 payload 原样拼接、不重新序列化）→ 每次尝试新的 Request-Id 与 int(clock()) 时间戳、签名、POST 到 /api/v1/integration/usage-events/batch → 回执判定逐行照设计「投递」的表（进 DEAD 只限白名单的六个码且 retryable 为假，其余 retryable 为假的码保持待发；只有批层 413 PAYLOAD_TOO_LARGE、422 VALIDATION_ERROR 与 422 BATCH_TOO_LARGE 才改逐条单发；逐条结果 status 未知或缺布尔 retryable 只让该条记 INVALID_BILLING_RECEIPT）；单条接口回执状态码为 200 或 202、status 为 accepted、already_received 或 already_processed 之一且 event_id 相同就算送达（不要求状态码与 status 的对应关系），event_id 不符或 status 不在这三个里记 INVALID_BILLING_RECEIPT'
      - '批层其他不可重试改为逐条单发，每发一条前对剩下还没落状态的行统一续租，续租影响行数不足即停止回退；单发途中某条得到与这条事件无关的结果（网络错误、retryable 为真的信封、401、retryable 为假但码不在白名单、无信封的非 200）立即停止，这条与剩下的行按该结果落状态；与这条事件有关的结果只落这一条、继续下一条；CREDENTIAL_SCOPE_MISMATCH 在白名单里，按信封进 DEAD（不特殊处理）；单发途中 UNKNOWN_USAGE_TYPE 只让该条退避、继续下一条；错误信封、回执整批失败与单条失败的界线、base_url 与接口路径的拼接都照设计 v8 的写法'
      - '退避 next_attempt_at = now + min(3600, 2 ** min(attempts, 12)) × uniform(0.5, 1.0) 秒，可重试的没有放弃上限；last_error_code 为 INTEGRATION_AUTH_FAILED 的行固定 now + 60 秒；进死信记一条 ERROR 日志只带 event_id 与 error_code；落回执（mark_*）或续租时抛 sqlite3.Error 则本轮立即中止并把异常抛给调用方（不再继续单发回退、清理与 record_delivery_ok；已领取的行停在 SENDING，租约到期后被重领）；每轮末尾 purge_delivered(older_than = now − config.delivered_retention_seconds, limit=1000)（按配置的保留期清理，7 天只是缺省值，不写死）；送达至少一条时 record_delivery_ok；logger 名 acuven_billing_client，不记密钥、签名、请求头原文、载荷与响应体'
      - '测试：新增 integration-client/tests/test_client_transport.py 与 integration-client/tests/test_client_delivery.py，覆盖设计 §7 标 167 的各行（回执判定全表含逐条混合、死信白名单三组、逐条结果残缺、单发回退里的事件相关可重试码、地址拼接、重试载荷逐字节相同而 Request-Id 与时间戳不同、组批上限按条数与按约 15 KiB 事件按字节、批层不可重试改单发、单发回退的停止条件两组、单发回退续租与被重领后停止（测试里用原生 SQL 把那几行的 lease_until 改到过去，再由另一个线程调用 claim 重领；不为测试给 Store 加按线程的时钟）、凭据错误不进死信、凭据错误固定 60 秒重试与修好后送达并清空错误码、保留期配成非 7 天（例如 2 天与 30 天两组）时投递一轮按配置值清理、范围不符按信封、退避区间）；UrllibTransport 用本地不联网的方式测（不跟随重定向、64 KiB 截断、超时与网络异常转 TransportError），可以用标准库的 HTTP 服务器在本机回环地址的临时端口上起一个线程；客户端测试只用标准库与 pytest，SQLite 用 tmp_path 下的文件，HTTP 用注入的假 Transport，时间用注入的时钟，不联网、不 sleep 真实时间、不出现 skipped（CI 的 backend-tests 分片把出现 skipped 判为失败）'
      - '只改本任务 allowed_change_paths 里的文件；不改 store.py 与 AIH-TASK-164 交付的模块；不改 app/、alembic/、frontend/ 与服务端任何代码；不装依赖；不对任何数据库执行迁移；不连生产；不改 .platform/ 与 .github/；复选框只允许 [ ] / [x]；不改 planning-v1 块；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推。PR 正文的「设计闸门」写 #571'
    allowed_change_paths:
      - integration-client/acuven_billing_client/transport.py
