      - "spec 的改动只允许新增：新 REQ 按 §20 里 `REQ-INGEST-001` / `REQ-INGEST-002` 的既有写法，写成 `` `REQ-<AREA>-<NNN>`: <规则> `` 的独立一段，逐条插在**已经陈述该规则的那一节**里；不得新建附录或汇总节，不得挪动、合并或改写任何已有句子"
