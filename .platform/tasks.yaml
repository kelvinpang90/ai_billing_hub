      - 'step(factory, *, clock, monotonic)：每次只在开头读一次 now 与 today，依次调 retire_stale_runs、start_run、claim_run（第 0 步失败则以 stage=retire 结束、不开始也不推进；start_run 抛错以 stage=start 结束；claim_run 返回 idle 或 busy 时原样返回）；第 3 步每批 50 个租户，每批的租户 id 查询单独一个短只读事务，每个租户一个新会话的只读事务调 check_wallet_snapshot（传 on_chunk），monotonic 的 20 秒预算只在租户之间检查；每读完一块与每核对完一个钱包、距上次领租或续租超过 60 秒时用单独的短事务续租（条件为 lease_owner=令牌且 status=RUNNING，lease_until 设为此刻 clock() 加 290 秒），受影响 0 行立即停止、这一段不提交、返回 superseded；某一块超时按 stage=advance 的异常处理'
      - '第 4 步提交前重新读 clock()，带 status=RUNNING、cursor_tenant_id=旧游标与 lease_owner=令牌的 CAS 更新进度并同时清空租约（到末尾时同一条置 COMPLETED、finished_at 并把 running_slot 置空），受影响 1 行才插入这一段的 findings 并提交，否则整段回滚返回 superseded；problem_codes 按输出顺序以英文逗号连接；扫描期间不保持任何事务打开；任何异常回滚并记一条 wallet_reconciliation_failed error 日志，恰好带 stage（retire、start、advance、commit 之一，分别对应第 0 步、第 1 步、第 2–3 步、第 4 步）、run_id（还不知道是哪次运行时为 null：retire、start 两个阶段，以及 claim_run 在读到运行之前就失败的 advance 阶段；claim_run 抛 ClaimError 时取它的 public_id，error_type 记 ClaimError 的 __cause__ 的类名而不是 ClaimError）、error_type 三个字段；凡是本次 step 领过租约、却没有以进度提交结束的（superseded、error），返回前调 release_lease；返回 error、不向外抛；不写钱包与账本'
