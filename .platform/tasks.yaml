  - id: AIH-TASK-155
    title: 月度对账单第二层：账期时刻、账本归属规则与期初期末发生额
    purpose: >-
      按 docs/design/AIH-TASK-154-monthly-statements.md（设计闸门 #565 已批准 v6） §2「账期与时间」「账本归属规则」「发生额分类」与「自检」第 1 条：新模块 app/services/statements.py 的账期边界、到期判定、首个账期常量、归属谓词（SQL 表达式与 Python 参考函数）、在给定高水位下算出本期账本行的分类汇总与期初期末，并做期初加发生额等于期末的自检。只读、不写库、不提交；用量统计、快照与生成属于 AIH-TASK-156。
    status: done
    depends_on:
      - AIH-TASK-154
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-154-monthly-statements.md（设计闸门 #565 已批准 v6） 逐条一致，以 §2「账期与时间」「账本归属规则」「发生额分类」「自检」第 1 条、§3 INV-4、INV-5、INV-8、INV-10、§7 标 155 的各行 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - '账期：StatementPeriod（label 为 YYYY-MM，start、end、cutoff 为 naive UTC）由 statement_period(label) 得到，三者经 app/schemas/customer_usage.py 的 malaysia_day_start_utc 计算（start = 本月 1 日、end = 下月 1 日、cutoff = 下月 2 日的马来西亚零点）；label 只接受 YYYY-MM、年份 2000–2999、月份 1–12，否则 ValueError（不让 0001-01、9999-12 这类边界在时刻换算里抛 OverflowError）；previous_period 对 2000-01、period_containing 对马来西亚月份落在 2000–2999 年之外的时刻，同样抛 ValueError；period_containing(moment) 返回 naive UTC 时刻所在的马来西亚月；previous_period(period)；GENERATION_DELAY: Final = timedelta(hours=1)，is_due(period, now) 恰为 now >= cutoff + GENERATION_DELAY；FIRST_STATEMENT_PERIOD: Final = "2026-12"；due_periods(now, *, first=FIRST_STATEMENT_PERIOD) 返回从 first 到最近一个到期账期的升序列表（没有则为空）。不读环境变量'
      - '归属：attributed_month(transaction_type, created_at, occurred_at) 是设计 §2 定义的 t(r) 的 Python 参考实现，返回 YYYY-MM；AI_USAGE 而 occurred_at 为 None、或非 AI_USAGE 而 occurred_at 不为 None，都抛 ValueError；attributed_through(period) 返回 SQL 布尔表达式，作用于 wallet_transactions 左外连接 usage_events（usage_events.wallet_transaction_id = wallet_transactions.id），与设计 §2 的常量谓词逐字同义（非 AI_USAGE：created_at < end；AI_USAGE：occurred_at < end AND (created_at < end OR (occurred_at >= start AND created_at < cutoff))），比较只用账期常量，不在 SQL 里做日期运算'
      - 'ledger_section(session, tenant_id, period, *, tenant_public_id, high_sequence, balance, previous)（tenant_public_id 只用于错误日志，由调用方传入，本函数不为它查 tenants） -> LedgerSection：previous 是上期的 (ledger_high_sequence, closing_balance) 或 None；按设计 §2「候选扫描」：模块内的查询构造函数 later_rows(tenant_id, period, *, high_sequence) 与 statement_rows(tenant_id, period, *, high_sequence, previous_high_sequence) 各返回若干条 SQLAlchemy Select（每段一条，列至少含 wallet_transactions.id、transaction_type、amount、created_at 与事件的 occurred_at），ledger_section 在这几条 Select 上做 SUM 与分组，另有 later_ids(session, …) -> set[int] 与 statement_ids(session, …) -> set[int] 执行同一批 Select 只取 id，供测试比对行集合（不另写一套查询）；later_rows 求 L(K; h)，候选是两条按 created_at 不相交的查询 C1（wallet_transactions.created_at >= end(K)，走 ix_wallet_transactions_tenant_created）与 C2（AI_USAGE、created_at < end(K)、事件 occurred_at >= end(K)，从 usage_events 侧走 ix_usage_events_tenant_occurred 再按 wallet_transaction_id 连账本），两段的每一行都再用 NOT attributed_through(K) 判定，不假设 created_at 与 occurred_at 的先后、不引用 FUTURE_TOLERANCE；S(M) = 段一（hw_prev < wallet_sequence <= high_sequence 且 attributed_through(M)）∪ 段二（later_rows(M-1, hw_prev) 中 attributed_through(M) 的行），previous 为 None 时 hw_prev 取 high_sequence；期末 = balance − Σ later_rows(M, high_sequence)，期初 = previous 的期末，previous 为 None 时 = balance − Σ later_rows(M-1, high_sequence)；每段一条查询，不写成一个 OR；连不上事件的 AI_USAGE 行的 occurred_at 为 NULL，归属判定对它为 NULL、会被 WHERE 悄悄滤掉，所以在段一与 C1（含期末、期初扫描里的 C1）的同一范围条件下，另查一次「AI_USAGE 且左外连接不到事件」的行数（不经归属判定），大于 0 就抛 check 为 missing_event 的 StatementIntegrityError（C2 从事件侧出发，不会有这种行）；LedgerSection 含 opening_balance、closing_balance、total_topup、total_ai_usage、total_adjustments、prior_usage（(usage_period, request_count, amount) 按 usage_period 升序，usage_period 由 MalaysiaDay 分组后在 Python 里折成月）、prior_rebill、prior_total、current_usage_rows（本期 AI_USAGE 行数），分组口径照设计 §2「发生额分类」的表；每条查询都带 tenant_id，不加锁、不写、不提交；SQL 用 SUM 在 DECIMAL 上求和，Python 侧只有 Decimal'
      - '自检第 1 条：opening_balance 加全部发生额（total_topup + total_ai_usage + total_adjustments + prior_total）不等于 closing_balance，或 S(M) 或期末、期初扫描里有一行 AI_USAGE 找不到事件，抛本模块的 StatementIntegrityError（带属性 check），并记一条固定文本的 error 日志，extra 只带租户 public_id、账期 label 与 check（自检第 1 条为 "1"，AI_USAGE 行找不到事件为 "missing_event"），不带任何金额'
      - '测试：新增 tests/backend/test_statement_ledger.py，覆盖设计 §7 标 155 的各行：账期边界（2026-12、2027-02 与 2028-02、到期判定在 cutoff + 1h 前后各一秒、due_periods 为空与多期）；归属谓词表驱动（上月末、宽限日内、宽限日后、本月、下月 1 日，非用量行月末前后一秒，含 created_at 早于 occurred_at 的行），对每行断言 attributed_through 的 SQL 结果与 attributed_month 一致；created_at 早于 occurred_at 跨月（end(M) − 90 秒入账、occurred_at = end(M) + 120 秒，与镜像 start(M) − 90 秒入账、occurred_at = start(M) + 120 秒）：自检通过，前者不进 M 的 S(M)、进 M+1，后者不进 M-1、进 M；扫描完整性：一批覆盖各类型、created_at 比 occurred_at 早 0 秒至 1 天或晚 0 秒至 40 天、跨三个月的账本行，对几组 (K, h) 断言 later_rows、S(M)、期末与首期期初和全表扫描后逐行用 attributed_month 判定的参考结果逐一相等（集合与金额）；正常路径、宽限日、晚到（含上上月发生）、生成后才提交（传入的 high_sequence 小于实际最大序号，被挡在外面的行进下一期）、首期、两个租户互不混入、AI_USAGE 无事件时的错误与日志不含金额、调用前后 wallets 与 wallet_transactions 不变；金额与 SQL 用例在 SQLite 与 MySQL 两个分片都跑，8 位小数精度的断言只在 MySQL 下做（照 CLAUDE.md「写后端测试的约定」，不写死方言相关的 SQL 字面量）；账本行经 post_transaction 写入，已处理的事件直接插入并回填 wallet_transaction_id，建数写法照 tests/backend/test_usage_billing.py'
      - '只改 app/services/statements.py 与新测试；不改钱包、账本、计费、模型与迁移；不装依赖；不对任何数据库执行迁移；不连生产；不改 .platform/；复选框只允许 [ ] / [x]；不改 planning-v1 块；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推。PR 正文的「设计闸门」写 #565'
