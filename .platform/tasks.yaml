      - 轮换与吊销在一个 session_scope 里先按 api_key 锁住该项目下这个 key 的全部版本行（按 key_version 排序）；轮换校验 current_key_version，冲突与唯一约束兜底都映射为 409；吊销幂等；凭据行与审计同事务，审计前后状态与 reason 里没有 secret、密文与主密钥版本
