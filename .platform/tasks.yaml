    title: 支付第二批第四层：复核单的两个人工出口，按实付入账与不入账结案
    purpose: >-
      按 docs/design/AIH-TASK-179-payments-review.md（设计闸门 #585 已批准 v3） §2「对 A 的适配器的扩展」「人工复核出口」：GatewayPaymentStatus 加 charge_amount_refunded_minor 与 charge_disputed 两个字段；新服务 app/services/payment_review.py 的 resolve_review（CREDIT 向 Stripe 重新查询并按设计核对，在锁支付、钱包、租户的事务里按 Stripe 实收金额写 TOPUP 并转 PAID；CLOSE 转 FAILED），两者都写 PAYMENT_REVIEW_RESOLVED 审计。不加路由：属于 AIH-TASK-183。
    status: done
    depends_on:
      - AIH-TASK-181
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-179-payments-review.md（设计闸门 #585 已批准 v3） 逐条一致，以 §2「人工复核出口」「事务边界」「金额与精度」、§3 INV-3、INV-4、INV-8、INV-10、INV-13、§4 人工出口两行与并发、§5 人工出口相关的行、§6 日志、§7 标 182 的各行 为准；本设计建立在 docs/design/AIH-TASK-172-payments-gateway.md（A，设计闸门 #580 已批准 v3） 之上，B 没有改写的地方沿用 A；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - 'app/payments/base.py 的 GatewayPaymentStatus 加 charge_amount_refunded_minor（int 或 None）与 charge_disputed（bool 或 None），app/payments/stripe_gateway.py 的 get_payment_status 从已展开的 payment_intent.latest_charge 取 amount_refunded 与 disputed 填入（没有 latest_charge 时两者为 None；不多发请求、不改请求参数）；A 的状态映射与 confirm_payment 不用这两个字段，结果不变'
      - 'resolve_review(session_factory, gateway, *, actor, payment_id, action, reason, context, now) 返回支付的 public_id（字符串），不组装详情；gateway 为 PaymentGateway 或 None（由接口层传入）；action 为 CREDIT 或 CLOSE；reason 已由请求层校验；检查顺序照设计：先共同前提（404、409），CREDIT 再看 gateway（None 为 503），CLOSE 不需要 gateway；异常为本模块定义的 AppError 子类，错误码与状态码逐个照设计（404 PAYMENT_NOT_FOUND；409 PAYMENT_NOT_IN_REVIEW、GATEWAY_REFERENCE_MISSING、GATEWAY_QUERY_REJECTED、GATEWAY_REFERENCE_MISMATCH、GATEWAY_NOT_PAID、GATEWAY_REFUNDED_OR_DISPUTED、CURRENCY_NOT_MYR、GATEWAY_PAYMENT_REUSED、TENANT_CLOSED、INTERNAL_TENANT、RESOLUTION_CONFLICT；503 PAYMENTS_MISCONFIGURED（gateway 为 None 且 action 为 CREDIT）、PAYMENT_GATEWAY_UNAVAILABLE）；余额越界沿用 app/services/wallet_adjustments.py 的 BalanceOutOfRange'
      - 'CLOSE：一个事务锁支付行重查前提，置 FAILED、保留 status_reason、写四个结案字段与审计，不写账本。CREDIT：不加锁检查前提与网关 id → 事务外 get_payment_status（不可用 503、被拒 409）→ 按设计表的顺序核对六条（引用、state 为 PAID、MYR、payment_intent_id 不为空、charge 的退款与争议信息都拿得到、没有退过款且没有争议）→ 新事务依次锁支付、钱包、租户（顺序与 A 相同）并按设计重查五条 → 写入设计列出的全部字段（status_reason 保留、confirmed_amount 为 amount_received_minor / 100 的 Decimal、gateway_fee 写法同 A）并调用 post_transaction（TOPUP、amount 为该实收额、reference_type 为 PAYMENT、reference_id 为 public_id、description 为原因，操作者身份照 wallet_adjustments 传管理员）→ 同一事务写审计 → 提交；post_transaction 与写入的结果照设计第 6 步：返回 replayed 为真、抛 LedgerConflict 或撞唯一约束都整体回滚抛 RESOLUTION_CONFLICT，InvalidAmount 的问题码为 BALANCE_OUT_OF_RANGE 时回滚并抛 BalanceOutOfRange，其他 InvalidAmount 与 InvalidTransaction 回滚后原样抛出'
      - '审计 PAYMENT_REVIEW_RESOLVED 的 entity_type、entity_id 与 before / after 字段照设计，金额照 app/repositories/wallet.py 的 _money_text 写成定点字符串；原因文本只进库与审计，任何日志都不记它（与人工调账同一规则）'
      - '测试：新增 tests/backend/test_payment_review.py，覆盖设计 §7 标 182 的各行（CLOSE 三组、CREDIT 第 1 步网关 id 为空时 409 GATEWAY_REFERENCE_MISSING、第 2 步的 503 与 409、第 5 步拿到 MYR 手续费时写 gateway_fee、核对的每一行（含部分退款、全部退款、有争议、charge 信息缺失）与对应错误码且数据不变、gateway 为 None 时 CREDIT 503 而 CLOSE 照常、post_transaction 返回重放或抛 LedgerConflict 时 409 且数据不变、入账后余额越界时 422 BALANCE_OUT_OF_RANGE 且支付、账本与审计都不变、实收 99.99 对应收 100.00 的入账额与 credited_amount、暂停租户人工入账后复机与 outbox、两个管理员并发与 CREDIT 对自动确认并发只入账一次（MySQL）、CREDIT 对关户（MySQL）、post_transaction 抛错时支付与账本与审计都不变、日志不含原因、DISABLED 租户照常入账）；tests/backend/test_stripe_gateway.py 补适配器新字段四组（有退款、有争议、都没有、latest_charge 缺失）且 A 的映射结果不变；需要跨文件共用的新支付夹具时，定义放进 tests/backend/payment_world.py 并在 tests/backend/conftest.py 注册，既有夹具只增不改；后端测试照 CLAUDE.md「写后端测试的约定」：断言 SQL 时不写死方言相关的字面量，跨文件共用的 fixture 在 conftest 注册（定义放在不以 test_ 开头的辅助模块；本任务的 allowed_change_paths 不含 conftest 时夹具写在本任务的测试文件里），需要真 MySQL 的场景照现有写法在 BILLING_TEST_DATABASE_URL 未设置时 skip（CI 必跑），CI 上不出现 skipped；Stripe 一律用注入的假传输，不联网；时间一律注入，不 sleep'
      - '只改本任务 allowed_change_paths 里的文件；只调用 post_transaction、get_payment_status 与 A 的模型，不修改它们；不加路由；不装依赖；不对任何数据库执行迁移；不连生产；不调用真实的 Stripe 接口（测试一律用假传输）；不改 docker-compose 文件、不新增 Docker secret；不改 .platform/ 与 .github/；复选框只允许 [ ] / [x]；不改 planning-v1 块；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推。PR 正文的「设计闸门」写 #585'
    allowed_change_paths:
