  #     只能写成「有测试」，是循环。所以改标「不适用」并逐条写明理由。
  # 4 + 11 = 15，补完覆盖表里一个「缺口」都不剩，R5 才可以勾掉。
  #
  # ⚠️ 本条登记是管理员前置条件：须先合并，之后才能调度本任务的 Worker run。
