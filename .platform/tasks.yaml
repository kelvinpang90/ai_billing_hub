      - 迁移 0007 的表、列、CHECK、(public_api_key, key_version) 唯一约束、MySQL 上 public_api_key 的 utf8mb4_0900_bin、(project_id, tenant_id) 复合外键与 projects 的 uq_projects_id_tenant 按设计 §2；encryption_key_version 存主密钥版本，与签名版本 key_version 分开；downgrade 先删表再删约束；文件头有 §132 第 13 条分析
