      - 状态机按设计 §4：签发要求没有 PENDING，版本号 = 该项目最大版本 + 1；启用在同一事务里把原 ACTIVE 改为 RETIRED；启用已是 ACTIVE、退役已是 RETIRED 都是 200 不写；每个操作先 SELECT … FOR UPDATE 锁项目行；唯一约束冲突映射为 409 WEBHOOK_SECRET_CONFLICT
