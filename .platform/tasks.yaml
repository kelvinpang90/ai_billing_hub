      - 实现与 docs/design/AIH-TASK-019-webhook-signing.md 逐条一致；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计
      - 四个接口的路径、请求体（extra=forbid）、响应字段白名单、错误码（WEBHOOK_SECRET_NOT_FOUND / WEBHOOK_SECRET_PENDING_EXISTS / WEBHOOK_SECRET_NOT_PENDING / WEBHOOK_SECRET_CONFLICT，另有 CUSTOMER_NOT_FOUND / PROJECT_NOT_FOUND / ENCRYPTION_NOT_CONFIGURED）按设计 §2；secret 格式 whs_ 加 64 个小写十六进制，只出现在签发的 201 响应里；四个成功响应都带 Cache-Control no-store
      - 四个处理函数的第一条语句都调用 require_admin，并加进 EXPECTED_ADMIN_ROUTES 与 VALID_BODIES；匿名 401、CUSTOMER 403，都不写库
