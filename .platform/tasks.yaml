    depends_on:
      - AIH-TASK-086
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-086-session-revocation.md（设计闸门 #369 已批准 v6）逐条一致，以 §2 的「核心规则」「令牌盘点」「统一加锁顺序」「刷新令牌不可用时的判别」「在途请求的语义」「令牌格式」「事务边界」与 §5 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计。勘误（优先于设计）：设计里写的 401 INVALID_TOKEN 指现有的 InvalidToken，错误码实际是 TOKEN_INVALID，沿用它、不新增错误码'
      - '前提核对（管理员 PR；app/services/password_reset.py、app/core/tokens.py 与 tests/backend/test_tokens.py 的文件名含 password / tokens，Worker 的敏感路径规则不许改）：reset_password 已在写新哈希的同一事务里递增 password_version；issue_access_token、issue_pending_2fa_token 已有 password_version 参数并写入 claim pwv，decode_token 不强制要求 pwv。动手前逐项核对，缺任何一项就停下并在 PR 里说明，不自行绕过'
      - '所有签发调用都显式传 password_version（不依赖默认值 0），使用点按缺省为 0 取 pwv。app/services/auth.py：_issue_session 新增 password_version 参数、不在函数里重读用户；authenticate、complete_second_factor、refresh_session 按设计 §2 盘点表取值与比较；complete_second_factor 在事务开头 SELECT users FOR UPDATE，锁内依次：用户存在且状态检查 → 比较 pending 令牌的 pwv 与当前版本（不等即回滚，不提交任何改动，包括已清掉的过期锁）→ 清过期锁与锁定检查（沿用现有写法）→ 验证第二因子 → 签发；第二因子失败时保持先提交再写失败计数；refresh_session 改为不加锁读出旧行取 user_id → 锁用户行 → 条件 UPDATE，入口检查与条件更新失败共用设计 §2 的判别表（只有 used_at 非空才走 _treat_as_replay）'
      - 'app/services/two_factor.py：start_enrolment、confirm_enrolment、regenerate_recovery_codes 新增参数接收所用令牌的版本号，在各自写事务里先 SELECT users FOR UPDATE 再比较，不等时 401 TOKEN_INVALID、不写任何 2FA 行或恢复码。app/api/auth.py 的 require_current_user 读库时比较 pwv；app/api/two_factor.py 的 enrol、confirm 把 pending 令牌的 pwv 传给服务，regenerate 传 require_current_user 返回的 user.password_version（require_current_user 读库时已核对它等于访问令牌的 pwv，两者等价，不改 require_current_user 的返回类型）'
      - '测试：新增 tests/backend/test_session_revocation.py 覆盖设计 §7 的非并发各行（正常路径、改密码后的旧令牌五个使用点、改密码之后的普通刷新、登出之后的刷新、真正的重放不受影响、_issue_session 不重读用户、兼容、版本单调、事务中途失败），以及守卫用例：用 ast 扫描 app/ 下目标为属性 password_hash 的赋值（Assign 与 AugAssign），要求同一函数体内同时出现对 password_version 的赋值（属性赋值、增量赋值，或 update(...).values(password_version=...)）；用 User(...) 关键字参数构造新用户的写法不是属性赋值，明确豁免并写明理由（设计审查 v6 的提醒）'
      - '设计 §7 的并发各行（含「真正的重放不受影响」里两个并发刷新抢同一行的那一半）属于 AIH-TASK-088，本任务不写并发用例。既有测试因签名变化需要改的，只改 tests/backend/test_auth_service.py、test_two_factor.py 两个文件里的调用方式，不改它们断言的行为（刷新令牌被吊销后不再写重放审计这一处除外，按设计改并在 PR 里列出）'
      - 'docs/api.md 的认证说明补一段：改密码使之前的全部会话失效（版本号规则）、刷新令牌被吊销与被重放的区别，以及「以后新增任何设置密码的入口都必须在同一事务里递增 password_version」（设计 §10 A1）'
