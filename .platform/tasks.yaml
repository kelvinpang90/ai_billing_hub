      - 表格列：时间（DateTimeText，UTC → Asia/Kuala_Lumpur）、动作、操作者（actor_email，为空时显示「系统 / 未知」并区分 actor_role 为 SYSTEM 的情况）、实体（entity_type 加 entity_id 或 entity_user_email）、IP、原因；展开行格式化显示 before_state / after_state 与 user_agent。顺序沿用后端（最新在前）
      - 筛选：动作用下拉（选项取后端已知的动作值，写成一个常量并在注释里指向 app/models/auth.py 的 AuditAction）、实体类型与 id、操作者邮箱、时间段。时间段按 Asia/Kuala_Lumpur 输入，发请求前换成不带时区的 UTC（与 DateTimeText 反向）；换算逻辑放在 frontend/src/components/DateTimeText.tsx 旁边导出或页面内，并有单测覆盖跨日边界。改筛选条件回到第 1 页
      - 加载中、失败（带 request_id，用 RequestReference）、空列表三种状态都画出来；403 ADMIN_REQUIRED 显示无权限提示；422 显示后端 message
      - 所有面向用户的文案走 i18n，满足 no-hardcoded-jsx-text 与 frontend/src/i18n/keys.test.ts
