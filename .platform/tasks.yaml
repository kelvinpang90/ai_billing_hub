    status: done
    depends_on:
      - AIH-TASK-091
    acceptance_criteria:
      - '实现与 docs/design/AIH-TASK-089-customer-portal-auth.md（设计闸门 #368 已批准 v10）逐条一致，以 §2「管理员重置客户 2FA」「事务边界」、§4 状态表的停用、启用、重置 2FA 三行、§5、§6 为准；设计与本契约冲突时以设计文件为准，发现设计本身有问题时停下并在 PR 里说明，不自行改设计'
      - '服务接口：disable_portal_account、enable_portal_account、reset_portal_two_factor 的参数是 session_factory、actor（ADMIN 用户）、customer_id（租户 public_id）、context，重置另有 reason；返回 AIH-TASK-091 的 PortalAccountView；客户不存在抛 CustomerNotFound，未开通抛 PortalAccountNotFound；各一个事务，加锁顺序租户 → 用户 → 令牌'
      - '停用：INVITED 或 ACTIVE → DISABLED，吊销全部刷新令牌、作废全部未用令牌（两种用途）、password_version + 1、审计 PORTAL_ACCOUNT_DISABLED；已停用 409 PORTAL_ACCOUNT_ALREADY_DISABLED。启用：DISABLED → activated_at 为空回到 INVITED，否则 ACTIVE，审计 PORTAL_ACCOUNT_ENABLED，不自动重发邀请；不是 DISABLED 409 PORTAL_ACCOUNT_NOT_DISABLED；租户 CLOSED 409 ACCOUNT_CLOSED'
      - '重置 2FA：账号有已确认或待确认的 2FA 时删除 two_factor_settings 行与全部恢复码、password_version + 1、审计 PORTAL_2FA_RESET（reason 记入去首尾空白后的值，after_state 只放 tenant_public_id，以设计 §4 那一行为准）；没有 2FA 时 409 PORTAL_2FA_NOT_ENABLED；reason 在服务里同样校验（去首尾空白后 1–255 个字符，否则 422 VALIDATION_ERROR，与接口层的 _Reason 一致）。启用的判定顺序：先看账号状态（不是 DISABLED 即 409 PORTAL_ACCOUNT_NOT_DISABLED），再看租户（CLOSED 即 409 ACCOUNT_CLOSED）'
      - '测试：在 tests/backend/test_portal_accounts_service.py 增加设计 §7 的「停用 → 启用」（含重新启用后停用前的访问令牌仍 401 TOKEN_INVALID、版本号比停用前大 1）、「邀请字段」中停用与启用的那几步、「重置客户 2FA」（含原因为空、255 个字符成功且审计逐字相同、256 个字符 422 不写行）、改密码后的旧会话（客户路径）中服务层的部分、事务中途失败（停用、启用、重置 2FA 各一次，在写审计那一步注入 OperationalError，断言整体回滚：状态、令牌、2FA 行、版本号都不变）；在 tests/backend/test_portal_accounts_concurrency.py 增加停用与接受、重置 2FA 与客户确认 2FA 两组并发（真 MySQL、两个连接、屏障、两种先后，等待都设超时；未设置 BILLING_TEST_DATABASE_URL 时 skip、CI 必跑）'
      - '不改认证服务、接口、schema、路由、outbox 渲染、迁移与前端；不改 AI 模块；SQL 断言不写死方言字面量；示例 uuid 用全零占位值；不装依赖；不对任何数据库执行迁移；不改 .platform/；复选框只允许 [ ] / [x]；不改 planning-v1 块；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推。PR 正文的「设计闸门」写 #368'
    allowed_change_paths:
