# 控制契约 —— 项目事实与角色绑定
#
# 这份文件只描述「谁能做什么」，不描述业务。未来的 Windows Execution Worker
# 启动前必须读它；读不到、解析失败、或 worker_enabled 不为 true，一律不调度。
#
# ⚠️ 本文件里的仓库事实来自本地 git remote 与 CLAUDE.md 的「分支保护」一节，
#    **不是**从 GitHub API 实时读取的。改了 GitHub 上的保护规则要回来同步这里。

schema_version: 1
project_id: ai_billing_hub

repository:
  host: github.com
  slug: kelvinpang90/ai_billing_hub
  clone_url: https://github.com/kelvinpang90/ai_billing_hub.git
  default_branch: main
  # 合并方式只能是 squash：main 要求线性历史（docs/WORKFLOW.md 第 5 节）
  merge_method: squash
  protected_branches:
    - name: main
      allow_direct_push: false
      allow_force_push: false
      require_pull_request: true
      require_branch_up_to_date: true
      # CI 的必需检查项。已在 2026-09-16 通过 GitHub branch protection API
      # 回读，并与 docs/HANDOFF.md 的当前记录交叉核对。
      required_status_checks:
        - docs
        - scripts
        - policy
        - backend
        - frontend
        - secret-scan

# 合并之后由谁来判「这次到底上没上生产」（OpenClaw ACVDEV-TASK-023A）。
#
# 写的是**工作流的文件名**，不是它的显示名 —— 显示名改掉不会有任何东西报警。
# 缺这一行就**不观察**：run 在合并处收尾，和加这一行之前一模一样。这是默认拒绝，
# 不是默认信任：用别的方式部署的仓库永远不会被误判成「部署失败」。
#
# ⚠️ **OpenClaw 只读结论，不部署、不回滚、不重跑。** 真正的部署逻辑仍然全在
#    `deploy/deploy.sh` 里（健康检查、冒烟、自动回滚都是它做的）。控制面拿着这个
#    文件名去问 GitHub「这个合并 commit 上它跑成什么样了」，然后据此收尾那个 run：
#    成功即完成，失败即 `deploy_failed`，一直问不到结论即 `deploy_timeout`。
#
# ⚠️ **这一行只能由运营者的 PR 改，run 改不了。** 控制面从 run 的 **base commit**
#    读它，所以一个 run 没法在自己的分支里改掉（或删掉）判自己的那条规则。
#    代价是：**加上这一行的这个 PR 本身不会被观察**，下一个任务才开始生效。
deploy_workflow: deploy.yml

# 部署后浏览器验收能访问的主机（OpenClaw ACVDEV-TASK-048 / 049；本仓库从 AIH-TASK-024 起用）。
#
# Worker 启动的浏览器只能经它的出站代理访问这里列出的主机的 443，别的一概连不上。管理端页面与它调用的
# API 同源（nginx 整站反代，前端 client 的 baseURL 是 `/`），所以只有一个。只列生产主机。
#
# 只有声明了 `acceptance` 的任务才读它；有这样的任务而这里缺失或不合法（1–4 个小写 DNS 主机名，不带协议、
# 端口、路径、通配符），契约即 invalid_contract。与 deploy_workflow 一样只能由运营者的 PR 改：Worker 改不了
# `.platform/`，验收时读的是合并 commit 里的这份。
#
# ⚠️ 这是 ADR-0001「不提交真实主机名」的第一个登记例外（见该 ADR 的派生要求；第二个是 BNM 公开汇率接口的地址）。
#    不要照着这一行把主机名写到别处。
acceptance_hosts:
  - aibilling.acuventech.com

# merge_owner：Worker 实现 PR 的合并由 Kelvin 在 Telegram「批准」。
# 任务完成后的收尾 PR 不经这道批准：OpenClaw 自动开，只含 tasks.yaml 的 ready → done 与从 docs/TODO.md
# 「当前计划」移除这一项两处机械改动，CI 通过后自动合并、不触发部署（ACVDEV-TASK-066）。OpenClaw 的 run
# 仍然改不了 .platform/。只有自动收尾失败（Telegram「自动收尾失败」通知）时才由人手工开收尾 PR。
roles:
  development_owner: claude_code
  independent_reviewer: codex
  merge_owner: kelvin

execution:
  execution_worker: windows-native
  control_plane: openclaw

  # ⚠️ 这一行是**业务契约侧**的开关（ACVDEV-TASK-004 置 true）。它只表示本仓库
  #    同意被 Worker 调度，**本身不会让任何东西执行**。真正跑起来还必须同时满足：
  #    - 控制面 registry 里登记了本项目
  #    - Worker 的 host-local 配置已就位（不在本仓库，公开仓库不写本机信息）
  #    - Worker 启动前预检通过（读得到、解析得了本目录全部契约文件）
  #    - Kelvin 对启用给出独立的明确批准（合并本文件不算这张批准）
  #    任何一条不成立都不调度。改回 false 仍是出事时的回滚方式：
  #    false 即不会有任何调度发生，不需要删文件、不需要改代码。
  worker_enabled: true

  # 下面几条是真实运行前的准入条件，缺一不可。它们**不由本文件强制**，
  # worker_enabled 为 true 也不代表它们已经成立 —— 由控制面、Worker 预检与人把关。
  enable_preconditions:
    - 本契约已经 Codex 审查并由 Kelvin 合并进 main
    - Worker 的可执行文件解析路径已在 Worker 安装侧固定（不从 PATH 查找）
    # 下面两条对应 commands.yaml 的 constraints.environment 与 network_enforcement：
    # 那两样是**必须由 Worker 强制**的，不是写在 YAML 里就自动成立的。
    - 已验证环境清理：子进程不继承宿主环境，denied_name_patterns 实际生效
    - 已验证网络隔离：network false 的命令在禁止出站网络的环境里跑
    - 已审查并部署的控制面 Worker 版本会机器强制任务的 allowed_change_paths：在跑检查、commit、push、建 Draft PR 之前拦下越界改动
    - 控制面 registry 已登记本项目，Worker host-local 配置已就位
    - Worker 预检通过
    - Kelvin 明确批准启用（独立于合并本契约的那次批准）

# 默认拒绝。未在对应文件里列出的东西一律不可执行、不可调度、不可批准。
defaults:
  command_policy: deny
  task_policy: deny
  approval_policy: deny

contract_files:
  commands: .platform/commands.yaml
  tasks: .platform/tasks.yaml
  approvals: .platform/approvals.yaml
  state_schema: .platform/state.schema.json
