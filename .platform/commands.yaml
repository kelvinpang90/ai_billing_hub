# 控制契约 —— 可执行命令 allowlist
#
# 默认 deny：这里没有的命令一律不可执行，没有「差不多就放行」。
# 每条命令的 executable 与 args 都是**固定数组**，调用方只能按 id 引用，
# 不能追加参数、不能改工作目录、不能注入环境变量。
#
# 这里列的每一条都在 docs/WORKFLOW.md 第 7 节「提 PR 前必须本地跑过」里有出处，
# 且对应文件在仓库中真实存在。不要往这里加仓库里没有的脚本。

schema_version: 1
project_id: ai_billing_hub
default: deny

# 机器可验证的硬约束。Worker 的实现必须逐条满足，不满足就不要启用 Worker。
constraints:
  # 不经 shell：直接 spawn 进程，argv 逐个传。禁止把命令拼成字符串。
  shell: false
  # args 是固定字面量数组，不做任何模板替换 / 变量展开
  argument_templating: false
  caller_supplied_arguments: false
  caller_supplied_executable: false
  # 不允许通配符展开（`*`、`?`、`**`），路径必须逐个写死
  glob_expansion: false
  # 不从聊天消息或任务参数注入任何环境变量
  environment_injection: false

  # ⚠️ 上面那条只挡住「注入」，挡不住「继承」。子进程按普通方式启动会原样拿到
  #    宿主环境，于是 tests.backend 会看到 BILLING_TEST_DATABASE_URL 之类的变量，
  #    一条声称无凭据、无网络的 low risk 命令就会去连真实服务。所以环境必须先清空。
  environment:
    mode: clean
    inherit_host_environment: false
    # 按**变量名**白名单放行，值由 Worker 安装侧固定，不写进仓库（公开仓库）。
    # 这几个是让进程能起来的最小集：解析 git / pwsh 要 PATH，Windows 上的
    # 系统调用要 SYSTEMROOT，临时文件要 TEMP / TMP。
    # ACUVEN_GIT_LS_FILES_MANIFEST 只在 Worker 模式由控制面设置，值是只读 manifest 的
    # 绝对路径（见下面 policy.check 的注释）；它不是凭据，也不指向任何服务。
    # LOCALAPPDATA 给 frontend.test：vitest 启动时必须在 `%LOCALAPPDATA%\vitest\` 读或建一个
    # 本地 API token 文件（没有这个变量就回退到用户目录的 AppData\Local），建不了就退到
    # frontend/node_modules/.vitest/，两处都写不了直接启动失败。值由 OpenClaw 设成 **worktree 之外的
    # 逐次 run 临时目录**：不是用户真实的 AppData（那里既写不进 AppContainer，也不该被 run 碰到），
    # 也不在 worktree 里（否则 token 文件会作为未跟踪文件出现在改动集合里）。
    allowed_names:
      - PATH
      - SYSTEMROOT
      - TEMP
      - TMP
      - LOCALAPPDATA
      - ACUVEN_GIT_LS_FILES_MANIFEST
    # 即使有人把下面这些加进 allowed_names 也不放行 —— deny 优先于 allow。
    precedence: denied_wins
    denied_name_patterns:
      - "BILLING_*"
      - "*DATABASE*"
      - "*REDIS*"
      - "*MYSQL*"
      - "*SECRET*"
      - "*TOKEN*"
      - "*PASSWORD*"
      - "*CREDENTIAL*"
      - "*API_KEY*"
      - "GH_*"
      - "GITHUB_*"
      - "AWS_*"

  # ⚠️ 每条命令的 `network: false` **不是元数据**，是必须在进程边界上强制的约束：
  #    命令要跑在禁止出站网络的环境里（作业对象 / 防火墙规则 / 隔离账户，具体
  #    机制由 Worker 安装侧决定）。强制不了就不要启用 Worker —— 一条只写在
  #    YAML 里、没有任何东西执行的「无网络」声明，比不写更糟。
  network_enforcement: process_boundary_required

  # 只允许仓库根作为工作目录
  allowed_working_directories:
    - repository_root
  # executable 必须在 Worker 安装侧解析成固定绝对路径，不从 PATH 查找 ——
  # 绝对路径属于本机信息，按仓库公开的约定不写进仓库文件。
  executable_resolution: pinned_at_worker_install

# writes 的取值口径：
#   none  —— 不写工作区任何文件
#   cache —— 只写构建/测试缓存（__pycache__ / .ruff_cache / .pytest_cache），
#            这些路径已被 .gitignore 忽略，不产生工作区 diff
#   repo  —— 会改动仓库内被跟踪的文件。**本文件里一条都没有，也不许有。**
commands:
  - id: docs.check
    description: 校验文档相对链接、spec 章节引用与跨文件约定串一致性
    executable: python
    args: ["scripts/check_docs.py"]
    working_directory: repository_root
    risk: low
    timeout_seconds: 180
    network: false
    writes: none

  - id: policy.check
    description: 仓库策略检查（Markdown 复选框只允许两种状态等本地项）
    executable: python
    args: ["scripts/check_repo_policy.py"]
    working_directory: repository_root
    risk: low
    timeout_seconds: 180
    network: false
    writes: none
    # Worker 模式：Worker 里刻意没有真实 Git，由控制面把 `git ls-files -z --cached --others
    # --exclude-standard` 的原始输出写成只读文件，绝对路径放进 ACUVEN_GIT_LS_FILES_MANIFEST。
    # 设置了它时本命令读 manifest、不启动 Git，读不懂一律退出 2；没设置时（本地 / CI）照旧调 Git。

  - id: tests.process
    description: 流程脚本（策略检查与回读脚本）的 unittest 回归
    executable: python
    args: ["-m", "unittest", "discover", "-s", "tests"]
    working_directory: repository_root
    risk: low
    timeout_seconds: 600
    network: false
    writes: cache
    # Worker 模式下同样消费 ACUVEN_GIT_LS_FILES_MANIFEST。要建临时 Git 仓库或读提交图的用例
    # **只在设置了该变量时**以固定原因 skip；manifest 消费用例照常运行。
    # 不依赖 Git 的用例只有一个例外：tests/test_gh_verified_write.py::VerifiedWriteTests::
    # test_file_with_spaces_unicode_and_relative_path。真实 Windows MXC run 里临时文件已创建，但
    # AppContainer 拒绝最终路径解析，Path.resolve(strict=True) 报 WinError 5；本地 / CI 通过。它同样
    # 只在设置了该变量时以固定原因（Windows MXC 最终路径解析）skip。不得整模块 / 整类 skip，
    # 不得 skip 其它不依赖 Git 的用例。
    # ⚠️ 与 tests.backend 同理，Worker 里的 skipped 不是 passed：CI 不设该变量、全量运行，
    #    准入以 CI 为准。

  # lint.check / format.check 用 Python 隔离模式 `-I`（WORKFLOW §7 那两条的等价写法）：`python -m` 会把 cwd
  # 放在 sys.path 最前面，worktree 里的 ruff.py 能顶替真正的包。控制面 ACVDEV-TASK-017 只给固定了完整定义、
  # 且首参数是 `-I` 的检查放开 MXC 的 Win32k 缓解（ruff.exe 需要），并逐字比对这里的 executable + args ——
  # 改这两条的写法，本机 Worker 配置里固定的定义必须同步改，否则 run 以 policy_violation 失败。
  - id: lint.check
    description: 后端 lint（ruff check，只报告不改写）
    executable: python
    args: ["-I", "-m", "ruff", "check", "."]
    working_directory: repository_root
    risk: low
    timeout_seconds: 300
    network: false
    writes: cache

  - id: format.check
    description: 后端格式检查（ruff format --check，只报告不改写）
    executable: python
    args: ["-I", "-m", "ruff", "format", "--check", "."]
    working_directory: repository_root
    risk: low
    timeout_seconds: 300
    network: false
    writes: cache

  - id: tests.backend
    description: 后端产品代码测试（pytest，testpaths 指向 tests/backend）
    executable: python
    args: ["-m", "pytest"]
    working_directory: repository_root
    risk: low
    timeout_seconds: 1800
    network: false
    writes: cache
    # ⚠️ 本命令**不是 CI 的替代品**。CI 起了真 MySQL 与 Redis 并显式把
    #    「有任何 skipped」判成失败；Worker 这边环境是清空的（见 constraints.environment，
    #    `BILLING_*` 还额外落在 denied_name_patterns 里），所以迁移与 broker 用例
    #    必然安静地 skip。不得把 skipped 读成 passed。
    caveat: migration_and_broker_tests_skip_without_service_env

  - id: scripts.verdict_tests
    description: 审查判定行解析的 PowerShell 回归测试（CI 的 scripts 项跑的就是它）
    executable: pwsh
    args: ["-NoProfile", "-File", "scripts/tests/Test-ReviewVerdict.ps1"]
    working_directory: repository_root
    risk: low
    timeout_seconds: 600
    network: false
    writes: none

  # 前端三条是 WORKFLOW §7「动了 frontend/ 就再加四项」里 lint / typecheck / test 的 Worker 等价写法
  # （build 不在这里：它只比 typecheck 多一步 vite 打包，写 frontend/dist/，留给 CI）。
  # 不走 npm / npx：它们是脚本外壳，依赖 PATH 与 APPDATA；这里由 node 直接执行 frontend/node_modules
  # 里的入口文件，工作目录仍是仓库根，靠参数把项目指到 frontend/。
  # 三条的 args 都以 --preserve-symlinks --preserve-symlinks-main 开头：Worker 的 AppContainer 里 lstat
  # 不了 worktree 的任何上级目录（盘符根也不行），而 node 的 JS realpath 必然逐级 lstat 到盘符根，
  # 报 EPERM。保留符号链接路径就不走 realpath；node_modules 以只读 junction 提供，这两个参数同时让
  # 经 junction 的路径保持原样，不被解析成真实路径。
  # ⚠️ 前提：frontend/node_modules 由控制面按 frontend/package-lock.json 以**只读目录**提供，Worker
  #    不装依赖（never_low_risk 的 dependency_install）。三条都不往 node_modules 写，下面每条注明了
  #    为此改掉的默认行为。2026-09-27 实测两处：OpenClaw 在 Worker 的 MXC 里原样跑这三条定义，
  #    全部零退出、工作区无改动；本机经只读 junction 提供 node_modules（ACL 拒写）、清空环境、
  #    拦截全部 connect / listen / DNS，同样零退出、node_modules 无改动、零网络尝试。
  - id: frontend.test
    description: 前端单元与组件测试（vitest run，一次性，不 watch、不起 dev server）
    executable: node
    args: ["--preserve-symlinks", "--preserve-symlinks-main", "frontend/node_modules/vitest/vitest.mjs", "run", "--root", "frontend", "--configLoader", "native", "--no-cache", "--execArgv=--preserve-symlinks", "--execArgv=--preserve-symlinks-main"]
    working_directory: repository_root
    risk: low
    timeout_seconds: 600
    network: false
    writes: none
    # --configLoader native：默认的 bundle 加载器把 vite.config.ts 打包进 node_modules/.vite-temp/，
    #   只读下启动即 EPERM；runner 加载器在 AppContainer 里解析不了 @vitejs/plugin-react 的依赖。
    #   native 由 node 自己加载 vite.config.ts（node 24 原生去类型），不落临时文件。
    # --no-cache：不写 node_modules/.vite/vitest/ 的结果缓存。
    # --execArgv=…：vitest 给 forks 子进程拼 node 参数时，父进程的只保留 --cpu-prof / --heap-prof /
    #   --diagnostic-dir 几类，preserve-symlinks 会被丢掉，要经 --execArgv 显式再传一遍。
    # frontend/vite.config.ts 为 Worker 配了两处：resolve.preserveSymlinks（经 junction 加载时 vitest
    #   不被加载两份）与 VITEST_SKIP_INSTALL_CHECKS（jsdom 安装检查的 realpath 在 AppContainer 里失败）。
    # 仓库外会写两处：%LOCALAPPDATA%\vitest\ 的 token（见 constraints.environment）与 TEMP 下
    #   vite 模块运行器的临时文件（每次约 0.5 MB）。子进程：默认 forks pool，经 IPC 管道通信，不开端口。
    # 另外 tsc、eslint 的入口会开 node 的编译缓存（module.enableCompileCache），写在 TEMP 下的
    #   node-compile-cache/（三条跑完约 12 MB，可复用）。都在 TEMP 里，不进工作区。

  - id: frontend.typecheck
    description: 前端类型检查（tsc -p tsconfig.test.json，覆盖 src 下应用代码与测试）
    executable: node
    args: ["--preserve-symlinks", "--preserve-symlinks-main", "frontend/node_modules/typescript/bin/tsc", "-p", "frontend/tsconfig.test.json", "--composite", "false", "--incremental", "false"]
    working_directory: repository_root
    risk: low
    timeout_seconds: 300
    network: false
    writes: none
    # CI 的 `tsc --build --force` 会把 tsbuildinfo 写进 node_modules/.tmp/，只读下报 TS5033。
    # 单项目 -p 加关掉 composite / incremental 就不产出 tsbuildinfo（noEmit 本来就开着）。
    # tsconfig.test.json 的 include 是整个 src，严格选项与 app 一致，所以应用代码与测试的类型错都能拦住。
    # 只在 CI 的两样：tsconfig.app.json 那条「应用代码不许拿到 Node 类型」的边界，和 vite.config.ts（tsconfig.node.json）。

  - id: frontend.lint
    description: 前端 lint（eslint，含自定义规则 no-hardcoded-jsx-text，只报告不改写）
    executable: node
    args: ["--preserve-symlinks", "--preserve-symlinks-main", "frontend/node_modules/eslint/bin/eslint.js", "frontend"]
    working_directory: repository_root
    risk: low
    timeout_seconds: 300
    network: false
    writes: none
    # eslint 10 从被检查文件所在目录向上找配置，所以从仓库根跑也用 frontend/eslint.config.js；
    # 默认不开 --cache，不写文件。

# 下面这些**不是命令**，是明确不得被伪装成 low risk 混进 allowlist 的动作类别。
# 想做其中任何一件，走 .platform/approvals.yaml 的 approval_required 或 prohibited。
never_low_risk:
  - create_or_update_pull_request
  - dependency_install
  - external_notification
  - deployment
  - database_migration
  - delete_or_truncate
  - service_restart
  - credential_access_or_rotation
  - security_configuration_change
