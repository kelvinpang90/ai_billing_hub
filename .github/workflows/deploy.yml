# 部署到生产 VPS（spec §99；T0.9）。
#
# ⚠️ **这个 workflow 刻意很薄。**真正的部署逻辑在 `deploy/deploy.sh` 里，因为
# YAML 里的步骤**没有任何办法在生产之外跑一遍** —— 而迁移顺序、健康等待、回滚
# 恰恰是最不该第一次就在生产上验的东西。脚本可以在本地栈上整套跑通，也确实跑过。
#
# ⚠️ **这个文件本身从未在真实 VPS 上执行过**（写它的时候生产主机还没就绪）。
# 第一次跑之前请按 docs/deployment.md §9 的清单逐条确认。

name: Deploy

# ⚠️ **现在只能手动触发，刻意没有 `push: branches: [main]`。**
#
# 加上那一条，这个 workflow 就会在合并的那一刻开火 —— 而生产主机还没就绪、
# 四个 secret 也还没配。后果不只是「一次红色的 CD」：build 那一步会**真的把镜像
# 推到 ghcr**，那是个对外的副作用，不该由一次「先把代码合进去」顺带触发。
#
# 等 docs/deployment.md §9.4 那张前置清单逐条关闭之后，再把下面两行加回来：
#
#     push:
#       branches: [main]
#
# 那应该是一次**有意识的改动**，而不是从一开始就挂在那里等着。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的 commit SHA（回滚时填上一个好的那个）"
        required: true

permissions:
  contents: read
  packages: write

# ⚠️ **不允许并发部署**，而且**不取消正在跑的那个**。
# 取消一个跑到一半的部署会把栈停在中间状态（迁移跑完了、容器还没换），
# 那比等一会儿糟糕得多。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve the immutable tag
        id: resolve
        # ⚠️ 用完整 commit SHA 作为标签，**不是** latest（§99 要求
        # 「immutable image tags identify the exact commit」）。deploy.sh 会拒绝
        # latest / main / master 这类可变标签。
        run: echo "tag=${{ inputs.ref || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ **镜像在这里构建，不在 VPS 上构建。**那台机器只有 1–2 核、12 GB 可用
      # 磁盘，上面还跑着另外八个项目（docs/deployment.md §3.1）—— 在它上面做一次
      # 构建会把同机的别人一起拖慢。
      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.resolve.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:${{ steps.resolve.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to the VPS
    needs: build
    runs-on: ubuntu-latest
    # ⚠️ environment 带来两道保护：「需要人工批准」与「只允许从 main 部署」——
    # 一次误合并直接就是一次生产部署，这是它之外唯一的防线。保护规则配在
    # GitHub → Settings → Environments → production 上。
    environment: production
    steps:
      # ⚠️ **主机指纹必须校验，而且没配就直接失败**。
      #
      # appleboy/ssh-action 的 `fingerprint` 留空时是**静默跳过**校验 —— 那等于把
      # 部署私钥交给任何能在中间做手脚的人，而一切看起来照常工作。所以这里先查
      # 一遍，空的就红，不让它退化成「不校验」。
      - name: Require the host fingerprint
        env:
          FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: |
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::VPS_FINGERPRINT is not set; refusing to SSH without verifying the host key"
            exit 1
          fi

      # 与本工作区其它项目同一套约定：appleboy/ssh-action + VPS_* 四个 secret +
      # VPS 上一份 git 工作副本（见 docs/deployment.md §9.3）。
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: |
            set -euo pipefail
            cd /opt/ai_billing_hub

            # ⚠️ **检出这一次构建的那个 commit，不是 `git pull`。**
            # `git pull` 拿的是 main 的最新 HEAD —— 如果构建完成之后又合进来一个
            # commit，VPS 上跑的 deploy.sh 与 compose 就和镜像不是同一个版本。
            # §99 要求「immutable image tags identify the exact commit」，那条对
            # 部署脚本本身同样成立。
            git fetch --quiet origin
            git checkout --quiet --detach '${{ needs.build.outputs.tag }}'

            # ghcr 上的包默认是私有的，拉镜像要登录。令牌是这一次 job 的临时令牌，
            # 用完即登出。
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            BILLING_IMAGE_REPO='ghcr.io/${{ github.repository }}' \
            BILLING_FRONTEND_IMAGE_REPO='ghcr.io/${{ github.repository }}-frontend' \
              bash deploy/deploy.sh '${{ needs.build.outputs.tag }}'
