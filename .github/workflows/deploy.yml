# 部署到生产 VPS（spec §99；T0.9）。
#
# ⚠️ **这个 workflow 刻意很薄。**真正的部署逻辑在 `deploy/deploy.sh` 里，因为
# YAML 里的步骤**没有任何办法在生产之外跑一遍** —— 而迁移顺序、健康等待、回滚
# 恰恰是最不该第一次就在生产上验的东西。脚本可以在本地栈上整套跑通，也确实跑过。
#
# ⚠️ **这个文件本身从未在真实 VPS 上执行过**（写它的时候生产主机还没就绪）。
# 第一次跑之前请按 docs/deployment.md §9 的清单逐条确认。

name: Deploy

# ⚠️ **现在只能手动触发，刻意没有 `push: branches: [main]`。**
#
# 加上那一条，这个 workflow 就会在合并的那一刻开火 —— 而生产主机还没就绪、
# 四个 secret 也还没配。后果不只是「一次红色的 CD」：build 那一步会**真的把镜像
# 推到 ghcr**，那是个对外的副作用，不该由一次「先把代码合进去」顺带触发。
#
# 等 docs/deployment.md §9.4 那张前置清单逐条关闭之后，再把下面两行加回来：
#
#     push:
#       branches: [main]
#
# 那应该是一次**有意识的改动**，而不是从一开始就挂在那里等着。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的 commit SHA（回滚时填上一个好的那个）"
        required: true

permissions:
  contents: read
  packages: write

# ⚠️ **不允许并发部署**，而且**不取消正在跑的那个**。
# 取消一个跑到一半的部署会把栈停在中间状态（迁移跑完了、容器还没换），
# 那比等一会儿糟糕得多。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve the immutable tag
        id: resolve
        # ⚠️ 用完整 commit SHA 作为标签，**不是** latest（§99 要求
        # 「immutable image tags identify the exact commit」）。deploy.sh 会拒绝
        # latest / main / master 这类可变标签。
        run: echo "tag=${{ inputs.ref || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ **镜像在这里构建，不在 VPS 上构建。**那台机器只有 1–2 核、12 GB 可用
      # 磁盘，上面还跑着另外八个项目（docs/deployment.md §3.1）—— 在它上面做一次
      # 构建会把同机的别人一起拖慢。
      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.resolve.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:${{ steps.resolve.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to the VPS
    needs: build
    runs-on: ubuntu-latest
    # ⚠️ 用 GitHub Environment 而不是裸 secret：environment 可以配「需要人工批准」
    # 与「只允许从 main 部署」，而那两条是这里唯一的防线 —— 一次误合并直接就是
    # 一次生产部署。
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}

      # ⚠️ 私钥只从 secret 来，**绝不落到仓库里**（仓库是公开的）。
      # known_hosts 也走 secret：不校验主机指纹的 SSH 等于把部署凭据交给任何
      # 能做中间人的人。
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 把仓库里的 compose 与部署脚本同步过去。⚠️ **不同步 `.env` 与 `secrets/`** ——
      # 那些只存在于宿主机上，仓库里根本没有（`.gitignore` 挡着）。
      - name: Ship compose and the deploy script
        run: |
          rsync -az --delete \
            --include='docker-compose.yml' \
            --include='deploy/***' \
            --include='alembic.ini' \
            --exclude='*' \
            ./ "${{ secrets.DEPLOY_TARGET }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Deploy
        run: |
          ssh "${{ secrets.DEPLOY_TARGET }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' \
             && BILLING_IMAGE_REPO=ghcr.io/${{ github.repository }} \
                BILLING_FRONTEND_IMAGE_REPO=ghcr.io/${{ github.repository }}-frontend \
                bash deploy/deploy.sh '${{ needs.build.outputs.tag }}'"
