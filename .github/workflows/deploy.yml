# 部署到生产 VPS（spec §99；T0.9）。
#
# ⚠️ **这个 workflow 刻意很薄。**真正的部署逻辑在 `deploy/deploy.sh` 里，因为
# YAML 里的步骤**没有任何办法在生产之外跑一遍** —— 而迁移顺序、健康等待、回滚
# 恰恰是最不该第一次就在生产上验的东西。脚本可以在本地栈上整套跑通，也确实跑过。
#
name: Deploy

# **合并到 main 即部署**（spec §99「merge to `main` triggers GitHub Actions deployment」）。
#
# 这条触发器起初刻意不挂：主机与 secret 就绪之前，一次合并就会把镜像推到 ghcr、
# 再对着一台没准备好的主机开火。docs/deployment.md §9.4 的前置清单 2026-09-18
# 全部关闭之后才加回来（此前十几次部署全是手动触发，见 §9.4）。
#
# ⚠️ **合并的时刻就是部署的时刻**：`production` 环境 2026-09-18 起不再要求人工批准
# （Kelvin 拍板，见 §9.4）。会造成短暂停机的改动（例如改网络定义要整栈先停，§9.6）
# 要在 PR 正文里写明，由合并的人挑时间合。
#
# `workflow_dispatch` 保留：手工回滚（`ref` 填 `.last-good-deploy` 里那个 SHA，§9.5）
# 与重新部署都走它。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的 commit SHA（回滚时填上一个好的那个）"
        required: true

permissions:
  contents: read
  packages: write

# ⚠️ **不允许并发部署**，而且**不取消正在跑的那个**。
# 取消一个跑到一半的部署会把栈停在中间状态（迁移跑完了、容器还没换），
# 那比等一会儿糟糕得多。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # ⚠️ **这一步必须排在第一个，而且 `ref` 只能经 env 进 shell**（Codex #42 R1）。
      #
      # `inputs.ref` 是触发者随手填的文本。写成 `run: echo "${{ inputs.ref }}"` 时，
      # Actions 是先把文本**原样替换进脚本**再交给 bash —— 填一个 `"; curl … | sh #`
      # 就是在 runner 上执行命令；它随后还会被拼进 VPS 上的部署脚本，那里握着部署私钥
      # 和数据库。经 env 传进来的值只是一个变量，bash 不会再解析它。
      #
      # 只放行 40 位小写十六进制：那既是注入的闸，也是 §99「immutable image tags
      # identify the exact commit」本身 —— 分支名、短 SHA、latest 都不是确切的 commit。
      # 下游所有步骤只用这一步的输出，不再碰 `inputs.ref`。
      - name: Resolve the immutable tag
        id: resolve
        env:
          REF: ${{ inputs.ref || github.sha }}
        # ⚠️ 用 bash 的 `=~` 做**整串**匹配，不用 `grep -x`：grep 按行比，一个
        # 「第二行恰好是合法 SHA」的多行输入会被它放行（API 触发时输入可以带换行）。
        shell: bash
        run: |
          if [[ ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ **镜像在这里构建，不在 VPS 上构建。**那台机器只有 1–2 核、12 GB 可用
      # 磁盘，上面还跑着另外八个项目（docs/deployment.md §3.1）—— 在它上面做一次
      # 构建会把同机的别人一起拖慢。
      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.resolve.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:${{ steps.resolve.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to the VPS
    needs: build
    runs-on: ubuntu-latest
    # ⚠️ environment 的保护是「只允许从 main 部署」（手动触发时填别的分支会被拒）。
    # 「需要人工批准」那一道 2026-09-18 起撤掉了 —— 合并本身就是 Kelvin 的决定，
    # 再批一次是同一件事确认两遍（docs/deployment.md §9.4）。保护规则配在
    # GitHub → Settings → Environments → production 上。
    environment: production
    steps:
      # ⚠️ **主机指纹必须校验，而且没配就直接失败**。
      #
      # appleboy/ssh-action 的 `fingerprint` 留空时是**静默跳过**校验 —— 那等于把
      # 部署私钥交给任何能在中间做手脚的人，而一切看起来照常工作。所以这里先查
      # 一遍，空的就红，不让它退化成「不校验」。
      - name: Require the host fingerprint
        env:
          FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: |
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::VPS_FINGERPRINT is not set; refusing to SSH without verifying the host key"
            exit 1
          fi

      # 与本工作区其它项目同一套约定：appleboy/ssh-action + VPS_* 四个 secret +
      # VPS 上一份 git 工作副本（见 docs/deployment.md §9.3）。
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: |
            set -euo pipefail
            cd /opt/ai_billing_hub

            # ⚠️ **检出这一次构建的那个 commit，不是 `git pull`。**
            # `git pull` 拿的是 main 的最新 HEAD —— 如果构建完成之后又合进来一个
            # commit，VPS 上跑的 deploy.sh 与 compose 就和镜像不是同一个版本。
            # §99 要求「immutable image tags identify the exact commit」，那条对
            # 部署脚本本身同样成立。
            git fetch --quiet origin
            git checkout --quiet --detach '${{ needs.build.outputs.tag }}'

            # 两个包 2026-09-18 核对是公开的（匿名能拉），这里登录是为了不依赖那个
            # 可见性设置。令牌是这一次 job 的临时令牌，用完即登出。
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            BILLING_IMAGE_REPO='ghcr.io/${{ github.repository }}' \
            BILLING_FRONTEND_IMAGE_REPO='ghcr.io/${{ github.repository }}-frontend' \
              bash deploy/deploy.sh '${{ needs.build.outputs.tag }}'
