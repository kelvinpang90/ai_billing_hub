# frontend 容器内部的 nginx：只负责把打好的 SPA 静态文件发出去。
# 对外的路由、限流、TLS 在边缘那一层（deploy/nginx/billing.conf）。
#
# 这一层存在的理由是 spec §99 把 nginx 与 frontend 列为两个服务：边缘管路由，
# frontend 管自己的产物与缓存策略。

server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # ⚠️ index.html **绝不能缓存**。
    #
    # 它引用的是带哈希的产物文件名；一次发布之后旧的哈希文件就没了。浏览器
    # 拿着缓存的旧 index.html 去要一个已经不存在的 bundle，结果是白屏 ——
    # 而且用户强刷之前一直白着。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 反过来，带哈希的产物可以永久缓存：内容变了文件名就变了。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA 兜底：路由由前端自己解析，未知路径一律回 index.html。
    # ⚠️ 副作用是**打错的 URL 不会得到 404**，而是加载整个应用后匹配不到路由，
    # 所以前端必须自己有一页兜底（src/routes/NotFoundPage.tsx）。
    location / {
        try_files $uri /index.html;
    }
}
